<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Amable Life</title>
<meta name="description" content="Amable Life: ten claras tus próximas acciones para vivir en equilibrio. La flor de 8 áreas te dice dónde poner energía.">
<meta name="theme-color" content="#140f26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Amable Life">
<link rel="icon" id="favicon">
<link rel="apple-touch-icon" href="img/icono-life-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bl:255,255,255;
  --fondo:#140f26; --fondo2:#1d1636; --tarjeta:#221a40; --tinta:#f4f0fb; --suave:#a99fca; --linea:#352a5c;
  --acento:#f08a24; --acento2:#e2456b; --oro:#f7c35b; --sube:#4ade80; --baja:#fb7185;
}
*{box-sizing:border-box}
html,body{margin:0;overscroll-behavior-y:contain}   /* el «deslizar para actualizar» es el nuestro: el del navegador no salta a la vez */
#pullR{position:fixed;top:-44px;left:50%;margin-left:-22px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:#2a1f52;color:var(--oro);box-shadow:0 4px 14px rgba(0,0,0,.45);opacity:0;pointer-events:none;z-index:40}
#pullR.listo{background:var(--oro);color:#2a1f52}
body{background:radial-gradient(120% 60% at 50% 0%,#2a1f52 0,var(--fondo) 60%) fixed,var(--fondo);color:var(--tinta);
  font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{line-height:1.2;margin:0}
.envoltura{max-width:520px;margin:0 auto;padding:0 16px 110px}

/* Cabecera */
header.cab{position:sticky;top:0;z-index:5;background:rgba(20,15,38,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--linea)}
.cab-in{max-width:520px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.cab-in .marca{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:.2px}
.cab-in .marca svg{width:30px;height:30px;overflow:visible}
.cab-in .ver{font-size:11px;font-weight:700;color:var(--suave);border:1px solid var(--linea);border-radius:999px;padding:1px 7px}
.cab-in .der{margin-left:auto;display:flex;align-items:center;gap:8px}
#grow-panel-boton .gp-boton{border-color:var(--linea)}

/* Tarjetas y botones */
.tarjeta{background:var(--tarjeta);border:1px solid var(--linea);border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:14px 18px;font-weight:800;font-size:16px}
a.btn{text-decoration:none;box-sizing:border-box}
.btn.prim{background:linear-gradient(135deg,var(--acento),var(--acento2));color:#fff;box-shadow:0 6px 20px rgba(226,69,107,.35)}
.btn.prim:active{transform:translateY(1px)}
.btn.sec{background:rgba(var(--bl),.04);border:1.5px solid var(--linea);color:var(--tinta)}
.btn.ancho{width:100%}
.btn.peligro{background:transparent;border:1.5px solid #6b2a3f;color:var(--baja)}
.link{background:none;border:0;padding:6px 4px;color:var(--suave);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.suave{color:var(--suave)}
.peq{font-size:13px}

/* Flor */
.flor{display:block;width:100%;max-width:460px;margin:4px auto 0;overflow:visible}
.flor .petalo{animation:abre .9s cubic-bezier(.2,.9,.25,1.15) both;transform-origin:0px 0px}
@keyframes abre{from{transform:scale(0) rotate(-25deg);opacity:0}}
.flor .centro{animation:late 1.1s ease-out .55s both;transform-origin:0px 0px}
@keyframes late{0%{transform:scale(0)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.flor .eti-num{font-size:17px;font-weight:800;filter:brightness(1.3)}
.flor .eti-nom{font-size:12.5px;font-weight:800;fill:#fff;paint-order:stroke;stroke:rgba(20,12,40,.55);stroke-width:3px;stroke-linejoin:round;letter-spacing:.2px}
.mini{width:64px;height:64px;flex:none;margin:0}
.leyenda-prev{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--suave);margin-top:4px}
.leyenda-prev i{display:inline-block;width:22px;border-top:2px dashed #cbbcf5}

/* Cifras */
.cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.cifra{background:rgba(var(--bl),.04);border:1px solid var(--linea);border-radius:14px;padding:10px 8px;text-align:center}
.cifra b{display:block;font-size:20px;font-weight:800}
.cifra span{font-size:12px;color:var(--suave)}
.delta{font-size:12px;font-weight:800;white-space:nowrap}
.delta.up{color:var(--sube)} .delta.down{color:var(--baja)} .delta.igual{color:var(--suave)}

/* Lista de áreas */
.areas{margin-top:12px}
.fila{display:grid;grid-template-columns:26px 1fr 70px 30px 34px;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--linea)}
.fila:first-child{border-top:0}
.fila .em{display:flex;justify-content:center}
.fila .em .ico{width:18px;height:18px}
.ico{width:15px;height:15px;vertical-align:-2px;flex:none;display:inline-block}
.ico.g{width:26px;height:26px}
.fila .nom{font-weight:700;font-size:15px;line-height:1.2}
.fila .nom small{display:block;font-weight:600;font-size:12px;color:var(--suave)}
.fila .barra{height:8px;border-radius:99px;background:rgba(var(--bl),.08);overflow:hidden}
.fila .barra i{display:block;height:100%;border-radius:99px}
.fila b{text-align:right;font-size:16px}
.fila .delta{text-align:right}

/* Bienvenida */
.bienvenida{text-align:center;padding:0;overflow:hidden}
.bienvenida .hero{position:relative;height:300px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 50%,rgba(247,183,51,.22),transparent 62%)}
.bienvenida .hero svg{width:min(78%,340px);height:auto;filter:drop-shadow(0 10px 30px rgba(247,183,51,.25))}
.bienvenida .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 45%,var(--tarjeta))}
.bienvenida .txt{padding:0 20px 22px;margin-top:-30px;position:relative}
.bienvenida h1{font-size:26px;font-weight:800}
.bienvenida p{margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 18px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;
  background:color-mix(in srgb,var(--c) 18%,transparent);color:color-mix(in srgb,var(--c) 55%,#fff);border:1.5px solid transparent}
button.chip.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 32%,transparent);color:#fff}

/* Acción */
.accion{border-left:5px solid var(--c,var(--acento))}
.accion .eti{font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--suave);margin:0}
.accion .txt{font-size:18px;font-weight:700;margin:6px 0 12px}
.accion.hecha .txt{text-decoration:line-through;text-decoration-color:var(--c);color:var(--suave)}
.accion .acc-bots{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tareas{display:flex;flex-direction:column;gap:8px;margin:10px 0 12px}
.tarea{display:flex;align-items:center;gap:12px;text-align:left;background:rgba(var(--bl),.04);border:1px solid var(--linea);border-radius:14px;padding:11px 12px;font-weight:700;font-size:16px;color:var(--tinta)}
.tarea .caja{width:24px;height:24px;flex:none;border-radius:8px;border:2px solid var(--c);display:grid;place-items:center;color:transparent;font-size:14px}
.tarea.ok{color:var(--suave)}
.tarea.ok span:last-child{text-decoration:line-through;text-decoration-color:var(--c)}
.tarea.ok .caja{background:var(--c);color:#fff}
.regla{margin:10px 0 0;font-weight:700}
.regla small{display:block;font-weight:600;color:var(--suave);font-size:12px;margin-top:2px}
.campo-accion input{margin-top:8px}
.aviso-semana{border-color:#6b4a1f;background:linear-gradient(135deg,#3a2a17,#2a1f3f)}

/* Evaluar */
.progreso{display:flex;gap:5px;margin-top:14px}
.progreso i{flex:1;height:6px;border-radius:99px;background:rgba(var(--bl),.1)}
.progreso i.hecho{background:var(--c)}
.progreso i.actual{background:color-mix(in srgb,var(--c) 55%,transparent)}
.paso{font-size:13px;color:var(--suave);font-weight:700;margin:8px 0 0}
.eval{padding:0;overflow:hidden;text-align:center;animation:entra .45s ease-out both}
@keyframes entra{from{opacity:0;transform:translateX(24px)}}
.eval .ilus{position:relative;height:270px;background:var(--fondo2) center 30%/cover}
.eval .ilus::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,var(--tarjeta) 98%)}
.eval .cuerpo{padding:0 18px 20px;margin-top:-44px;position:relative}
.eval h2{font-size:25px;font-weight:800;margin-top:4px;color:color-mix(in srgb,var(--c) 55%,#fff)}
.pregunta{display:block;font-size:17px;font-weight:700;margin:16px 4px 0}
.valor{font-size:46px;font-weight:800;color:color-mix(in srgb,var(--c) 70%,#fff);line-height:1.1;margin-top:4px;transition:transform .15s}
.valor.pulso{transform:scale(1.15)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;margin:10px 0 6px;outline:none;
  background:linear-gradient(to right,var(--c) calc(var(--p,44.4)*1%),rgba(var(--bl),.12) 0)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:4px solid var(--c);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 25%,transparent)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid var(--c)}
.extremos{display:flex;justify-content:space-between;font-size:12px;color:var(--suave);font-weight:600}
.nota-doble{margin-top:16px;background:rgba(var(--bl),.05);border-radius:14px;padding:12px;font-weight:700}
.nota-doble b{color:color-mix(in srgb,var(--c) 70%,#fff);font-size:20px}
.nota-doble .pista{display:block;font-weight:600;font-size:13px;color:var(--suave);margin-top:2px}
details.nota{margin-top:14px;text-align:left}
details.nota summary{cursor:pointer;color:var(--suave);font-weight:700;font-size:14px;list-style:none;text-align:center}
details.nota summary::-webkit-details-marker{display:none}
textarea,input[type=text]{width:100%;font:inherit;border:1.5px solid var(--linea);border-radius:12px;padding:11px 12px;background:rgba(0,0,0,.2);color:var(--tinta)}
textarea::placeholder,input::placeholder{color:#7f74a3}
textarea{min-height:80px;resize:vertical;margin-top:8px}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--acento)}
.bots-eval{display:flex;gap:10px;margin-top:16px}
.bots-eval .btn{flex:1}

/* Resultado */
.res-tit{text-align:center;margin-top:18px}
.res-tit h1{font-size:24px;font-weight:800}
.res-tit p{margin:4px 0 0}
.resumen-txt{margin:12px 0 0;text-align:center}
.campo-accion{margin-top:12px}

/* Jardín (historial) */
.evolucion svg{width:100%;height:auto;display:block}
.jardin{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.maceta{background:var(--tarjeta);border:1px solid var(--linea);border-radius:18px;padding:12px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.maceta svg{width:110px;height:110px}
.maceta b{font-size:14px}
.maceta span{font-size:12px;color:var(--suave)}
.volver{margin-top:12px}
.comentario{border-top:1px solid var(--linea);padding:8px 0;font-size:14px}
.comentario:first-of-type{border-top:0}

/* Ajustes */
.ajustes h3{font-size:17px;margin-bottom:6px}
.ajustes p{margin:6px 0 12px}
.ajustes .bots{display:flex;flex-direction:column;gap:8px}
.interruptor{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.interruptor input{width:46px;height:26px;accent-color:var(--acento)}

/* Navegación inferior */
nav.abajo{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(20,15,38,.94);backdrop-filter:blur(10px);border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom)}
nav.abajo .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.abajo button{background:none;border:0;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:700;color:var(--suave)}
nav.abajo button span{font-size:20px;line-height:1.1;filter:grayscale(1);opacity:.6}
nav.abajo button.act{color:var(--oro)}
nav.abajo button.act span{filter:none;opacity:1}
nav.abajo .nav-flor{width:22px;height:22px;color:var(--suave);opacity:.85}
nav.abajo button.act .nav-flor{color:var(--oro);opacity:1}

/* Sellos de Práctica Integral (Grow Panel\SELLO.md, colores adaptados al tema nocturno) */
.sellos{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:26px 0 6px}
.pi-seal,.gp-seal{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.3px;
  line-height:16px;white-space:nowrap;color:#a99fca;border:1px solid #3d3266;border-radius:999px;padding:6px 12px;text-decoration:none;background:transparent}
.pi-seal::before{content:"";width:7px;height:7px;border-radius:50%;background:#4ADE80}
.gp-seal svg{width:14px;height:14px;flex:none}
.pi-seal:hover{border-color:#4ADE80}
.gp-seal:hover{border-color:#8b5cf6}

/* Portada: la flor se abre */
#splash{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 42%,#3a2470 0,#1b1236 45%,#0d0a1c 100%);transition:opacity .6s ease;overflow:hidden}
#splash.fuera{opacity:0;pointer-events:none}
#splash .logo-s{width:210px;height:210px;overflow:visible}
#splash .logo-s .petalo{animation:abre-s .7s cubic-bezier(.2,.9,.25,1.2) both;transform-origin:0px 0px}
@keyframes abre-s{from{transform:scale(0) rotate(-40deg);opacity:0}}
#splash .logo-s .centro{animation:late .8s ease-out 1.05s both;transform-origin:0px 0px}
#splash .halo{position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(247,195,91,.35),transparent 65%);
  top:50%;left:50%;transform:translate(-50%,-62%) scale(.3);opacity:0;animation:halo 1.6s ease-out 1s forwards}
@keyframes halo{to{transform:translate(-50%,-62%) scale(1);opacity:1}}
#splash h1{font-size:40px;font-weight:800;margin-top:22px;letter-spacing:.5px;animation:sube .8s ease-out 1.2s both}
#splash p{margin:4px 0 0;color:var(--suave);font-weight:600;animation:sube .8s ease-out 1.4s both}
@keyframes sube{from{opacity:0;transform:translateY(12px)}}
#splash .chispa{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--oro);box-shadow:0 0 8px var(--oro);opacity:0;animation:chispa 2.4s ease-out forwards}
@keyframes chispa{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
#splash .tocar{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);white-space:nowrap;
  font-size:16px;color:#fff;font-weight:800;padding:12px 22px;border-radius:999px;background:linear-gradient(135deg,var(--acento),var(--acento2));
  box-shadow:0 6px 24px rgba(226,69,107,.45);opacity:0;pointer-events:none;transition:opacity .4s}
#splash .tocar.ver{opacity:1;animation:latido 1.4s ease-in-out infinite}
.marca-t{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid #fff}
#splash .sellos{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:16px;right:16px;margin:0;animation:sube .8s ease-out 1.6s both}

/* Aviso flotante */
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#f4f0fb;color:#1d1636;font-weight:800;
  padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;z-index:30;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.ver{opacity:1;transform:translate(-50%,0)}
#toast.con-boton{display:flex;align-items:center;gap:14px;white-space:nowrap;padding:8px 8px 8px 16px}
#toast.ver.con-boton{pointer-events:auto}
#toast button{border:0;border-radius:9px;padding:8px 12px;background:#6d28d9;color:#fff;font-weight:800;font-size:15px}

/* v1.06 · Sin bordes (Gustavo): secciones e imágenes a todo lo ancho, como tarjetas sin marco */
.tarjeta{border:0;border-radius:0;box-shadow:none;background:transparent;margin:0 -16px;padding:22px 16px}
.tarjeta + .tarjeta{padding-top:6px}
.accion{border-left:0;background:linear-gradient(100deg,color-mix(in srgb,var(--c) 16%,transparent),transparent 75%)}
.aviso-semana{border:0}
.eval{margin:10px -16px 0}
.eval .ilus{height:min(58vh,440px);background-position:center 25%}
.eval .cuerpo{padding:0 16px 20px;margin-top:-70px}
.bienvenida{margin:0 -16px}
.bienvenida .hero{height:min(62vh,460px)}
.bienvenida .hero::after{background:linear-gradient(to bottom,transparent 40%,var(--fondo))}
.cifra,.maceta,.tarea{border:0}
.cifra{background:rgba(var(--bl),.05)}
.maceta{background:rgba(var(--bl),.05);border-radius:18px}
.tarea{background:rgba(var(--bl),.07)}
textarea,input[type=text]{border:0;background:rgba(var(--bl),.08)}
textarea:focus,input[type=text]:focus{outline:2px solid var(--acento);outline-offset:0}
.btn.sec{border:0;background:rgba(var(--bl),.09)}
.btn.peligro{border:0;background:rgba(251,113,133,.12)}
header.cab{border-bottom:0}
nav.abajo{border-top:0}
#grow-panel-boton .gp-boton{border-color:transparent}
.fila{border-top:0;padding:7px 0}
.comentario{border-top:0}
/* Jardín: flores / acciones */
.seg{display:flex;gap:6px;background:rgba(var(--bl),.06);padding:4px;border-radius:14px;margin-top:14px}
.seg button{flex:1;border:0;background:transparent;color:var(--suave);font-weight:800;padding:9px;border-radius:11px}
.seg button.on{background:rgba(var(--bl),.12);color:var(--tinta)}
.semana-acc{margin:0 -16px;padding:16px;background:linear-gradient(100deg,color-mix(in srgb,var(--c) 14%,transparent),transparent 75%)}
.semana-acc + .semana-acc{margin-top:8px}
.sa-cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sa-cab span{font-size:12px;color:var(--suave)}
.sa-area{margin:4px 0 8px;font-weight:700;font-size:14px}
.sa-area .estrella{color:var(--oro)}
.semana-acc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.semana-acc li{display:flex;align-items:center;gap:10px;font-size:15px}
.semana-acc li .caja{width:20px;height:20px;flex:none;border-radius:6px;border:2px solid var(--c);display:grid;place-items:center;color:transparent;font-size:12px}
.semana-acc li.ok .caja{background:var(--c);color:#fff}
.semana-acc li.ok span:last-child{color:var(--suave);text-decoration:line-through;text-decoration-color:var(--c)}
.resumen-acc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
/* Cuenta */
.cuenta{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cuenta img{width:44px;height:44px;border-radius:50%}
.cuenta b{display:block}
.cuenta span{font-size:13px;color:var(--suave)}
.btn.google{background:#fff;color:#1f1f1f}
.nube-ok{color:var(--sube);font-weight:700;font-size:13px}

/* v1.07 · Flor más grande (de borde a borde) y sin copiar texto al mantener pulsado */
.flor:not(.mini){width:calc(100% + 32px);max-width:none;margin:22px -16px 14px}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg{-webkit-user-drag:none}

/* v1.08 · Micrófono para dictar */

.hoja.ver .hoja-in{transform:none}

  .hoja-in:has(.ev-hoja){min-height:calc(100vh - 12px);min-height:calc(100dvh - 12px);display:flex;flex-direction:column}

  .ev-cols .ev-col:last-child{padding-top:4px}
}

.alarma-op small{grid-column:1;font-size:12.5px;color:var(--suave)}
.alarma-op i{grid-column:2;grid-row:1 / span 2;font-style:normal;color:#16a34a;font-weight:800}
.alarma-op.sel{border-color:#8b5cf6;background:rgba(139,92,246,.12)}
.alarma{text-align:center;padding:4px 0 2px}
.alarma-ico{color:var(--c, #f7c35b);animation:alarmaMueve .5s ease-in-out infinite alternate;display:inline-block}
@keyframes alarmaMueve{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.alarma-cuando{margin:6px 0 2px;font-size:14px;color:var(--suave)}
.alarma h2{margin:0 0 16px;font-size:22px}
.alarma .ed-bots{margin-top:10px}
#splash .splash-ver{flex-basis:100%;margin:10px 0 0;font-size:13px;letter-spacing:.3px;color:rgba(233,228,255,.6);text-align:center}
.rec-pers{margin:6px 0 4px;padding:12px;border-radius:14px;background:rgba(var(--bl),.05);border:1px solid var(--linea)}
.rec-pers .rp-fila{display:flex;gap:8px;align-items:center}
.rec-pers input{width:84px;margin:0;text-align:center;font-size:17px}
.rec-pers select{flex:1;margin:0}
.rec-pers .rp-ver{margin:8px 0 10px;font-size:13px;color:#f59e0b}
.ml-sinc{display:block;font-size:12px;font-weight:500;color:#16a34a;margin-top:1px}
.ml-sinc.mal{color:#ef4444}
button.na-pie{display:block;width:100%;border:0;background:none;font-family:inherit;text-align:left;cursor:pointer;border-radius:0 0 12px 12px}
button.na-pie:hover{color:rgba(43,36,51,.9);text-decoration:underline;background:rgba(0,0,0,.04)}
.cta-b{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(var(--bl),.05);border:1px solid var(--linea)}
.cta-b h4{margin:0 0 4px;font-size:15px}
.cta-b p{margin:0 0 8px}
.cta-b .bots{margin-top:4px}
.cta-peligro{border-color:color-mix(in srgb,#ef4444 40%,transparent)}
.ev-ctx{position:fixed;z-index:46;min-width:230px;padding:6px 0;border-radius:12px;background:var(--tarjeta);border:1px solid var(--linea);box-shadow:0 12px 32px rgba(0,0,0,.45)}
html.claro .ev-ctx{box-shadow:0 10px 28px rgba(40,20,90,.22)}
.ev-ctx > button{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;color:var(--tinta);padding:10px 16px;font:inherit;font-size:15px;font-weight:600;text-align:left;cursor:pointer}
.ev-ctx > button:hover{background:rgba(var(--bl),.08)}
.ev-ctx > button svg{color:var(--suave);flex:none}
.ev-ctx .ctx-hecho,.ev-ctx .ctx-hecho svg{color:#4ade80}
html.claro .ev-ctx .ctx-hecho,html.claro .ev-ctx .ctx-hecho svg{color:#15803d}
.ev-ctx .ctx-borrar{color:#f87171}
html.claro .ev-ctx .ctx-borrar{color:#dc2626}
.ev-ctx .ctx-borrar svg{color:inherit}
.ev-ctx hr{border:0;border-top:1px solid var(--linea);margin:6px 0}
.ctx-prio{display:flex;align-items:center;gap:6px;padding:6px 16px}
.ctx-sub{position:relative}
.ctx-sub > button{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;color:var(--tinta);padding:10px 16px;font:inherit;font-size:15px;font-weight:600;text-align:left;cursor:pointer}
.ctx-sub > button:hover,.ctx-sub.abierto > button{background:rgba(var(--bl),.08)}
.ctx-sub > button svg{color:var(--suave);flex:none}
.ctx-fl{margin-left:auto;font-style:normal;font-size:18px;color:var(--suave)}
.ctx-subm{display:none;position:absolute;left:100%;top:-6px;min-width:240px;padding:6px 0;border-radius:12px;background:var(--tarjeta);border:1px solid var(--linea);box-shadow:0 12px 32px rgba(0,0,0,.45)}
.ctx-sub:hover .ctx-subm,.ctx-sub.abierto .ctx-subm{display:block}
.ev-ctx.izq .ctx-subm{left:auto;right:100%}
.ctx-subm button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--tinta);padding:9px 14px;font:inherit;font-size:14px;text-align:left;cursor:pointer}
.ctx-subm button:hover{background:rgba(var(--bl),.08)}
.ctx-subm button span{flex:1}
.ctx-subm button i{font-style:normal;color:var(--oro);font-weight:900}
@media (max-width:599px){ .ctx-subm{position:static;box-shadow:none;border:0;border-radius:0;padding:0 0 0 18px} }
/* notas adhesivas */
.nota-ad{position:fixed;z-index:44;width:260px;min-height:200px;max-height:70vh;display:flex;flex-direction:column;background:var(--nc,#fff1a8);color:#2b2433;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden}
.na-bar{position:relative;display:flex;justify-content:flex-end;gap:2px;padding:4px 4px 0;height:28px;cursor:grab;background:color-mix(in srgb,var(--nc,#fff1a8) 85%,#000)}
.na-bar:active{cursor:grabbing}
.na-b{width:26px;height:24px;border:0;border-radius:6px;background:none;color:#2b2433;display:grid;place-items:center;cursor:pointer;opacity:.6;padding:0}
.na-b:hover{opacity:1;background:rgba(0,0,0,.08)}
.na-cols{position:absolute;top:30px;right:4px;z-index:2;display:grid;grid-template-columns:repeat(4,26px);gap:6px;padding:8px;border-radius:10px;background:#fff;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.na-cols[hidden]{display:none}
.na-cols button{width:26px;height:26px;border-radius:6px;border:1px solid rgba(0,0,0,.15);cursor:pointer}
.na-t{padding:10px 14px 4px;font-size:16px;font-weight:700;outline:none;line-height:1.3}
.na-d{flex:1;padding:4px 14px 8px;font-size:14px;outline:none;overflow:auto;line-height:1.45;min-height:60px}
.na-t:empty::before,.na-d:empty::before{content:attr(data-ph);color:rgba(43,36,51,.45)}
.na-d a{color:#1d4ed8}
.na-pie{padding:6px 14px 8px;font-size:11.5px;color:rgba(43,36,51,.6)}
.ctx-prio span{flex:1;font-size:14px;color:var(--suave);font-weight:600}
.ctx-prio button{width:34px;height:34px;border-radius:9px;border:0;background:none;display:grid;place-items:center;cursor:pointer;opacity:.45}
.ctx-prio button:hover{opacity:.8}
.ctx-prio button.sel{opacity:1;background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:inset 0 0 0 1.5px var(--c)}
/* ---- Suscripción (Premium) ---- */
.prem-hero{display:flex;align-items:center;gap:16px;margin:14px 0 16px}
.prem-logo{position:relative;flex:none;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(247,195,91,.28),transparent 70%)}
.prem-corona{position:absolute;top:-6px;right:-4px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#f7c35b;color:#2a1d05;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.prem-corona svg{width:20px;height:20px}
.prem-hero h2{margin:0 0 4px;font-size:24px}
.prem-hero p{margin:0;color:var(--suave);font-size:14.5px;line-height:1.4}
.prem-precio{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:18px;background:color-mix(in srgb,#f7c35b 14%,var(--tarjeta));border:1px solid color-mix(in srgb,#f7c35b 40%,transparent);margin-bottom:12px}
.prem-precio b{font-size:28px;font-weight:800}
.prem-precio span{font-size:15px;font-weight:700}
.prem-precio small{display:block;color:var(--suave);font-size:12.5px;margin-top:2px}
.prem-chip{flex:none;font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;background:rgba(var(--bl),.1);color:var(--tinta)}
.prem-sec{padding:14px 16px;border-radius:18px;background:var(--tarjeta);border:1px solid var(--linea);margin-bottom:12px}
.prem-sec h3{margin:0 0 6px;font-size:16px}
.prem-p{margin:0 0 8px;color:var(--suave);font-size:14px}
.prem-ok{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.prem-ok li{display:flex;align-items:center;gap:10px;font-size:14.5px}
.prem-ok svg{flex:none;color:#16a34a}
.prem-lista{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.prem-f{display:flex;gap:14px;align-items:flex-start}
.prem-ic{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.prem-f b{font-size:15px}
.prem-f p{margin:3px 0 0;color:var(--suave);font-size:13.5px;line-height:1.4}
.prem-pasos{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.prem-pasos li{display:grid;grid-template-columns:5.5em 1fr;gap:10px;font-size:14px;align-items:baseline}
.prem-pasos b{color:var(--oro)}
.prem-pasos span{color:var(--suave)}
@media (min-width:900px){
  body.v-premium .envoltura{max-width:760px}
  .prem-lista{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px}
}
/* ---- Estadísticas ---- */
.est-cab{margin-top:12px}
.est-volver{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.est-tit{margin:6px 0 10px}
.est-tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(var(--bl),.08);margin-bottom:12px}
.est-tabs button{flex:1;border:0;border-radius:999px;padding:9px 6px;background:none;color:var(--suave);font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.est-tabs button.sel{background:var(--tarjeta);color:var(--tinta);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.est-per{display:flex;gap:6px;margin:-2px 0 12px;flex-wrap:wrap}
.est-per-txt{margin:0 0 8px;color:var(--suave);font-size:14px}
.est-per button{border:1px solid var(--linea);border-radius:999px;padding:6px 14px;background:none;color:var(--suave);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.est-per button.sel{background:rgba(var(--bl),.1);color:var(--tinta);border-color:rgba(var(--bl),.3)}
.et-fila{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.et{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:16px;background:var(--tarjeta);border:1px solid var(--linea);min-width:0}
.et b{font-size:24px;font-weight:800;line-height:1.1}
.et span{font-size:12.5px;color:var(--suave);line-height:1.25}
.et small{font-size:11.5px;color:var(--suave);margin-top:2px}
.et small .sube{color:#4ade80;font-weight:800} .et small .baja{color:#f87171;font-weight:800}
html.claro .et small .sube{color:#15803d} html.claro .et small .baja{color:#dc2626}
.ec-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.ec{padding:14px 14px 12px;border-radius:18px;background:var(--tarjeta);border:1px solid var(--linea);min-width:0}
.ec-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.ec-cab h3{margin:0;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.ec-pt{width:10px;height:10px;border-radius:3px;display:inline-block}
.ec-mas,.ec-sub{font-size:12.5px;color:var(--suave);font-weight:700}
.ec-res{cursor:pointer}
.ec-res:hover{border-color:rgba(var(--bl),.3)}
.ec-num{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:2px 0 4px}
.ec-num b{font-size:30px;font-weight:800;line-height:1}
.ec-num span{font-size:13px;color:var(--suave)}
.ec-sub2{margin:0 0 6px;font-size:12.5px;color:var(--suave)}
.ec-vacio{margin:6px 0;color:var(--suave);font-size:14px}
.eg{display:block;width:100%;height:auto;overflow:visible}
.eg-rej{stroke:rgba(var(--bl),.1);stroke-width:1;stroke-dasharray:3 4}
.eg-rej.base{stroke:rgba(var(--bl),.25);stroke-dasharray:none}
.eg-eje{font-size:10px;fill:var(--suave);font-family:inherit}
.eg-eje.hoy{fill:var(--tinta);font-weight:800}
.eg-hit{cursor:pointer}
.eg-hit.on{fill:rgba(var(--bl),.07)}
.eh{display:flex;flex-direction:column;gap:7px}
.eh-f{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 2.6em;align-items:center;gap:10px;font-size:13px;border-radius:8px;padding:1px 2px}
.eh-f.on{background:rgba(var(--bl),.06)}
.eh-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tinta)}
.eh-t .ico{width:12px;height:12px;vertical-align:-1px}
.eh-b{height:10px;border-radius:99px;background:rgba(var(--bl),.07);overflow:hidden}
.eh-b i{display:block;height:100%;border-radius:99px}
.eh-v{text-align:right;font-weight:800}
.eprog{height:12px;border-radius:99px;background:rgba(var(--bl),.08);overflow:hidden;margin-top:6px}
.eprog i{display:block;height:100%;border-radius:99px}
.eley{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--suave)}
.eley span{display:inline-flex;align-items:center;gap:6px}
.eley i{width:10px;height:10px;border-radius:3px;display:inline-block}
.eha-lista{display:flex;flex-direction:column}
.eha{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--linea)}
.eha:last-child{border-bottom:0}
.eha-c{display:flex;flex-direction:column;min-width:0}
.eha-c b{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eha-c small,.eha-n small{font-size:12px;color:var(--suave)}
.eha-n{display:flex;flex-direction:column;align-items:flex-end}
.eha-n b{font-size:18px}
.eha-p{grid-column:1 / -1;display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;margin-top:2px}
.eha-p i,.eley-p i{display:block;aspect-ratio:1;border-radius:50%;max-width:18px;width:100%;justify-self:center}
.eley-p i{width:11px;height:11px;aspect-ratio:auto}
.p-hecho{background:#16a34a}
.p-falta{background:none;box-shadow:inset 0 0 0 2px rgba(248,113,113,.75)}
.p-no,.p-futuro{background:rgba(var(--bl),.1)}
#est-tip{position:fixed;z-index:60;pointer-events:none;background:#2f2b38;color:#f1eef8;font-size:13px;font-weight:700;padding:6px 10px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.35);white-space:nowrap}
#est-tip[hidden]{display:none}
@media (max-width:420px){ .et b{font-size:20px} .et{padding:10px} .eh-f{grid-template-columns:minmax(0,7.5em) minmax(0,1fr) 2.4em} }
@media (min-width:900px){
  body.v-estad .envoltura{max-width:1040px}
  .ec-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ec-grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .et-fila{gap:12px}
  .est-tabs{max-width:520px}
}
.frec-panel{padding:10px 4px 2px}
.frec-panel[hidden]{display:none}
.frec-panel .eti{margin-top:0}
.frec-sel{width:auto;min-width:170px;margin:0 0 10px;padding:9px 12px;font-weight:700}
.frec-ayuda{margin:0 0 6px}
.frec-l{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:600}
.frec-l select,.frec-l input{width:auto;margin:0;padding:8px 10px}
.frec-l input{width:72px;text-align:center}
#frec-diario[hidden],#frec-semanal[hidden],#frec-intervalo[hidden]{display:none}
.frec-sel,.frec-l select,.frec-l input,.meta-h select{background:rgba(var(--bl),.08);color:var(--tinta);border:1px solid var(--linea);border-radius:10px;color-scheme:dark;font:inherit;font-weight:700}
html.claro .frec-sel,html.claro .frec-l select,html.claro .frec-l input,html.claro .meta-h select{color-scheme:light;background:#fff}
.cab-menu{width:42px;height:42px;border:0;border-radius:50%;background:none;color:var(--tinta);display:grid;place-items:center;cursor:pointer;padding:0;margin-right:-8px}
.cab-menu:hover{background:rgba(var(--bl),.1)}
.ml{position:fixed;inset:0;z-index:45;background:rgba(8,5,20,0);transition:background .25s}
.ml.ver{background:rgba(8,5,20,.55)}
.ml-in{position:absolute;top:0;bottom:0;left:0;width:min(330px,86vw);background:var(--fondo2);border-radius:0 22px 22px 0;overflow:auto;padding:14px 0 calc(16px + env(safe-area-inset-bottom));transform:translateX(-100%);transition:transform .25s ease;box-shadow:8px 0 30px rgba(0,0,0,.4)}
.ml.ver .ml-in{transform:none}
.ml-cab{display:flex;align-items:center;gap:10px;padding:4px 10px 12px 22px}
.ml-cab b{font-size:21px;font-weight:800}
.ml-tv{flex:1;display:flex;flex-direction:column;min-width:0}
.ml-tv small{font-size:12px;color:var(--suave);font-weight:700}
.ml-g{padding:6px 0;border-top:1px solid var(--linea)}
.ml-cab + .ml-g{border-top:0}
.ml-f{display:flex;align-items:center;gap:20px;width:calc(100% - 16px);margin:1px 0;border:0;background:none;color:var(--tinta);font:inherit;font-size:16px;font-weight:600;padding:12px 22px;border-radius:0 99px 99px 0;text-align:left;cursor:pointer}
.ml-f:hover{background:rgba(var(--bl),.07)}
.ml-f.sel{background:color-mix(in srgb,var(--oro) 26%,transparent)}
.ml-f svg{flex:none;color:var(--suave)}
.ml-f.sel svg{color:var(--tinta)}
.ml-u{display:flex;align-items:center;gap:14px;padding:10px 22px}
.ml-u img,.ml-ini{width:46px;height:46px;border-radius:50%;flex:none;object-fit:cover}
.ml-ini{display:grid;place-items:center;background:var(--oro);color:#2a1d05;font-weight:800;font-size:20px}
.ml-u span{display:flex;flex-direction:column;min-width:0}
.ml-u b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ml-u small{color:var(--suave);font-size:12.5px}
.ml-nota{margin:2px 22px 6px;font-size:13px;color:var(--suave)}
.ml-ver{margin:10px 22px 0;font-size:12px;color:var(--suave)}
/* el mes y los días se quedan fijos arriba al bajar por las horas (Gustavo) */

html.claro .ag-fijo{background:rgba(243,240,249,.97)}
.ag-fijo .ag-nav{margin:2px 0}
.ag-fijo .rj-cab{margin-top:0}
@media (max-width:899px){ .ag-modos{margin-top:12px} .rj.sem .rj-ev .campanita{width:11px;height:11px;margin-right:1px;vertical-align:-1px} }
@media (min-width:900px){ body.ancho .ag-fijo{top:64px;margin:0;padding:0;background:var(--fondo2);backdrop-filter:none} body.ancho .ag-fijo .rj-cab{position:static} }
.aj-ico svg{display:block;margin:auto;color:var(--oro)}
.cal-ayuda{margin-top:10px;font-size:13.5px;color:var(--suave)}
.cal-ayuda summary{cursor:pointer;font-weight:700;color:var(--tinta)}
.cal-ayuda p{margin:6px 0 0}
.cal-res{margin-top:10px;padding:12px 14px;border-radius:14px;background:rgba(var(--bl),.06)}
.cal-res p{margin:0 0 8px}
.cal-ok{margin:10px 0 0;font-weight:800;color:var(--sube)}
.tt-op{display:flex;align-items:flex-start;gap:10px;padding:8px 0;cursor:pointer}
.tt-op input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--oro);flex:none}
.tt-op span{display:flex;flex-direction:column;gap:2px;font-size:14.5px}
.tt-op small{font-size:12.5px;color:var(--suave)}
html.claro .cal-ok{color:#15803d}
.hoja-asa{display:none}
@media (min-width:900px){
  .hoja-in{position:relative}
  .hoja-asa{display:flex;justify-content:center;align-items:center;position:absolute;top:3px;left:50%;transform:translateX(-50%);width:72px;height:22px;z-index:3;color:var(--suave);cursor:grab;border-radius:8px}
  .hoja-asa:hover{color:var(--tinta);background:rgba(var(--bl),.07)}
  body.moviendo,body.moviendo *{cursor:grabbing!important;user-select:none}
}

<script>
'use strict';
const VERSION = 'v4.26';
const CLAVE = 'equilibra.datos';
const CLAVE_SONIDO = 'equilibra.sonido';

/* Las 8 áreas = los 8 pétalos (decididas con Gustavo el 19/10/2026). Orden = sentido de las agujas del reloj desde arriba. */
const AREAS = [
  {id:'salud', corto:'Salud',       nombre:'Salud', etiqueta:'Salud',                   color:'#22a35a',
   pregunta:'¿Cómo te sientes con tu cuerpo, tu energía y tu descanso?', ejemplos:['caminar 20 minutos el martes y el jueves', 'acostarme antes de las 23 h tres noches', 'beber 2 litros de agua al día']},
  {id:'pareja', corto:'Pareja',      nombre:'Pareja', etiqueta:'Pareja',                  color:'#e2456b',
   pregunta:'¿Cómo estás en tu vida de pareja o con tu situación sentimental?', ejemplos:['una cena sin móviles el viernes', 'decirle algo que valoro de mi pareja', 'planear juntos una salida para el finde']},
  {id:'familia', corto:'Familia',     nombre:'Familia y amigos', etiqueta:'Familia y|amigos',        color:'#f08a24',
   pregunta:'¿Qué tan cuidados y presentes están tus vínculos cercanos?', ejemplos:['llamar a un amigo que hace tiempo no veo', 'comer con mi familia el domingo', 'escribir a alguien para quedar']},
  {id:'trabajo', corto:'Trabajo',     nombre:'Trabajo y dinero', etiqueta:'Trabajo y|dinero',        color:'#2b7fd4',
   dobles:[{id:'gusta', texto:'¿Te gusta tu trabajo?', corto:'Te gusta'},
           {id:'dinero',texto:'¿Te da el dinero que necesitas?', corto:'Dinero'}],
   ejemplos:['revisar mis gastos del mes el domingo', 'dedicar 1 hora a la tarea que más me gusta', 'buscar una forma de ganar algo más este mes']},
  {id:'crecimiento', corto:'Crecimiento', nombre:'Crecimiento personal', etiqueta:'Crecimiento|personal',    color:'#8b5cf6',
   pregunta:'¿Estás aprendiendo y creciendo como te gustaría?', ejemplos:['leer 10 páginas cada noche', 'ver un curso o charla de 30 minutos', 'escribir 3 cosas que aprendí esta semana']},
  {id:'ocio', corto:'Ocio',        nombre:'Ocio y disfrute', etiqueta:'Ocio y|disfrute',         color:'#e0a810',
   pregunta:'¿Tienes tiempo para disfrutar, jugar y descansar?', ejemplos:['reservar el sábado por la tarde para algo que me guste', 'salir a un sitio nuevo', 'una hora de mi hobby sin pantallas']},
  {id:'proposito', corto:'Propósito',   nombre:'Propósito / Espiritualidad', etiqueta:'Propósito /|Espiritualidad', color:'#14a3a3',
   pregunta:'¿Sientes que tu vida tiene sentido y dirección?', ejemplos:['10 minutos de silencio o meditación cada mañana', 'escribir para qué hago lo que hago', 'ayudar a alguien sin esperar nada']},
  {id:'hogar', corto:'Entorno',     nombre:'Entorno y hogar', etiqueta:'Entorno|y hogar',         color:'#b0703c',
   pregunta:'¿Te sientes a gusto donde y cómo vives?', ejemplos:['ordenar el escritorio y dejarlo despejado', 'tirar o regalar 5 cosas que no uso', 'poner una planta o algo bonito en casa']},
];

const $ = s => document.querySelector(s);
const app = $('#app');

/* ---------- Datos (v2: acciones + niveles por área) ----------
   D = {v:2, niveles:{area:'bien'|'una'|'mas'}, detalle:{trabajo:{gusta,dinero}}, comentarios:{}, nivelesMod,
        revisiones:[{id, fecha, niveles, detalle, comentarios}], acciones:[{id, area, texto, hecha, creada, hechaEn, mod}], borradas:[] } */
const NIVELES = {
  bien: {marca:'✓',  titulo:'Estoy bien',             sub:'No necesita acciones',        n:0, peso:0},
  una:  {marca:'1',  titulo:'Una acción a la semana', sub:'Necesita un pequeño paso',    n:1, peso:1},
  mas:  {marca:'2+', titulo:'Necesita más acción',    sub:'2 o 3 acciones esta semana',  n:2, peso:2},
};
/* Salud (venido de Amable PC): agua, movimiento y pasos */
const SALUD_DEF = {aguaOn:true, aguaMin:45, aguaGoal:8, movOn:true, movMin:60, aguaNext:0, movNext:0, days:{},
  meta:8000, pasosOn:true, voz:true, cada:500, bloqueOn:true, bloque:2000, caminarOn:true, caminarHecho:null, pasos:{}, mod:null};
const nuevaSalud = (x = {}) => Object.assign({}, SALUD_DEF, {days:{}, pasos:{}}, x);
/* Bloques de tiempo (venidos de Amable PC): días → bloque → hasta 3 actividades {t, d, acc} */
const BLOQUES_DEF = {days:{}, startVoice:true, remindOn:true, remindMin:5, sleepOn:true, sleepDone:'', ultimo:null, mod:null};
const nuevosBloques = (x = {}) => Object.assign({}, BLOQUES_DEF, {days:{}}, x);
const vacio = () => ({v:2, niveles:{}, detalle:{}, comentarios:{}, nivelesMod:null, revisiones:[], acciones:[], borradas:[], salud: nuevaSalud(), bloques: nuevosBloques(), agenda: {eventos: []}});
const nivelDeNota = n => n <= 4 ? 'mas' : n <= 7 ? 'una' : 'bien';
/* Pasa los datos de v1 (notas del 1 al 10 y acciones por semana) al formato nuevo */
function migrar(d){
  const v = vacio(); v.borradas = d.borradas || [];
  (d.evaluaciones || []).forEach(e => {
    const niveles = {}; Object.keys(e.notas || {}).forEach(k => niveles[k] = nivelDeNota(e.notas[k]));
    v.revisiones.push({id: e.id, fecha: e.fecha, niveles, detalle: {}, comentarios: e.comentarios || {}});
    const ts = e.accion ? (Array.isArray(e.accion.tareas) ? e.accion.tareas : e.accion.texto ? [{texto: e.accion.texto, hecha: !!e.accion.hecha}] : []) : [];
    ts.forEach((t,k) => v.acciones.push({id: e.id + '-' + k, area: e.accion.area, texto: t.texto, hecha: !!t.hecha,
      creada: e.accion.fecha || e.fecha, hechaEn: t.hecha ? (e.mod || e.accion.fecha || e.fecha) : null, mod: e.mod || e.fecha}));
  });
  const ult = v.revisiones[v.revisiones.length-1];
  if(ult){ v.niveles = {...ult.niveles}; v.comentarios = {...ult.comentarios}; v.nivelesMod = ult.fecha; }
  return v;
}
function normalizar(d){
  if(!d) return vacio();
  const r = d.v !== 2 ? migrar(d) : Object.assign(vacio(), d);
  r.salud = nuevaSalud(r.salud || {});
  r.bloques = nuevosBloques(r.bloques || {});
  r.agenda = {eventos: Array.isArray((r.agenda || {}).eventos) ? r.agenda.eventos : []};
  return r;
}
function cargar(){
  try{ const d = JSON.parse(localStorage.getItem(CLAVE)); if(d) return normalizar(d); }catch(e){}
  return vacio();
}
function guardar(){
  try{ localStorage.setItem(CLAVE, JSON.stringify(D)); }catch(e){ aviso('No se pudo guardar en este navegador'); }
  enviarResumen();
  programarSubida();
  enviarRecordatorios();
}
const ahoraISO = () => new Date().toISOString();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const areaDe = id => AREAS.find(a => a.id === id);
/* Tareas sin área (p. ej. las de TickTick cuya lista no se llama como un área): se ven en gris como «Sin área» */
const SIN_AREA = {id: 'sin', nombre: 'Sin área', corto: 'Sin área', color: '#94a3b8'};
const areaO = id => areaDe(id) || SIN_AREA;
const nivel = id => D.niveles[id] || null;
const tieneDatos = () => D.revisiones.length > 0 || D.acciones.length > 0;
const ultimaRevision = () => D.revisiones[D.revisiones.length-1] || null;
const pesoArea = id => nivel(id) ? NIVELES[nivel(id)].peso : 0;
/* Pendientes en el orden que elige la persona (seis puntitos). Las nuevas van al final:
   las de las áreas tienen toda la semana, así que no pasan delante solas. */
function pendientes(){
  const p = D.acciones.filter(a => !a.hecha);
  const sin = p.filter(a => typeof a.orden !== 'number');
  if(sin.length){   // acciones de antes del orden propio: se colocan como estaban
    let n = Math.max(-1, ...p.filter(a => typeof a.orden === 'number').map(a => a.orden));
    sin.sort((x,y) => (pesoArea(y.area) - pesoArea(x.area)) || (x.creada < y.creada ? -1 : 1)).forEach(a => { a.orden = ++n; });
  }
  return p.sort((x,y) => (x.orden - y.orden) || (x.creada < y.creada ? -1 : 1));
}
const proximas = () => pendientes().slice(0, 3);
/* Áreas que piden acción y aún no tienen suficientes acciones pendientes */
function faltan(){
  return AREAS.filter(a => nivel(a.id) && NIVELES[nivel(a.id)].n > 0)
    .map(a => ({area: a, faltan: NIVELES[nivel(a.id)].n - D.acciones.filter(x => x.area === a.id && !x.hecha).length}))
    .filter(x => x.faltan > 0).sort((x,y) => pesoArea(y.area.id) - pesoArea(x.area.id));
}
function nuevaAccion(area, texto){
  const orden = Math.min(1, ...pendientes().map(a => a.orden)) - 1;   // las nuevas, siempre arriba
  D.acciones.push({id: uid(), area, texto, hecha:false, creada: ahoraISO(), hechaEn:null, mod: ahoraISO(), orden});
}
function moverAcciones(ids){
  const resto = pendientes().filter(a => !ids.includes(a.id));
  [...ids.map(id => D.acciones.find(a => a.id === id)), ...resto].forEach((a, i) => { if(a && a.orden !== i){ a.orden = i; a.mod = ahoraISO(); } });
  guardar(); const y = window.scrollY; render(); window.scrollTo(0, y);
}
function fecha(f, larga){
  return new Date(f).toLocaleDateString('es-ES', larga ? {weekday:'long', day:'numeric', month:'long', year:'numeric'} : {day:'numeric', month:'short', year:'numeric'});
}
function diasDesde(f){ const a = new Date(f); a.setHours(0,0,0,0); const b = new Date(); b.setHours(0,0,0,0); return Math.round((b-a)/864e5); }
function esc(t){ return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* Semanas (lunes a domingo) */
function lunes(f){ const d = new Date(f); d.setHours(0,0,0,0); d.setDate(d.getDate() - (d.getDay()+6)%7); return d; }
function claveSemana(f){ const l = lunes(f); return `${l.getFullYear()}-${String(l.getMonth()+1).padStart(2,'0')}-${String(l.getDate()).padStart(2,'0')}`; }
function rangoSemana(clave){
  const [y,m,d] = clave.split('-').map(Number), l = new Date(y, m-1, d), dom = new Date(y, m-1, d+6);
  const o = {day:'numeric', month:'short'};
  return `${l.toLocaleDateString('es-ES', o)} – ${dom.toLocaleDateString('es-ES', o)}`;
}
function textoSemana(clave){
  const hoy = claveSemana(new Date()), pasada = claveSemana(new Date(Date.now() - 7*864e5));
  return clave === hoy ? 'Esta semana' : clave === pasada ? 'La semana pasada' : `Semana del ${rangoSemana(clave)}`;
}
const hechasEstaSemana = () => D.acciones.filter(a => a.hecha && a.hechaEn && claveSemana(a.hechaEn) === claveSemana(new Date())).length;

let D = cargar();

/* ---------- Sonidos (Web Audio, sin archivos) ---------- */
let ctxAudio = null;
/* 4.19 (Gustavo: «sale la ventana pero no suena»): el navegador no deja sonar hasta que tocas la página después de abrirla o
   recargarla. Con cualquier toque, clic o tecla se deja el audio listo para las alarmas. */
function abrirAudio(){ try{ if(!ctxAudio) ctxAudio = new (window.AudioContext || window.webkitAudioContext)(); if(ctxAudio.state === 'suspended') ctxAudio.resume(); }catch(e){} }
['pointerdown', 'keydown', 'touchstart'].forEach(t => addEventListener(t, abrirAudio, {capture: true, passive: true}));
let sonidoOn = (() => { try{ return localStorage.getItem(CLAVE_SONIDO) !== 'no'; }catch(e){ return true; } })();
const ESCALA = [196.00, 220.00, 246.94, 293.66, 329.63, 392.00, 440.00, 493.88, 587.33, 659.25]; // sol mayor pentatónica
function audio(){
  if(!sonidoOn) return null;
  try{ if(!ctxAudio) ctxAudio = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  if(ctxAudio.state === 'suspended') ctxAudio.resume();
  return ctxAudio;
}
/* Una nota cálida tipo campana con un «brum» grave debajo */
function nota(frec, t0, vol = .22, dur = 1.1, brum = true){
  const c = audio(); if(!c) return;
  const t = c.currentTime + (t0 || 0);
  const salida = c.createGain(); salida.gain.value = vol; salida.connect(c.destination);
  const capas = [[frec,'sine',1],[frec*2,'triangle',.28],[frec*3,'sine',.08]];
  if(brum) capas.push([frec/2,'sine',.55]);
  capas.forEach(([f,tipo,g], i) => {
    const o = c.createOscillator(), e = c.createGain();
    o.type = tipo; o.frequency.setValueAtTime(i === 3 ? f*1.06 : f, t);
    if(i === 3) o.frequency.exponentialRampToValueAtTime(f, t + .18);
    e.gain.setValueAtTime(0.0001, t);
    e.gain.exponentialRampToValueAtTime(g, t + (i === 3 ? .03 : .012));
    e.gain.exponentialRampToValueAtTime(0.0001, t + dur * (i === 3 ? .7 : i === 0 ? 1 : .55));
    o.connect(e); e.connect(salida); o.start(t); o.stop(t + dur + .05);
  });
}
function sonarPaso(i){ nota(ESCALA[Math.min(i, ESCALA.length-1)], 0, .2, .9); }
function sonarMover(v){ const c = audio(); if(!c) return; nota(ESCALA[v-1] * 2, 0, .05, .18, false); }
function sonarFinal(){ [0,2,4,5,7,9].forEach((n,k) => nota(ESCALA[n], k*.09, .16, 1.4, k === 0)); }
function sonarPortada(){ AREAS.forEach((a,i) => nota(ESCALA[i], .12 + i*.11, .14, 1.3, i === 0)); nota(ESCALA[9], 1.15, .12, 2.2, false); }
const musica = new Audio('sonido/inicio.mp3'); musica.preload = 'auto'; musica.volume = .9;
function sonarHecho(){ nota(ESCALA[5], 0, .15, .6, false); nota(ESCALA[7], .1, .15, .9, false); }
function alternarSonido(){
  sonidoOn = !sonidoOn;
  try{ localStorage.setItem(CLAVE_SONIDO, sonidoOn ? 'si' : 'no'); }catch(e){}
  if(sonidoOn) sonarHecho(); else musica.pause();
  if(typeof configNativa === 'function') configNativa();
  if(vista === 'ajustes') render();
}

/* ---------- Dibujos: la flor (v2: pétalos iguales; la intensidad dice el nivel) ---------- */
function pt(r, ang){ const a = ang*Math.PI/180; return [r*Math.cos(a), r*Math.sin(a)]; }
/* Pétalo apuntando hacia arriba (eje -y), de largo L */
function petalo(L, W){
  const w = W != null ? W : Math.min(34, 14 + L*0.2);
  return `M0 0C${w} ${-L*.28} ${w*.92} ${-L*.78} 0 ${-L}C${-w*.92} ${-L*.78} ${-w} ${-L*.28} 0 0Z`;
}
let idFlor = 0;
function flor(niveles, opc = {}){
  // mismo dibujo que el logotipo: centro dorado grande con semillas y pétalos alrededor
  const mini = !!opc.mini, paso = 360/AREAS.length, R0 = mini ? 56 : 60, Lp = mini ? 88 : 86, base = R0 - 8, L = base + Lp, n = ++idFlor, vb = mini ? 140 : 160;
  let s = `<svg viewBox="${-vb} ${-vb} ${vb*2} ${vb*2}" class="flor${mini?' mini':''}" role="img" aria-label="Tu flor">
  <defs><filter id="brillo${n}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="centro${n}"><stop offset="0" stop-color="#ffe59a"/><stop offset=".55" stop-color="#f7b733"/><stop offset="1" stop-color="#c9741a"/></radialGradient>
  <pattern id="semi${n}" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.4" fill="#7a4310" fill-opacity=".38"/></pattern></defs>`;
  AREAS.forEach((a,i) => {
    const nv = niveles && niveles[a.id];
    const op = !nv ? .18 : nv === 'bien' ? .42 : nv === 'una' ? .78 : 1;
    const extra = !nv ? `stroke="${a.color}" stroke-width="1.5" stroke-dasharray="4 4"` : '';
    s += `<g transform="rotate(${i*paso}) translate(0 ${-base})"><path class="${mini?'':'petalo'}" style="animation-delay:${i*70}ms" d="${petalo(Lp, 36)}" fill="${a.color}" fill-opacity="${op}" ${extra}/></g>`;
  });
  s += `<g class="${mini?'':'centro'}"><circle r="${R0}" fill="url(#centro${n})"/><circle r="${R0}" fill="url(#semi${n})"/>`;
  if(!mini && opc.centro != null) s += `<text class="centro-num" y="-3" text-anchor="middle" dominant-baseline="central">${opc.centro}</text><text class="centro-txt" y="14" text-anchor="middle" dominant-baseline="central">${opc.centroTxt || ''}</text>`;
  s += '</g>';
  if(!mini){
    AREAS.forEach((a,i) => {
      const nv = niveles && niveles[a.id], ang = i*paso - 90;
      const [xm,ym] = pt(base + Lp*.54, ang), giro = (ang > 90 || ang < -90) ? ang + 180 : ang;
      s += `<text class="eti-nom" x="${xm.toFixed(1)}" y="${ym.toFixed(1)}" transform="rotate(${giro} ${xm.toFixed(1)} ${ym.toFixed(1)})" text-anchor="middle" dominant-baseline="central">${a.corto}</text>`;
      const [xn,yn] = pt(L + 9, ang);
      if(nv === 'mas' || nv === 'una'){
        const k = nv === 'mas' ? 2 : 1;
        for(let j = 0; j < k; j++) s += `<circle cx="${(xn + (j - (k-1)/2) * 11).toFixed(1)}" cy="${yn.toFixed(1)}" r="4.5" fill="${a.color}" stroke="#fff" stroke-width="1.6"/>`;
      }else{
        s += `<text class="eti-marca" x="${xn.toFixed(1)}" y="${yn.toFixed(1)}" fill="${nv ? a.color : '#8f84b8'}" text-anchor="middle" dominant-baseline="central">${nv ? '✓' : '?'}</text>`;
      }
    });
  }
  if(opc.clic) AREAS.forEach((a,i) => { s += `<path d="${petalo(L + 20, 46)}" transform="rotate(${i*paso})" fill="transparent" style="cursor:pointer" onclick="abrirPetalo('${a.id}')"/>`; });

  if(!areas.length){
    return h + `<p style="text-align:center"><b>Todo en equilibrio.</b> No necesitas acciones nuevas.</p>
      <button class="btn prim ancho" onclick="ir('inicio')">Ir a Focus</button>`;
  }

    <p class="suave peq" style="margin:4px 0 8px">Escribe pequeños pasos concretos para las áreas que lo necesitan.</p>`;
  areas.forEach(a => {

      ${ya.map(x => `<p class="ya">✓ Ya tienes: ${esc(x.texto)}</p>`).join('')}
      ${Array.from({length: Math.max(0, filas)}, (_, k) => `<div class="campo-voz"><input type="text" maxlength="120" value="${esc(t[k] || '')}" placeholder="Por ejemplo: ${esc(a.ejemplos[k] || a.ejemplos[0])}" oninput="P.textos['${a.id}'][${k}]=this.value">${botonMic()}</div>`).join('')}
      ${ya.length + filas < max ? `<button class="link" onclick="P.textos['${a.id}'].push(''); const y=scrollY; render(); scrollTo(0,y)">＋ Otra acción</button>` : ''}

  });

function guardarPlan(){
  let n = 0;

  P = null; guardar();
  if(n){ sonarHecho(); aviso(n === 1 ? 'Acción guardada 🌱' : n + ' acciones guardadas 🌱'); }

}

/* ---------- Dictar con la voz (micrófono) ---------- */
const Reconocer = window.SpeechRecognition || window.webkitSpeechRecognition;
const MIC = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const esApp = !!window.AndroidEquilibra;   // dentro de la app Android
function botonMic(){ return (Reconocer || esApp) ? `<button class="mic" type="button" aria-label="Dictar con la voz" onclick="dictar(this)">${MIC}</button>` : ''; }
let reconocimiento = null;
let campoDictado = null;
/* En la app Android el dictado lo hace el teléfono y vuelve por aquí */
window.nativeDictation = (texto, error) => {
  document.querySelectorAll('.mic.escuchando').forEach(b => b.classList.remove('escuchando'));
  if(error){ aviso(error); return; }
  if(!campoDictado || !texto) return;
  let v = ((campoDictado.value.trim() ? campoDictado.value.trim() + ' ' : '') + texto).trim();
  campoDictado.value = (v.charAt(0).toUpperCase() + v.slice(1)).slice(0, campoDictado.maxLength > 0 ? campoDictado.maxLength : 500);
  campoDictado.dispatchEvent(new Event('input'));
};
function dictar(btn){
  if(esApp){ campoDictado = btn.previousElementSibling; btn.classList.add('escuchando'); AndroidEquilibra.dictar(); return; }
  if(reconocimiento){ reconocimiento.stop(); return; }
  const campo = btn.previousElementSibling;
  const base = campo.value.trim() ? campo.value.trim() + ' ' : '';
  const r = new Reconocer();
  r.lang = 'es-ES'; r.interimResults = true; r.continuous = false;
  r.onresult = e => {
    let t = ''; for(const x of e.results) t += x[0].transcript;
    let v = (base + t).trim(); v = v.charAt(0).toUpperCase() + v.slice(1);
    campo.value = v.slice(0, campo.maxLength > 0 ? campo.maxLength : 500);
    campo.dispatchEvent(new Event('input'));
  };
  r.onerror = e => { if(e.error === 'not-allowed' || e.error === 'service-not-allowed') aviso('Permite el micrófono para dictar'); else if(e.error !== 'no-speech' && e.error !== 'aborted') aviso('No se pudo dictar (' + e.error + ')'); };
  r.onend = () => { btn.classList.remove('escuchando'); reconocimiento = null; };
  btn.classList.add('escuchando'); reconocimiento = r;
  try{ r.start(); }catch(e){ btn.classList.remove('escuchando'); reconocimiento = null; }
}

/* ---------- Calendario propio (web 3.64; idea de Grow Panel, fase 1 aprobada por Gustavo) ----------
   Cada cosa del calendario es una TAREA (un día) o un HÁBITO (se repite N veces a la semana, los días elegidos), como en TickTick.

   todo (todo el día), ini, fin (minutos desde las 0:00), area|null, avisos:[min antes] (todo el día: antes de las 9:00 de ese día),
   saltar:[días quitados], hechos:[días hechos], acc (tarea de Life de la que sale), creada, mod}.

const ICO_BROTE = '<svg class="brote" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-label="Hábito"><path d="M12 21v-8"/><path d="M12 13c0-4 3-6.5 7.5-6.5 0 4-3 6.5-7.5 6.5z"/><path d="M12 15.5c0-3.3-2.5-5.5-6.5-5.5 0 3.3 2.5 5.5 6.5 5.5z"/></svg>';
const broteEv = e => e && e.tipo === 'habito' ? ICO_BROTE : '';
const campEv = e => e && e.avisos && e.avisos.length ? ICO_CAMPANITA : '';
const ICO_REP = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg>';
const AG_ = () => { if(!D.agenda) D.agenda = {eventos: []}; return D.agenda; };
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS_CORTO = ['L','M','X','J','V','S','D'];
const DIAS_LARGO = ['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const DIAS_VECES = {1:[0], 2:[0,3], 3:[0,2,4], 4:[0,1,3,4], 5:[0,1,2,3,4], 6:[0,1,2,3,4,5], 7:[0,1,2,3,4,5,6]};
// recordatorios, los mismos que TickTick
const RECORD_HORA = [{k:0, t:'A la hora'}, {k:5, t:'5 min antes'}, {k:30, t:'30 min antes'}, {k:60, t:'1 hora antes'}, {k:1440, t:'1 día antes'}];
const RECORD_DIA = [{k:0, t:'El mismo día (9:00)'}, {k:1440, t:'1 día antes (9:00)'}, {k:2880, t:'2 días antes (9:00)'}, {k:10080, t:'1 semana antes (9:00)'}];
const PRIO = [{k: 0, t: 'Sin prioridad', c: '#a99fca'}, {k: 1, t: 'Baja', c: '#3b82f6'}, {k: 2, t: 'Media', c: '#f59e0b'}, {k: 3, t: 'Alta', c: '#ef4444'}];

const fechaDe = k => { const [a, m, d] = k.split('-').map(Number); return new Date(a, m - 1, d); };

const minDeHora = v => { const r = /^(\d{1,2}):(\d{2})/.exec(v || ''); return r ? +r[1] * 60 + +r[2] : null; };
const fechaLarga = k => { const d = fechaDe(k); return `${DIAS_SEM[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const repite = e => e.tipo === 'habito' || (e.rep && e.rep !== 'no');
function tocaEv(e, k){
  if(!e || k < e.dia || (e.saltar || []).includes(k)) return false;
  if(e.tipo === 'habito'){
    const f = e.frec || 'diario';
    if(f === 'intervalo') return Math.round((fechaDe(k) - fechaDe(e.dia)) / 864e5) % Math.max(2, e.cada || 2) === 0;
    // semanal: sale cada día hasta que esa semana se ha hecho las veces pedidas (como TickTick)

/* Números del día para Grow Panel: cuántos hay hoy, horas ocupadas (sin contar dos veces lo que se solapa) y hechos o ya pasados */
function agendaDia(k){
  const evs = eventosDe(k), tramos = evs.filter(e => !e.todo).map(e => [e.ini, e.fin]).sort((a, b) => a[0] - b[0]);
  let min = 0, fin = -1;
  tramos.forEach(([a, b]) => { if(b <= fin) return; min += b - Math.max(a, fin); fin = b; });
  return {eventos_hoy: evs.length, horas_agenda_hoy: Math.round(min / 60 * 100) / 100, eventos_hechos: evs.filter(e => hechoEv(e, k) || pasadoEv(e, k)).length};
}

/* Rejilla de horas: de 5:00 a 23:00 (o más, si hay algo antes o después), 52 px por hora.
   Lo que se solapa se pone lado a lado; la raya roja es la hora de ahora y la franja suave, el bloque de Life de ahora. */
const AG_PX = 52;
function rangoHoras(dias){
  let a = 5, b = 23;
  dias.forEach(k => eventosDe(k).forEach(e => { if(e.todo) return; a = Math.min(a, Math.floor(e.ini / 60)); b = Math.max(b, Math.ceil(e.fin / 60)); }));
  if(dias.includes(hoyK())){ const h = Math.floor(minutosHoy() / 60); a = Math.min(a, h); b = Math.max(b, h + 1); }
  return [a, Math.min(24, b)];
}
function columnasEv(evs){
  const lista = evs.filter(e => !e.todo).sort((x, y) => (x.ini - y.ini) || (y.fin - x.fin)), out = [];
  let grupo = [], finG = -1;
  const cerrar = () => { const cols = []; grupo.forEach(o => { let c = cols.findIndex(f => f <= o.e.ini); if(c < 0){ c = cols.length; cols.push(0); } cols[c] = o.e.fin; o.c = c; }); grupo.forEach(o => o.n = cols.length); out.push(...grupo); grupo = []; };
  lista.forEach(e => { if(grupo.length && e.ini >= finG) cerrar(); grupo.push({e}); finG = Math.max(finG, e.fin); });
  if(grupo.length) cerrar();
  return out;
}
function rejillaHTML(dias){

    lineas += `<div class="rj-h" style="top:${(h - h0) * AG_PX}px"><span>${horaEje(h)}</span></div>`;
    if(h < h1) lineas += `<div class="rj-m" style="top:${(h - h0 + .5) * AG_PX}px"></div>`;
  }
  const cols = dias.map(k => {
    let h = '';
    if(k === hoy){
      const c = bloqueAhora(), m = minutosHoy();
      if(c >= 0) h += `<div class="rj-blk" style="top:${y(BLOQUES[c].ini)}px;height:${90 / 60 * AG_PX}px"></div>`;
      h += `<div class="rj-ahora" style="top:${y(m)}px"></div>`;
    }
    h += columnasEv(evsVer(k)).map(({e, c, n}) => { const alto = Math.max(20, (e.fin - e.ini) / 60 * AG_PX - 2);
      return `<button class="rj-ev ${hechoEv(e, k) ? 'ok' : ''} ${pasadoEv(e, k) ? 'pasado' : ''}" style="--c:${colorEv(e)};top:${y(e.ini) + 1}px;height:${alto}px;left:${c / n * 100}%;width:calc(${100 / n}% - 2px)" data-ev="${e.id}" data-k="${k}" onclick="verEvento('${e.id}','${k}', this)"><b>${broteEv(e)}${campEv(e)}${esc(e.t)}</b>${alto > 34 && (!sem || ESCRITORIO.matches) ? `<span>${hm(e.ini)} – ${hm(e.fin)}${e.tipo === 'habito' ? ' · hábito' : ''}</span>` : ''}<i class="rj-tir" aria-hidden="true"></i></button>`; }).join('');
    return `<div class="rj-col" data-k="${k}" onclick="agClicRejilla(event,'${k}',${h0})">${h}</div>`;
  }).join('');

}
/* Arrastrar en la rejilla con el ratón (Gustavo, 4.12, como Google Calendar): sobre la tarea sale la mano y, con el botón
   izquierdo pulsado, se lleva a otra hora (y a otro día en Semana, 3 días o 7 días, si no se repite); en el borde de abajo sale
   la flecha arriba-abajo y se estira para alargarla o acortarla. De 15 en 15 minutos, con la hora a la vista y «Deshacer».
   Un clic sin mover sigue abriendo la tarjeta. Lo que se repite cambia de hora todas las veces; los hábitos, como mucho 2 h. */
let rjArr = null;
document.addEventListener('pointerdown', ev => {
  if(ev.button !== 0 || ev.pointerType === 'touch') return;
  const el = ev.target.closest && ev.target.closest('.rj-ev'); if(!el) return;
  const e = AG_().eventos.find(x => x.id === el.dataset.ev); if(!e || e.todo) return;
  const estirar = !!ev.target.closest('.rj-tir');
  rjArr = {el, e, k: el.dataset.k, estirar, x0: ev.clientX, y0: ev.clientY, ini: e.ini, fin: e.fin, nIni: e.ini, nFin: e.fin, movido: false, col: el.closest('.rj-col'), colN: el.closest('.rj-col')};
  ev.preventDefault();   // que no se seleccione el texto

document.addEventListener('pointermove', ev => {
  const a = rjArr; if(!a) return;
  const dx = ev.clientX - a.x0, dy = ev.clientY - a.y0;
  if(!a.movido){
    if(Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
    a.movido = true; clearTimeout(popT); if(typeof cerrarPop === 'function') cerrarPop();
    a.el.classList.add('rj-mov'); document.body.classList.add(a.estirar ? 'rj-estirando' : 'rj-moviendo');
  }
  const paso = Math.round(dy / AG_PX * 4) * 15;
  if(a.estirar){
    const max = a.e.tipo === 'habito' ? 120 : 24 * 60;
    a.nIni = a.ini; a.nFin = Math.min(24 * 60, a.ini + max, Math.max(a.ini + 15, a.fin + paso));
    a.el.style.height = Math.max(20, (a.nFin - a.ini) / 60 * AG_PX - 2) + 'px';
  } else {
    const dur = a.fin - a.ini;
    a.nIni = Math.max(0, Math.min(24 * 60 - dur, a.ini + paso)); a.nFin = a.nIni + dur;
    if(!repite(a.e)){ const c = document.elementsFromPoint(ev.clientX, ev.clientY).find(x => x.classList && x.classList.contains('rj-col')); if(c) a.colN = c; }
    const dxc = a.colN.getBoundingClientRect().left - a.col.getBoundingClientRect().left;
    a.el.style.transform = `translate(${dxc}px, ${(a.nIni - a.ini) / 60 * AG_PX}px)`;
  }

  h.textContent = `${hm(a.nIni)} – ${hm(a.nFin)}`;
});
function rjSoltar(cancelar){

  if(!a.movido) return;   // fue un clic: abre la tarjeta como siempre
  finArrastre = Date.now();

  if(cancelar || (a.nIni === a.ini && a.nFin === a.fin && kN === a.k)){ rerenderDia(); return; }
  const e = a.e, antes = {ini: e.ini, fin: e.fin, dia: e.dia};

document.addEventListener('pointerup', () => rjSoltar(false));

function gcProximo(e){
  if(!repite(e)) return e.dia;
  const hoy = hoyK();
  for(let n = 0; n < 120; n++){ const k = sumarDias(hoy, n); if(eventosDe(k).some(x => x.id === e.id)) return k; }
  return e.dia;

function gcBuscarPintar(){
  const box = $('#gc-res'); if(!box) return;

  if(!q){ box.innerHTML = '<p class="peq suave" style="margin:0">Busca por el nombre de lo que tienes en el calendario.</p>'; return; }
  const evs = AG_().eventos.filter(e => gcNorm(e.t).includes(q)).map(e => ({e, k: gcProximo(e)})).sort((a, b) => a.k.localeCompare(b.k)).slice(0, 40);

/* Atajos de teclado como Google Calendar: D, W, M (vista), T (hoy), flechas o J/K (antes/después), C (crear), / (buscar) */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') document.querySelectorAll('.gc-pop').forEach(x => x.hidden = true);
  if(e.key === 'Escape' && vista === 'ajustes' && ESCRITORIO.matches && !$('#hoja')){ ir(vistaPrevia); return; }
  if(vista !== 'agenda' || !ESCRITORIO.matches || e.ctrlKey || e.metaKey || e.altKey || $('#hoja')) return;
  if(e.target && e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return;
  const k = e.key.toLowerCase();
  if(k === 'd') agVer('dia'); else if(k === 'w') agVer('semana'); else if(k === 'm') agVer('mes');
  else if(k === 'y') agVer('anio'); else if(k === 'a') agVer('agenda'); else if(k === 'x') agVer('7dias');
  else if(k === 't') agHoy(); else if(k === 'c') nuevoEvento();
  else if(k === 'j' || k === 'n' || e.key === 'ArrowRight') agMover(1);
  else if(k === 'k' || k === 'p' || e.key === 'ArrowLeft') agMover(-1);
  else if(k === '/'){ e.preventDefault(); gcBuscar(); }
});

  setInterval(saludTick, 30000);

  setInterval(avanzarAros, 20000);

  ['click', 'touchend'].forEach(ev => document.addEventListener(ev, () => { if(ticOn) ticPreparar(); }, {passive: true}));
  setTimeout(saludTick, 4000);
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible'){ leerPasos(); saludTick(); bloquesTick(); } });
}

/* Une lo de este dispositivo con lo de la nube: por id, gana lo cambiado más tarde */
function fusionar(local, remoto){
  if(!remoto) return local;
  remoto = normalizar(remoto);
  const borradas = [...new Set([...(local.borradas || []), ...(remoto.borradas || [])])];
  const unir = (a, b, clave) => {
    const m = {};
    [...b, ...a].forEach(x => { if(borradas.includes(x.id)) return; const y = m[x.id]; if(!y || (x[clave] || '') > (y[clave] || '')) m[x.id] = x; });
    return Object.values(m);
  };
  const r = vacio();
  r.borradas = borradas;
  r.acciones = unir(local.acciones, remoto.acciones, 'mod').sort((x,y) => x.creada < y.creada ? -1 : 1);
  r.revisiones = unir(local.revisiones, remoto.revisiones, 'fecha').sort((x,y) => x.fecha < y.fecha ? -1 : 1);
  const gana = (remoto.nivelesMod || '') > (local.nivelesMod || '') ? remoto : local;
  r.niveles = {...gana.niveles}; r.detalle = gana.detalle || {}; r.comentarios = gana.comentarios || {}; r.nivelesMod = gana.nivelesMod;
  // salud: ajustes del lado cambiado más tarde; por día se queda el número más alto
  const sl = local.salud || nuevaSalud(), sr = remoto.salud || nuevaSalud();
  r.salud = nuevaSalud((sr.mod || '') > (sl.mod || '') ? sr : sl);
  r.salud.days = {}; r.salud.pasos = {};
  [sl, sr].forEach(x => {
    Object.keys(x.days || {}).forEach(k => { const a = r.salud.days[k] || {agua:0, mov:0}, b = x.days[k]; r.salud.days[k] = {agua: Math.max(a.agua, b.agua || 0), mov: Math.max(a.mov, b.mov || 0)}; });
    Object.keys(x.pasos || {}).forEach(k => { const a = r.salud.pasos[k], b = x.pasos[k]; if(!a || (b.steps || 0) > a.steps) r.salud.pasos[k] = b; });
  });
  // bloques: ajustes y días del lado cambiado más tarde; los días que solo están en un lado se conservan
  const bl = local.bloques || nuevosBloques(), br = remoto.bloques || nuevosBloques();
  const [bGana, bPierde] = (br.mod || '') > (bl.mod || '') ? [br, bl] : [bl, br];
  r.bloques = nuevosBloques(bGana);
  r.bloques.days = Object.assign({}, bPierde.days || {}, bGana.days || {});
  r.agenda = {eventos: unir((local.agenda || {}).eventos || [], (remoto.agenda || {}).eventos || [], 'mod')};   // calendario: por evento, gana el cambiado más tarde
  r.nombre = local.nombre || remoto.nombre || '';
  const fl = local.focoDias || {}, fr = remoto.focoDias || {};   // bloques con tareas de cada día: el número más alto
  if(Object.keys(fl).length || Object.keys(fr).length){ r.focoDias = {}; [...new Set([...Object.keys(fl), ...Object.keys(fr)])].forEach(k => r.focoDias[k] = Math.max(fl[k] || 0, fr[k] || 0)); }
  const al = local.appAndroid, ar = remoto.appAndroid;
  const cr = [local.calRevisado, remoto.calRevisado].filter(Boolean).sort().pop(); if(cr) r.calRevisado = cr;
  const rl = local.registroDia, rr = remoto.registroDia;
  if(rl || rr) r.registroDia = rl && rr && rl.dia === rr.dia ? {dia: rl.dia, bloques: [...new Set([...rl.bloques, ...rr.bloques])]} : [rl, rr].filter(Boolean).sort((a, b) => a.dia < b.dia ? 1 : -1)[0];
  const cl = local.compromiso, cm = remoto.compromiso;
  if(cl || cm) r.compromiso = (cm && (!cl || (cm.mod || '') > (cl.mod || ''))) ? cm : cl;
  if(al || ar) r.appAndroid = (ar && (!al || (ar.visto || '') > (al.visto || ''))) ? ar : al;
  return r;
}

/* Tiempo real (Gustavo, 3.82: «añadí una tarea en el móvil y no la veo en el ordenador»): se escucha el documento de la nube;
   cuando otro aparato lo cambia, se une con lo de aquí y se vuelve a pintar (sin interrumpir si estás escribiendo). */
function escucharNube(){
  if(!nube.ref || nube.escucha) return;
  nube.escucha = nube.ref.onSnapshot(doc => {
    if(doc.metadata.hasPendingWrites || !doc.exists) return;   // es lo que acabo de subir yo
    const r = doc.data(); notaRemota(r); if(!r || r.actualizado === nube.subido) return;
    const antes = JSON.stringify(D);

    if(JSON.stringify(D) === antes) return;
    try{ localStorage.setItem(CLAVE, JSON.stringify(D)); }catch(e){}
    nube.ok = Date.now(); nube.leido = Date.now();
    pintarDesdeNube();
  }, e => {   // la escucha se corta (red, permisos…): se vuelve a enganchar a los 10 s
    console.warn('nube en tiempo real', e);
    nube.escucha = null; clearTimeout(nube.tEsc); nube.tEsc = setTimeout(() => { nube.leido = 0; refrescarNube(); escucharNube(); }, 10000);
