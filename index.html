<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Amable Life · Tus próximas acciones</title>
<meta name="description" content="Amable Life: ten claras tus próximas acciones para vivir en equilibrio. La flor de 8 áreas te dice dónde poner energía.">
<meta name="theme-color" content="#140f26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Amable Life">
<link rel="icon" id="favicon">
<link rel="apple-touch-icon" href="img/icono-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bl:255,255,255;
  --fondo:#140f26; --fondo2:#1d1636; --tarjeta:#221a40; --tinta:#f4f0fb; --suave:#a99fca; --linea:#352a5c;
  --acento:#f08a24; --acento2:#e2456b; --oro:#f7c35b; --sube:#4ade80; --baja:#fb7185;
}
*{box-sizing:border-box}
html,body{margin:0;overscroll-behavior-y:contain}   /* el «deslizar para actualizar» es el nuestro: el del navegador no salta a la vez */
#pullR{position:fixed;top:-44px;left:50%;margin-left:-22px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:#2a1f52;color:var(--oro);box-shadow:0 4px 14px rgba(0,0,0,.45);opacity:0;pointer-events:none;z-index:40}
#pullR.listo{background:var(--oro);color:#2a1f52}
body{background:radial-gradient(120% 60% at 50% 0%,#2a1f52 0,var(--fondo) 60%) fixed,var(--fondo);color:var(--tinta);
  font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{line-height:1.2;margin:0}
.envoltura{max-width:520px;margin:0 auto;padding:0 16px 110px}

/* Cabecera */
header.cab{position:sticky;top:0;z-index:5;background:rgba(20,15,38,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--linea)}
.cab-in{max-width:520px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.cab-in .marca{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:.2px}
.cab-in .marca svg{width:30px;height:30px;overflow:visible}
.cab-in .ver{font-size:11px;font-weight:700;color:var(--suave);border:1px solid var(--linea);border-radius:999px;padding:1px 7px}
.cab-in .der{margin-left:auto;display:flex;align-items:center;gap:8px}
#grow-panel-boton .gp-boton{border-color:var(--linea)}

/* Tarjetas y botones */
.tarjeta{background:var(--tarjeta);border:1px solid var(--linea);border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:14px 18px;font-weight:800;font-size:16px}
a.btn{text-decoration:none;box-sizing:border-box}
.btn.prim{background:linear-gradient(135deg,var(--acento),var(--acento2));color:#fff;box-shadow:0 6px 20px rgba(226,69,107,.35)}
.btn.prim:active{transform:translateY(1px)}
.btn.sec{background:rgba(var(--bl),.04);border:1.5px solid var(--linea);color:var(--tinta)}
.btn.ancho{width:100%}
.btn.peligro{background:transparent;border:1.5px solid #6b2a3f;color:var(--baja)}
.link{background:none;border:0;padding:6px 4px;color:var(--suave);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.suave{color:var(--suave)}
.peq{font-size:13px}

/* Flor */
.flor{display:block;width:100%;max-width:460px;margin:4px auto 0;overflow:visible}
.flor .petalo{animation:abre .9s cubic-bezier(.2,.9,.25,1.15) both;transform-origin:0px 0px}
@keyframes abre{from{transform:scale(0) rotate(-25deg);opacity:0}}
.flor .centro{animation:late 1.1s ease-out .55s both;transform-origin:0px 0px}
@keyframes late{0%{transform:scale(0)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.flor .eti-num{font-size:17px;font-weight:800;filter:brightness(1.3)}
.flor .eti-nom{font-size:12.5px;font-weight:800;fill:#fff;paint-order:stroke;stroke:rgba(20,12,40,.55);stroke-width:3px;stroke-linejoin:round;letter-spacing:.2px}
.mini{width:64px;height:64px;flex:none;margin:0}
.leyenda-prev{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--suave);margin-top:4px}
.leyenda-prev i{display:inline-block;width:22px;border-top:2px dashed #cbbcf5}

/* Cifras */
.cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.cifra{background:rgba(var(--bl),.04);border:1px solid var(--linea);border-radius:14px;padding:10px 8px;text-align:center}
.cifra b{display:block;font-size:20px;font-weight:800}
.cifra span{font-size:12px;color:var(--suave)}
.delta{font-size:12px;font-weight:800;white-space:nowrap}
.delta.up{color:var(--sube)} .delta.down{color:var(--baja)} .delta.igual{color:var(--suave)}

/* Lista de áreas */
.areas{margin-top:12px}
.fila{display:grid;grid-template-columns:26px 1fr 70px 30px 34px;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--linea)}
.fila:first-child{border-top:0}
.fila .em{display:flex;justify-content:center}
.fila .em .ico{width:18px;height:18px}
.ico{width:15px;height:15px;vertical-align:-2px;flex:none;display:inline-block}
.ico.g{width:26px;height:26px}
.fila .nom{font-weight:700;font-size:15px;line-height:1.2}
.fila .nom small{display:block;font-weight:600;font-size:12px;color:var(--suave)}
.fila .barra{height:8px;border-radius:99px;background:rgba(var(--bl),.08);overflow:hidden}
.fila .barra i{display:block;height:100%;border-radius:99px}
.fila b{text-align:right;font-size:16px}
.fila .delta{text-align:right}

/* Bienvenida */
.bienvenida{text-align:center;padding:0;overflow:hidden}
.bienvenida .hero{position:relative;height:300px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 50%,rgba(247,183,51,.22),transparent 62%)}
.bienvenida .hero svg{width:min(78%,340px);height:auto;filter:drop-shadow(0 10px 30px rgba(247,183,51,.25))}
.bienvenida .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 45%,var(--tarjeta))}
.bienvenida .txt{padding:0 20px 22px;margin-top:-30px;position:relative}
.bienvenida h1{font-size:26px;font-weight:800}
.bienvenida p{margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 18px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;
  background:color-mix(in srgb,var(--c) 18%,transparent);color:color-mix(in srgb,var(--c) 55%,#fff);border:1.5px solid transparent}
button.chip.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 32%,transparent);color:#fff}

/* Acción */
.accion{border-left:5px solid var(--c,var(--acento))}
.accion .eti{font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--suave);margin:0}
.accion .txt{font-size:18px;font-weight:700;margin:6px 0 12px}
.accion.hecha .txt{text-decoration:line-through;text-decoration-color:var(--c);color:var(--suave)}
.accion .acc-bots{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tareas{display:flex;flex-direction:column;gap:8px;margin:10px 0 12px}
.tarea{display:flex;align-items:center;gap:12px;text-align:left;background:rgba(var(--bl),.04);border:1px solid var(--linea);border-radius:14px;padding:11px 12px;font-weight:700;font-size:16px;color:var(--tinta)}
.tarea .caja{width:24px;height:24px;flex:none;border-radius:8px;border:2px solid var(--c);display:grid;place-items:center;color:transparent;font-size:14px}
.tarea.ok{color:var(--suave)}
.tarea.ok span:last-child{text-decoration:line-through;text-decoration-color:var(--c)}
.tarea.ok .caja{background:var(--c);color:#fff}
.regla{margin:10px 0 0;font-weight:700}
.regla small{display:block;font-weight:600;color:var(--suave);font-size:12px;margin-top:2px}
.campo-accion input{margin-top:8px}
.aviso-semana{border-color:#6b4a1f;background:linear-gradient(135deg,#3a2a17,#2a1f3f)}

/* Evaluar */
.progreso{display:flex;gap:5px;margin-top:14px}
.progreso i{flex:1;height:6px;border-radius:99px;background:rgba(var(--bl),.1)}
.progreso i.hecho{background:var(--c)}
.progreso i.actual{background:color-mix(in srgb,var(--c) 55%,transparent)}
.paso{font-size:13px;color:var(--suave);font-weight:700;margin:8px 0 0}
.eval{padding:0;overflow:hidden;text-align:center;animation:entra .45s ease-out both}
@keyframes entra{from{opacity:0;transform:translateX(24px)}}
.eval .ilus{position:relative;height:270px;background:var(--fondo2) center 30%/cover}
.eval .ilus::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,var(--tarjeta) 98%)}
.eval .cuerpo{padding:0 18px 20px;margin-top:-44px;position:relative}
.eval h2{font-size:25px;font-weight:800;margin-top:4px;color:color-mix(in srgb,var(--c) 55%,#fff)}
.pregunta{display:block;font-size:17px;font-weight:700;margin:16px 4px 0}
.valor{font-size:46px;font-weight:800;color:color-mix(in srgb,var(--c) 70%,#fff);line-height:1.1;margin-top:4px;transition:transform .15s}
.valor.pulso{transform:scale(1.15)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;margin:10px 0 6px;outline:none;
  background:linear-gradient(to right,var(--c) calc(var(--p,44.4)*1%),rgba(var(--bl),.12) 0)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:4px solid var(--c);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 25%,transparent)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid var(--c)}
.extremos{display:flex;justify-content:space-between;font-size:12px;color:var(--suave);font-weight:600}
.nota-doble{margin-top:16px;background:rgba(var(--bl),.05);border-radius:14px;padding:12px;font-weight:700}
.nota-doble b{color:color-mix(in srgb,var(--c) 70%,#fff);font-size:20px}
.nota-doble .pista{display:block;font-weight:600;font-size:13px;color:var(--suave);margin-top:2px}
details.nota{margin-top:14px;text-align:left}
details.nota summary{cursor:pointer;color:var(--suave);font-weight:700;font-size:14px;list-style:none;text-align:center}
details.nota summary::-webkit-details-marker{display:none}
textarea,input[type=text]{width:100%;font:inherit;border:1.5px solid var(--linea);border-radius:12px;padding:11px 12px;background:rgba(0,0,0,.2);color:var(--tinta)}
textarea::placeholder,input::placeholder{color:#7f74a3}
textarea{min-height:80px;resize:vertical;margin-top:8px}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--acento)}
.bots-eval{display:flex;gap:10px;margin-top:16px}
.bots-eval .btn{flex:1}

/* Resultado */
.res-tit{text-align:center;margin-top:18px}
.res-tit h1{font-size:24px;font-weight:800}
.res-tit p{margin:4px 0 0}
.resumen-txt{margin:12px 0 0;text-align:center}
.campo-accion{margin-top:12px}

/* Jardín (historial) */
.evolucion svg{width:100%;height:auto;display:block}
.jardin{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.maceta{background:var(--tarjeta);border:1px solid var(--linea);border-radius:18px;padding:12px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.maceta svg{width:110px;height:110px}
.maceta b{font-size:14px}
.maceta span{font-size:12px;color:var(--suave)}
.volver{margin-top:12px}
.comentario{border-top:1px solid var(--linea);padding:8px 0;font-size:14px}
.comentario:first-of-type{border-top:0}

/* Ajustes */
.ajustes h3{font-size:17px;margin-bottom:6px}
.ajustes p{margin:6px 0 12px}
.ajustes .bots{display:flex;flex-direction:column;gap:8px}
.interruptor{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.interruptor input{width:46px;height:26px;accent-color:var(--acento)}

/* Navegación inferior */
nav.abajo{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(20,15,38,.94);backdrop-filter:blur(10px);border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom)}
nav.abajo .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.abajo button{background:none;border:0;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:700;color:var(--suave)}
nav.abajo button span{font-size:20px;line-height:1.1;filter:grayscale(1);opacity:.6}
nav.abajo button.act{color:var(--oro)}
nav.abajo button.act span{filter:none;opacity:1}
nav.abajo .nav-flor{width:22px;height:22px;color:var(--suave);opacity:.85}
nav.abajo button.act .nav-flor{color:var(--oro);opacity:1}

/* Sellos de Práctica Integral (Grow Panel\SELLO.md, colores adaptados al tema nocturno) */
.sellos{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:26px 0 6px}
.pi-seal,.gp-seal{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.3px;
  line-height:16px;white-space:nowrap;color:#a99fca;border:1px solid #3d3266;border-radius:999px;padding:6px 12px;text-decoration:none;background:transparent}
.pi-seal::before{content:"";width:7px;height:7px;border-radius:50%;background:#4ADE80}
.gp-seal svg{width:14px;height:14px;flex:none}
.pi-seal:hover{border-color:#4ADE80}
.gp-seal:hover{border-color:#8b5cf6}

/* Portada: la flor se abre */
#splash{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 42%,#3a2470 0,#1b1236 45%,#0d0a1c 100%);transition:opacity .6s ease;overflow:hidden}
#splash.fuera{opacity:0;pointer-events:none}
#splash .logo-s{width:210px;height:210px;overflow:visible}
#splash .logo-s .petalo{animation:abre-s .7s cubic-bezier(.2,.9,.25,1.2) both;transform-origin:0px 0px}
@keyframes abre-s{from{transform:scale(0) rotate(-40deg);opacity:0}}
#splash .logo-s .centro{animation:late .8s ease-out 1.05s both;transform-origin:0px 0px}
#splash .halo{position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(247,195,91,.35),transparent 65%);
  top:50%;left:50%;transform:translate(-50%,-62%) scale(.3);opacity:0;animation:halo 1.6s ease-out 1s forwards}
@keyframes halo{to{transform:translate(-50%,-62%) scale(1);opacity:1}}
#splash h1{font-size:40px;font-weight:800;margin-top:22px;letter-spacing:.5px;animation:sube .8s ease-out 1.2s both}
#splash p{margin:4px 0 0;color:var(--suave);font-weight:600;animation:sube .8s ease-out 1.4s both}
@keyframes sube{from{opacity:0;transform:translateY(12px)}}
#splash .chispa{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--oro);box-shadow:0 0 8px var(--oro);opacity:0;animation:chispa 2.4s ease-out forwards}
@keyframes chispa{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
#splash .tocar{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);white-space:nowrap;
  font-size:16px;color:#fff;font-weight:800;padding:12px 22px;border-radius:999px;background:linear-gradient(135deg,var(--acento),var(--acento2));
  box-shadow:0 6px 24px rgba(226,69,107,.45);opacity:0;pointer-events:none;transition:opacity .4s}
#splash .tocar.ver{opacity:1;animation:latido 1.4s ease-in-out infinite}
.marca-t{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid #fff}
#splash .sellos{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:16px;right:16px;margin:0;animation:sube .8s ease-out 1.6s both}

/* Aviso flotante */
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#f4f0fb;color:#1d1636;font-weight:800;
  padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;z-index:30;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.ver{opacity:1;transform:translate(-50%,0)}
#toast.con-boton{display:flex;align-items:center;gap:14px;white-space:nowrap;padding:8px 8px 8px 16px}
#toast.ver.con-boton{pointer-events:auto}
#toast button{border:0;border-radius:9px;padding:8px 12px;background:#6d28d9;color:#fff;font-weight:800;font-size:15px}

/* v1.06 · Sin bordes (Gustavo): secciones e imágenes a todo lo ancho, como tarjetas sin marco */
.tarjeta{border:0;border-radius:0;box-shadow:none;background:transparent;margin:0 -16px;padding:22px 16px}
.tarjeta + .tarjeta{padding-top:6px}
.accion{border-left:0;background:linear-gradient(100deg,color-mix(in srgb,var(--c) 16%,transparent),transparent 75%)}
.aviso-semana{border:0}
.eval{margin:10px -16px 0}
.eval .ilus{height:min(58vh,440px);background-position:center 25%}
.eval .cuerpo{padding:0 16px 20px;margin-top:-70px}
.bienvenida{margin:0 -16px}
.bienvenida .hero{height:min(62vh,460px)}
.bienvenida .hero::after{background:linear-gradient(to bottom,transparent 40%,var(--fondo))}
.cifra,.maceta,.tarea{border:0}
.cifra{background:rgba(var(--bl),.05)}
.maceta{background:rgba(var(--bl),.05);border-radius:18px}
.tarea{background:rgba(var(--bl),.07)}
textarea,input[type=text]{border:0;background:rgba(var(--bl),.08)}
textarea:focus,input[type=text]:focus{outline:2px solid var(--acento);outline-offset:0}
.btn.sec{border:0;background:rgba(var(--bl),.09)}
.btn.peligro{border:0;background:rgba(251,113,133,.12)}
header.cab{border-bottom:0}
nav.abajo{border-top:0}
#grow-panel-boton .gp-boton{border-color:transparent}
.fila{border-top:0;padding:7px 0}
.comentario{border-top:0}
/* Jardín: flores / acciones */
.seg{display:flex;gap:6px;background:rgba(var(--bl),.06);padding:4px;border-radius:14px;margin-top:14px}
.seg button{flex:1;border:0;background:transparent;color:var(--suave);font-weight:800;padding:9px;border-radius:11px}
.seg button.on{background:rgba(var(--bl),.12);color:var(--tinta)}
.semana-acc{margin:0 -16px;padding:16px;background:linear-gradient(100deg,color-mix(in srgb,var(--c) 14%,transparent),transparent 75%)}
.semana-acc + .semana-acc{margin-top:8px}
.sa-cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sa-cab span{font-size:12px;color:var(--suave)}
.sa-area{margin:4px 0 8px;font-weight:700;font-size:14px}
.sa-area .estrella{color:var(--oro)}
.semana-acc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.semana-acc li{display:flex;align-items:center;gap:10px;font-size:15px}
.semana-acc li .caja{width:20px;height:20px;flex:none;border-radius:6px;border:2px solid var(--c);display:grid;place-items:center;color:transparent;font-size:12px}
.semana-acc li.ok .caja{background:var(--c);color:#fff}
.semana-acc li.ok span:last-child{color:var(--suave);text-decoration:line-through;text-decoration-color:var(--c)}
.resumen-acc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
/* Cuenta */
.cuenta{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cuenta img{width:44px;height:44px;border-radius:50%}
.cuenta b{display:block}
.cuenta span{font-size:13px;color:var(--suave)}
.btn.google{background:#fff;color:#1f1f1f}
.nube-ok{color:var(--sube);font-weight:700;font-size:13px}

/* v1.07 · Flor más grande (de borde a borde) y sin copiar texto al mantener pulsado */
.flor:not(.mini){width:calc(100% + 32px);max-width:none;margin:22px -16px 14px}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg{-webkit-user-drag:none}

/* v1.08 · Micrófono para dictar */

<script>
'use strict';
const VERSION = 'v3.83';
const CLAVE = 'equilibra.datos';
const CLAVE_SONIDO = 'equilibra.sonido';

/* Las 8 áreas = los 8 pétalos (decididas con Gustavo el 19/10/2026). Orden = sentido de las agujas del reloj desde arriba. */
const AREAS = [
  {id:'salud', corto:'Salud',       nombre:'Salud', etiqueta:'Salud',                   color:'#22a35a',
   pregunta:'¿Cómo te sientes con tu cuerpo, tu energía y tu descanso?', ejemplos:['caminar 20 minutos el martes y el jueves', 'acostarme antes de las 23 h tres noches', 'beber 2 litros de agua al día']},
  {id:'pareja', corto:'Pareja',      nombre:'Pareja', etiqueta:'Pareja',                  color:'#e2456b',
   pregunta:'¿Cómo estás en tu vida de pareja o con tu situación sentimental?', ejemplos:['una cena sin móviles el viernes', 'decirle algo que valoro de mi pareja', 'planear juntos una salida para el finde']},
  {id:'familia', corto:'Familia',     nombre:'Familia y amigos', etiqueta:'Familia y|amigos',        color:'#f08a24',
   pregunta:'¿Qué tan cuidados y presentes están tus vínculos cercanos?', ejemplos:['llamar a un amigo que hace tiempo no veo', 'comer con mi familia el domingo', 'escribir a alguien para quedar']},
  {id:'trabajo', corto:'Trabajo',     nombre:'Trabajo y dinero', etiqueta:'Trabajo y|dinero',        color:'#2b7fd4',
   dobles:[{id:'gusta', texto:'¿Te gusta tu trabajo?', corto:'Te gusta'},
           {id:'dinero',texto:'¿Te da el dinero que necesitas?', corto:'Dinero'}],
   ejemplos:['revisar mis gastos del mes el domingo', 'dedicar 1 hora a la tarea que más me gusta', 'buscar una forma de ganar algo más este mes']},
  {id:'crecimiento', corto:'Crecimiento', nombre:'Crecimiento personal', etiqueta:'Crecimiento|personal',    color:'#8b5cf6',
   pregunta:'¿Estás aprendiendo y creciendo como te gustaría?', ejemplos:['leer 10 páginas cada noche', 'ver un curso o charla de 30 minutos', 'escribir 3 cosas que aprendí esta semana']},
  {id:'ocio', corto:'Ocio',        nombre:'Ocio y disfrute', etiqueta:'Ocio y|disfrute',         color:'#e0a810',
   pregunta:'¿Tienes tiempo para disfrutar, jugar y descansar?', ejemplos:['reservar el sábado por la tarde para algo que me guste', 'salir a un sitio nuevo', 'una hora de mi hobby sin pantallas']},
  {id:'proposito', corto:'Propósito',   nombre:'Propósito / Espiritualidad', etiqueta:'Propósito /|Espiritualidad', color:'#14a3a3',
   pregunta:'¿Sientes que tu vida tiene sentido y dirección?', ejemplos:['10 minutos de silencio o meditación cada mañana', 'escribir para qué hago lo que hago', 'ayudar a alguien sin esperar nada']},
  {id:'hogar', corto:'Entorno',     nombre:'Entorno y hogar', etiqueta:'Entorno|y hogar',         color:'#b0703c',
   pregunta:'¿Te sientes a gusto donde y cómo vives?', ejemplos:['ordenar el escritorio y dejarlo despejado', 'tirar o regalar 5 cosas que no uso', 'poner una planta o algo bonito en casa']},
];

const $ = s => document.querySelector(s);
const app = $('#app');

/* ---------- Datos (v2: acciones + niveles por área) ----------
   D = {v:2, niveles:{area:'bien'|'una'|'mas'}, detalle:{trabajo:{gusta,dinero}}, comentarios:{}, nivelesMod,
        revisiones:[{id, fecha, niveles, detalle, comentarios}], acciones:[{id, area, texto, hecha, creada, hechaEn, mod}], borradas:[] } */
const NIVELES = {
  bien: {marca:'✓',  titulo:'Estoy bien',             sub:'No necesita acciones',        n:0, peso:0},
  una:  {marca:'1',  titulo:'Una acción a la semana', sub:'Necesita un pequeño paso',    n:1, peso:1},
  mas:  {marca:'2+', titulo:'Necesita más acción',    sub:'2 o 3 acciones esta semana',  n:2, peso:2},
};
/* Salud (venido de Amable PC): agua, movimiento y pasos */
const SALUD_DEF = {aguaOn:true, aguaMin:45, aguaGoal:8, movOn:true, movMin:60, aguaNext:0, movNext:0, days:{},
  meta:8000, pasosOn:true, voz:true, cada:500, bloqueOn:true, bloque:2000, caminarOn:true, caminarHecho:null, pasos:{}, mod:null};
const nuevaSalud = (x = {}) => Object.assign({}, SALUD_DEF, {days:{}, pasos:{}}, x);
/* Bloques de tiempo (venidos de Amable PC): días → bloque → hasta 3 actividades {t, d, acc} */
const BLOQUES_DEF = {days:{}, startVoice:true, remindOn:true, remindMin:5, sleepOn:true, sleepDone:'', ultimo:null, mod:null};
const nuevosBloques = (x = {}) => Object.assign({}, BLOQUES_DEF, {days:{}}, x);
const vacio = () => ({v:2, niveles:{}, detalle:{}, comentarios:{}, nivelesMod:null, revisiones:[], acciones:[], borradas:[], salud: nuevaSalud(), bloques: nuevosBloques(), agenda: {eventos: []}});
const nivelDeNota = n => n <= 4 ? 'mas' : n <= 7 ? 'una' : 'bien';
/* Pasa los datos de v1 (notas del 1 al 10 y acciones por semana) al formato nuevo */
function migrar(d){
  const v = vacio(); v.borradas = d.borradas || [];
  (d.evaluaciones || []).forEach(e => {
    const niveles = {}; Object.keys(e.notas || {}).forEach(k => niveles[k] = nivelDeNota(e.notas[k]));
    v.revisiones.push({id: e.id, fecha: e.fecha, niveles, detalle: {}, comentarios: e.comentarios || {}});

/* Una nota cálida tipo campana con un «brum» grave debajo */
function nota(frec, t0, vol = .22, dur = 1.1, brum = true){
  const c = audio(); if(!c) return;
  const t = c.currentTime + (t0 || 0);
  const salida = c.createGain(); salida.gain.value = vol; salida.connect(c.destination);
  const capas = [[frec,'sine',1],[frec*2,'triangle',.28],[frec*3,'sine',.08]];
  if(brum) capas.push([frec/2,'sine',.55]);
  capas.forEach(([f,tipo,g], i) => {
    const o = c.createOscillator(), e = c.createGain();
    o.type = tipo; o.frequency.setValueAtTime(i === 3 ? f*1.06 : f, t);
    if(i === 3) o.frequency.exponentialRampToValueAtTime(f, t + .18);
    e.gain.setValueAtTime(0.0001, t);
    e.gain.exponentialRampToValueAtTime(g, t + (i === 3 ? .03 : .012));
    e.gain.exponentialRampToValueAtTime(0.0001, t + dur * (i === 3 ? .7 : i === 0 ? 1 : .55));
    o.connect(e); e.connect(salida); o.start(t); o.stop(t + dur + .05);
  });
}

/* Reordenar las tareas del bloque de ahora (seis puntitos en Focus) */

/* Cuenta atrás del bloque (mm:ss) y sonido de segundero opcional */
function fmtCuenta(fin){
  const d = new Date(), q = Math.max(0, fin * 60 - (d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds()));
  return Math.floor(q / 60) + ':' + String(q % 60).padStart(2, '0');
}
let ticOn = false; try{ ticOn = localStorage.getItem('equilibra.tictac') === '1'; }catch(e){}
let ticCtx = null, ticPar = false;
function ticPreparar(){ try{ ticCtx = ticCtx || new (window.AudioContext || window.webkitAudioContext)(); if(ticCtx.state !== 'running') ticCtx.resume(); }catch(e){} }
function alternarTic(){

function sonarTic(){
  if(!ticCtx || ticCtx.state !== 'running') return;
  const t = ticCtx.currentTime, o = ticCtx.createOscillator(), g = ticCtx.createGain();
  o.type = 'square'; o.frequency.value = (ticPar = !ticPar) ? 1900 : 1500;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
  o.connect(g).connect(ticCtx.destination); o.start(t); o.stop(t + 0.05);
}
function segundero(){

  if(ticOn && vista === 'inicio' && els.length && !document.hidden && !pausa.tareas) sonarTic();

/* Girasol: centro grande = bloque de ahora; pétalos más pequeños alrededor */
function florGirasol(niveles, bloque, pendientesN){

  const dosRenglones = (t, k) => {
    if(t.length <= k) return [t];
    let i = t.lastIndexOf(' ', k); if(i < 4) i = k;
    return [t.slice(0, i).trim(), corta(t.slice(i).trim(), k)];

  <defs><filter id="brillo${n}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="centro${n}"><stop offset="0" stop-color="#ffe59a"/><stop offset=".55" stop-color="#f7b733"/><stop offset="1" stop-color="#c9741a"/></radialGradient>
  <pattern id="semillas${n}" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.3" fill="#7a4310" fill-opacity=".35"/></pattern></defs>`;

    s += `<g transform="rotate(${i*paso}) translate(0 ${-R0 + 8})"><path d="${petalo(Lp, 38)}" fill="${a.color}" fill-opacity="${sel && !nv ? .5 : op}" ${extra}/></g>`;
  });

  if(bloque){

      ${tareas.length ? dosRenglones(tareas[0], 18).map((l, k, arr) => `<text class="g-tarea" y="${arr.length === 1 ? 6 : k ? 17 : 3}" text-anchor="middle" dominant-baseline="central">${esc(l)}</text>`).join('')
        : '<text class="g-tarea" y="6" text-anchor="middle" dominant-baseline="central">Sin tareas</text>'}`;
    if(resto > 0) s += `<g transform="translate(0 38)"><text class="g-mas" x="-4" text-anchor="end" dominant-baseline="central">+${resto}</text>
      <g transform="translate(-1 -8)"><rect x="1.5" y="1.5" width="13" height="13" rx="3" fill="none" stroke="#3a2208" stroke-width="1.8"/><path d="M4.5 8.3l2.3 2.3 4.5-4.6" fill="none" stroke="#3a2208" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g></g>`;
  }
  else s += `<text class="g-hora" y="-6" text-anchor="middle" dominant-baseline="central">${pendientesN}</text><text class="g-sub" y="18" text-anchor="middle" dominant-baseline="central">pendientes</text>`;
  const conBloque = idsEnBloquesHoy();
  AREAS.forEach((a, i) => {
    const ang = i*paso - 90, giro = (ang > 90 || ang < -90) ? ang + 180 : ang;

  x.hecha = !x.hecha; x.hechaEn = x.hecha ? ahoraISO() : null; x.mod = ahoraISO();

/* ---------- Dictar con la voz (micrófono) ---------- */
const Reconocer = window.SpeechRecognition || window.webkitSpeechRecognition;
const MIC = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const esApp = !!window.AndroidEquilibra;   // dentro de la app Android
function botonMic(){ return (Reconocer || esApp) ? `<button class="mic" type="button" aria-label="Dictar con la voz" onclick="dictar(this)">${MIC}</button>` : ''; }
let reconocimiento = null;
let campoDictado = null;
/* En la app Android el dictado lo hace el teléfono y vuelve por aquí */
window.nativeDictation = (texto, error) => {
  document.querySelectorAll('.mic.escuchando').forEach(b => b.classList.remove('escuchando'));
  if(error){ aviso(error); return; }
  if(!campoDictado || !texto) return;
  let v = ((campoDictado.value.trim() ? campoDictado.value.trim() + ' ' : '') + texto).trim();
  campoDictado.value = (v.charAt(0).toUpperCase() + v.slice(1)).slice(0, campoDictado.maxLength > 0 ? campoDictado.maxLength : 500);
  campoDictado.dispatchEvent(new Event('input'));
};
function dictar(btn){
  if(esApp){ campoDictado = btn.previousElementSibling; btn.classList.add('escuchando'); AndroidEquilibra.dictar(); return; }
  if(reconocimiento){ reconocimiento.stop(); return; }
  const campo = btn.previousElementSibling;
  const base = campo.value.trim() ? campo.value.trim() + ' ' : '';
  const r = new Reconocer();
  r.lang = 'es-ES'; r.interimResults = true; r.continuous = false;
  r.onresult = e => {
    let t = ''; for(const x of e.results) t += x[0].transcript;
    let v = (base + t).trim(); v = v.charAt(0).toUpperCase() + v.slice(1);
    campo.value = v.slice(0, campo.maxLength > 0 ? campo.maxLength : 500);
    campo.dispatchEvent(new Event('input'));
  };
  r.onerror = e => { if(e.error === 'not-allowed' || e.error === 'service-not-allowed') aviso('Permite el micrófono para dictar'); else if(e.error !== 'no-speech' && e.error !== 'aborted') aviso('No se pudo dictar (' + e.error + ')'); };
  r.onend = () => { btn.classList.remove('escuchando'); reconocimiento = null; };
  btn.classList.add('escuchando'); reconocimiento = r;
  try{ r.start(); }catch(e){ btn.classList.remove('escuchando'); reconocimiento = null; }
}

      const el = document.createElement(tag);
      if(tag === 'a'){ const href = c.getAttribute('href') || ''; if(/^(https?:|mailto:)/i.test(href)){ el.setAttribute('href', href); el.target = '_blank'; el.rel = 'noopener noreferrer'; } }

  const e = edicion; if(!e) return;
  const t = valor('ed-texto'); if(!t){ aviso('Escribe el nombre de la tarea'); return; }
  edicion = null;
  nuevoEvento(hoyK(), null, {t, area: e.area, acc: e.id || null, dur: e.dur || 0, prio: e.prio || 0});
}
/* Con la app Android 2.38 o más nueva, los recordatorios también llegan con la app cerrada: se le manda la lista de
   los próximos 8 días ({id, at, tit, txt}) y el teléfono los deja programados (notificación con sonido). Solo si cambia. */
const recordNativo = () => { try{ return esApp && typeof AndroidEquilibra.programarRecordatorios === 'function'; }catch(e){ return false; } };
let recordUlt = null;
function textoRecord(e, a, falta){
  if(e.todo) return a === 0 ? 'Hoy' : a === 1440 ? 'Mañana' : a === 2880 ? 'Pasado mañana' : 'Dentro de una semana';
  if(a === 0) return `Ahora · ${hm(e.ini)} – ${hm(e.fin)}`;
  if(a === 1440) return `Mañana a las ${hm(e.ini)}`;
  return `A las ${hm(e.ini)} (${(falta || a) >= 55 ? 'en 1 hora' : `en ${falta || a} min`})`;
}
function enviarRecordatorios(){
  if(!recordNativo() || !D || !D.agenda) return;
  const ahora = Date.now(), hoy = hoyK(), lista = [];
  for(let n = 0; n <= 8; n++){
    const k = sumarDias(hoy, n);
    eventosDe(k).forEach(e => { if(hechoEv(e, k)) return; (e.avisos || []).forEach(a => {
      const at = fechaDe(k).getTime() + (e.todo ? 540 : e.ini) * 60000 - a * 60000;
      if(at > ahora) lista.push({id: `${e.id}|${k}|${a}`, at, tit: e.t, txt: textoRecord(e, a) + (e.tipo === 'habito' ? ' · hábito' : '')});
    }); });
  }
  lista.sort((x, y) => x.at - y.at);
  const json = JSON.stringify(lista.slice(0, 100));   // Android deja como mucho 500 alarmas por app
  if(json === recordUlt) return;
  recordUlt = json;
  try{ AndroidEquilibra.programarRecordatorios(json); }catch(e){}
}
/* Recordatorios (con la app abierta), como en TickTick: varios por cosa; los de «todo el día», a las 9:00 */
function avisarEventos(){
  const ahora = Date.now(), hoy = hoyK();
  let vistos; try{ vistos = JSON.parse(localStorage.getItem('equilibra.recordados')) || []; }catch(e){ vistos = []; }
  let cambio = false;
  for(let n = 0; n <= 7; n++){
    const k = sumarDias(hoy, n);
    eventosDe(k).forEach(e => (e.avisos || []).forEach(a => {
      const base = fechaDe(k).getTime() + (e.todo ? 540 : e.ini) * 60000, cuando = base - a * 60000, clave = `${e.id}|${k}|${a}`;
      if(ahora < cuando || ahora > cuando + 10 * 60000 || vistos.includes(clave) || hechoEv(e, k)) return;
      vistos.push(clave); cambio = true;
      if(esApp && document.visibilityState !== 'visible' && recordNativo()) return;   // la notificación del teléfono ya avisa
      const txt = `${textoRecord(e, a, Math.max(1, Math.round((base - ahora) / 60000)))}: ${e.t}`;   // con lo que falta de verdad
      nota(ESCALA[5], 0, .15, .8, false); nota(ESCALA[7], .12, .15, .9, false);
      aviso(txt, 9000);
      setTimeout(() => hablar(txt.replace(/\(en (\d+) min\)/, 'dentro de $1 minutos').replace('(en 1 hora)', 'dentro de una hora') + '.', 'tareas'), 700);
    }));
  }
  if(cambio){ try{ localStorage.setItem('equilibra.recordados', JSON.stringify(vistos.filter(c => c.split('|')[1] >= sumarDias(hoy, -2)).slice(-300))); }catch(e){} }
}

/* ---------- Día: bloques de tiempo de 5:30 a 22:00 (venidos de Amable PC) ---------- */
const BLOQUES = []; for(let m = 330; m < 1320; m += 90) BLOQUES.push({ini: m, fin: m + 90});
const MAX_ACT = 3;
const hm = m => Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0');
const bloqueAhora = () => { const m = minutosHoy(); return BLOQUES.findIndex(b => m >= b.ini && m < b.fin); };
const DIAS_SEM = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
let bDia = 0, bSel = null, bUltimo = null;
const B_ = () => D.bloques;
function fechaBloques(){ const d = new Date(); d.setDate(d.getDate() + bDia); return d; }
function actsDe(k, i, crear){
  const days = B_().days;
  if(!days[k]){ if(!crear) return []; days[k] = {}; }
  if(!days[k][i]){ if(!crear) return []; days[k][i] = []; }
  const arr = days[k][i];
  for(let j = 0; j < arr.length; j++) if(typeof arr[j] === 'string') arr[j] = {t: arr[j], d: false};
  return arr;
}
/* Una actividad ligada a una acción está hecha si lo está la acción */
const hechaAct = a => a.d || !!(a.acc && (D.acciones.find(x => x.id === a.acc) || {}).hecha);
function guardarBloques(){ B_().mod = ahoraISO(); apuntarBloquesConTareas(); guardar(); }
function tiraBloque(){
  const c = bloqueAhora(), m = minutosHoy();
  let txt;
  if(c >= 0){ const acts = actsDe(claveDia(new Date()), c), sig = acts.find(a => !hechaAct(a));
    txt = `<b>Ahora · ${hm(BLOQUES[c].ini)}–${hm(BLOQUES[c].fin)}</b><span>${acts.length ? (sig ? esc(sig.t) : '✓ todo hecho') : 'Sin planificar: toca para elegir'}</span>`; }
  else txt = `<b>${m >= 1320 ? 'Hora de descansar 🌙' : 'Tu día empieza a las 5:30'}</b><span>Planifica tus bloques de mañana</span>`;
  return `<button class="tira-bloque" onclick="ir('dia')"><span class="tb-ico">⏱</span><span class="tb-txt">${txt}</span><span class="flecha">›</span></button>`;
}

      ${lleno ? `<p class="peq suave" style="margin:8px 0 0">Bloque completo · ${MAX_ACT} actividades</p>` : `

/* Barra con punto bajo los círculos: al mover el punto, la fila acompaña; al soltar, se elige ese bloque */
function verBloqueBarra(i){
  const t = $('#tiraBlk'), el = t && t.querySelector(`[data-i="${i}"]`);
  if(el) t.scrollTo({left: el.offsetLeft - (t.clientWidth - el.offsetWidth) / 2});
}
function moverBloque(dir){
  let i = (bSel == null ? 0 : bSel) + dir;
  if(i >= BLOQUES.length || i < 0) return;
  bSel = i;
  const y = window.scrollY; render(); window.scrollTo(0, y); centrarBloque(true);
  const c = document.querySelector('.girasol .g-hora'); if(c){ c.classList.remove('g-pasa'); void c.getBBox(); c.classList.add('g-pasa'); }
}
function centrarBloque(suave){
  const t = $('#tiraBlk'), el = t && t.querySelector(`[data-i="${bSel}"]`);
  if(!el) return;
  t.scrollTo({left: el.offsetLeft - (t.clientWidth - el.offsetWidth) / 2, behavior: suave ? 'smooth' : 'auto'});
}
function elegirBloque(i){ bSel = i; rerenderDia(); }
function rerenderDia(){ const y = window.scrollY; render(); window.scrollTo(0, y); }
function anadirAct(){
  const t = valor('b-nueva'); if(!t){ aviso('Escribe la actividad'); return; }
  const acts = actsDe(claveDia(fechaBloques()), bSel, true);
  if(acts.length >= MAX_ACT){ aviso('Bloque completo'); return; }
  acts.unshift({t, d:false}); guardarBloques(); sonarHecho(); rerenderDia();
}
/* Hoja con todas las acciones pendientes de tus áreas, para ponerlas en el bloque elegido */

  const k = claveDia(fechaBloques()), b = BLOQUES[bSel], acts = actsDe(k, bSel);

      ${g.lista.map(x => `<div class="ta-fila"><div class="ta-l1"><span class="ta-t">${ICO_TAREA}${bandX(x)}${esc(x.texto)}${durX(x)}</span>${lapiz(`editarTarea('${x.id}')`)}</div>${ya.has(x.id)
        ? `<button class="sa-con" onclick="quitarDeBloques('${x.id}', true)">✓ En este bloque · quitar</button>`
        : `<button class="ta-btn" ${lleno ? 'disabled' : ''} onclick="accionABloque('${x.id}')">＋ Añadir a este bloque</button>`}</div>`).join('')}`).join('')

    <button class="btn sec ancho" style="margin-top:16px" onclick="cerrarHoja()">Listo</button>`, '#8b5cf6');

function anadirEnHoja(){
  const t = valor('h-blq-nueva'); if(!t){ aviso('Escribe la tarea'); return; }
  const acts = actsDe(claveDia(fechaBloques()), bSel, true);
  if(acts.length >= MAX_ACT){ aviso('Bloque completo'); return; }
  acts.unshift({t, d: false}); guardarBloques(); sonarHecho(); aviso('Añadida al bloque 🌱');
  $('#h-blq-nueva').value = ''; rerenderDia();
}
function accionABloque(id){
  const x = D.acciones.find(a => a.id === id); if(!x) return;
  const acts = actsDe(claveDia(fechaBloques()), bSel, true);
  if(acts.length >= MAX_ACT){ aviso('Bloque completo'); return; }
  acts.push({t: x.texto, d:false, acc: id}); guardarBloques(); sonarHecho();
  aviso(`Acción puesta a las ${hm(BLOQUES[bSel].ini)} 🌱`); rerenderDia();
}
function alternarAct(i){
  const k = claveDia(fechaBloques()), b = bSel, a = actsDe(k, b)[i]; if(!a) return;
  const nueva = !hechaAct(a);
  a.d = nueva; a.hechaEn = nueva ? ahoraISO() : null;
  const x = a.acc && D.acciones.find(z => z.id === a.acc);
  if(x && x.hecha !== nueva){ x.hecha = nueva; x.hechaEn = nueva ? ahoraISO() : null; x.mod = ahoraISO(); }
  const volverCompro = nueva ? cumplirCompromiso(a) : null;
  guardarBloques();
  if(nueva){
    if(volverCompro) sonarFinal(); else sonarHecho();
    programarArchivo();
    avisoDeshacer(volverCompro ? '¡Compromiso cumplido!' : 'Tarea completada', () => {
      a.d = false; a.hechaEn = null;
      if(x){ x.hecha = false; x.hechaEn = null; x.mod = ahoraISO(); }
      if(volverCompro) volverCompro();
      guardarBloques(); rerenderDia();
    });
  }
  rerenderDia();
}
function borrarAct(i){ quitarActividad(claveDia(fechaBloques()), bSel, i); rerenderDia(); }
/* Tachar es archivar: pasados los 4 s de deshacer, la tarea sale del bloque y queda en el Historial */
let archivoT = null;
function programarArchivo(){ clearTimeout(archivoT); archivoT = setTimeout(archivarHechas, 4200); }
function archivarHechas(){
  archivoT = null;
  const dias = B_().days; let n = 0;
  Object.keys(dias).forEach(k => Object.keys(dias[k]).forEach(i => {
    const arr = actsDe(k, i);
    for(let j = arr.length - 1; j >= 0; j--){ const a = arr[j]; if(!a || !hechaAct(a)) continue;
      if(!a.acc) archivarSinPetalo(a, k, i);
      arr.splice(j, 1); n++; }
  }));
  if(!n) return;
  guardarBloques();
  if(['inicio', 'dia'].includes(vista) && (document.activeElement || {}).id !== 'b-nueva') refrescarFocus();
  pintarFlotante();
}
/* Las apuntadas directamente en un bloque no tienen pétalo: se archivan como acción sin área */
function archivarSinPetalo(a, k, i){
  const h = [...a.t + (a.hechaEn || '')].reduce((n, c) => (n * 31 + c.charCodeAt(0)) | 0, 7);
  const id = `b${k.replace(/-/g, '')}${i}x${Math.abs(h).toString(36)}`;   // el mismo id en todos tus aparatos
  if(D.acciones.some(x => x.id === id) || (D.borradas || []).includes(id)) return;
  const f = a.hechaEn || new Date(k + 'T12:00:00').toISOString();
  D.acciones.push({id, area: null, texto: a.t, hecha: true, creada: f, hechaEn: f, mod: ahoraISO()});
}
function reabrirSinPetalo(x){
  D.acciones = D.acciones.filter(a => a !== x); D.borradas = (D.borradas || []).concat(x.id);
  actsDe(hoyK(), Math.max(bloqueAhora(), 0), true).unshift({t: x.texto, d: false});
  guardarBloques(); aviso('Tarea devuelta al bloque'); rerenderDia();
}
function ajBloque(clave, el){ B_()[clave] = el.checked; guardarBloques(); }
function ajBloqueMin(el){ const v = Math.round(Number(el.value)); if(v >= 1 && v <= 60){ B_().remindMin = v; guardarBloques(); } else el.value = B_().remindMin; }
/* Al pasar de bloque, lo que quedó sin hacer se pasa al bloque nuevo (hasta 3 por bloque) */
function arrastrar(c){
  const B = B_(), k = claveDia(new Date());
  if(c < 0) return 0;
  const ant = B.ultimo; B.ultimo = {k, i: c};
  if(!ant || ant.k !== k || ant.i >= c) return 0;
  const hacia = actsDe(k, c, true);
  let n = 0;
  for(let i = ant.i; i < c && hacia.length < MAX_ACT; i++){
    const desde = actsDe(k, i);
    for(let j = 0; j < desde.length && hacia.length < MAX_ACT;){ if(!hechaAct(desde[j])){ hacia.push(desde.splice(j, 1)[0]); n++; } else j++; }
  }
  return n;
}
let recordarDesde = Date.now(), bloquesTickAbrir = true;   // la primera vuelta cuenta como «al abrir la app»
/* Redibuja Focus sin tocar la hoja que esté abierta, para no perder lo que estés escribiendo */
function refrescarFocus(){ const h = hojaAbierta; hojaAbierta = null; rerenderDia(); hojaAbierta = h; }

    if(movidas || c >= 0) guardarBloques();
    if(!primeraVez && c >= 0 && B.startVoice && !pausa.tareas){
      const acts = actsDe(claveDia(new Date()), c).filter(a => !hechaAct(a)).map(a => a.t);

const CAMINAR = [[660, 2000], [780, 4000], [960, 6000], [1080, 8000]];
function caminarTick(){
  const S = S_(); if(!S.pasosOn || !S.caminarOn || !esApp) return;
  const k = claveDia(new Date()), m = minutosHoy();
  if(!S.caminarHecho || S.caminarHecho.k !== k) S.caminarHecho = {k, n: 0};
  let idx = -1; CAMINAR.forEach(([t], i) => { if(m >= t) idx = i; });
  if(idx < 0 || idx + 1 <= S.caminarHecho.n) return;
  S.caminarHecho.n = idx + 1; guardarSalud(false);
  const [t, meta] = CAMINAR[idx], pasos = pasosHoy().steps;
  if(m - t > 60 || pasos >= meta) return;
  hablar(`Son las ${Math.floor(t/60)} y llevas ${fmtN(pasos)} pasos. Te faltan ${fmtN(meta - pasos)} para los ${fmtN(meta)}. Es buen momento para caminar.`, 'salud');

/* Une lo de este dispositivo con lo de la nube: por id, gana lo cambiado más tarde */
function fusionar(local, remoto){
  if(!remoto) return local;
  remoto = normalizar(remoto);
  const borradas = [...new Set([...(local.borradas || []), ...(remoto.borradas || [])])];
  const unir = (a, b, clave) => {
    const m = {};
    [...b, ...a].forEach(x => { if(borradas.includes(x.id)) return; const y = m[x.id]; if(!y || (x[clave] || '') > (y[clave] || '')) m[x.id] = x; });
    return Object.values(m);
  };
  const r = vacio();
  r.borradas = borradas;
  r.acciones = unir(local.acciones, remoto.acciones, 'mod').sort((x,y) => x.creada < y.creada ? -1 : 1);
  r.revisiones = unir(local.revisiones, remoto.revisiones, 'fecha').sort((x,y) => x.fecha < y.fecha ? -1 : 1);
  const gana = (remoto.nivelesMod || '') > (local.nivelesMod || '') ? remoto : local;
  r.niveles = {...gana.niveles}; r.detalle = gana.detalle || {}; r.comentarios = gana.comentarios || {}; r.nivelesMod = gana.nivelesMod;
  // salud: ajustes del lado cambiado más tarde; por día se queda el número más alto
  const sl = local.salud || nuevaSalud(), sr = remoto.salud || nuevaSalud();
  r.salud = nuevaSalud((sr.mod || '') > (sl.mod || '') ? sr : sl);
  r.salud.days = {}; r.salud.pasos = {};
  [sl, sr].forEach(x => {
    Object.keys(x.days || {}).forEach(k => { const a = r.salud.days[k] || {agua:0, mov:0}, b = x.days[k]; r.salud.days[k] = {agua: Math.max(a.agua, b.agua || 0), mov: Math.max(a.mov, b.mov || 0)}; });
    Object.keys(x.pasos || {}).forEach(k => { const a = r.salud.pasos[k], b = x.pasos[k]; if(!a || (b.steps || 0) > a.steps) r.salud.pasos[k] = b; });
  });
  // bloques: ajustes y días del lado cambiado más tarde; los días que solo están en un lado se conservan
  const bl = local.bloques || nuevosBloques(), br = remoto.bloques || nuevosBloques();
  const [bGana, bPierde] = (br.mod || '') > (bl.mod || '') ? [br, bl] : [bl, br];
  r.bloques = nuevosBloques(bGana);
  r.bloques.days = Object.assign({}, bPierde.days || {}, bGana.days || {});
  r.agenda = {eventos: unir((local.agenda || {}).eventos || [], (remoto.agenda || {}).eventos || [], 'mod')};   // calendario: por evento, gana el cambiado más tarde
  r.nombre = local.nombre || remoto.nombre || '';
  const al = local.appAndroid, ar = remoto.appAndroid;
  const cr = [local.calRevisado, remoto.calRevisado].filter(Boolean).sort().pop(); if(cr) r.calRevisado = cr;
  const rl = local.registroDia, rr = remoto.registroDia;
  if(rl || rr) r.registroDia = rl && rr && rl.dia === rr.dia ? {dia: rl.dia, bloques: [...new Set([...rl.bloques, ...rr.bloques])]} : [rl, rr].filter(Boolean).sort((a, b) => a.dia < b.dia ? 1 : -1)[0];
  const cl = local.compromiso, cm = remoto.compromiso;
  if(cl || cm) r.compromiso = (cm && (!cl || (cm.mod || '') > (cl.mod || ''))) ? cm : cl;
  if(al || ar) r.appAndroid = (ar && (!al || (ar.visto || '') > (al.visto || ''))) ? ar : al;
  return r;
}

/* Tiempo real (Gustavo, 3.82: «añadí una tarea en el móvil y no la veo en el ordenador»): se escucha el documento de la nube;
   cuando otro aparato lo cambia, se une con lo de aquí y se vuelve a pintar (sin interrumpir si estás escribiendo). */
function escucharNube(){
  if(!nube.ref || nube.escucha) return;
  nube.escucha = nube.ref.onSnapshot(doc => {
    if(doc.metadata.hasPendingWrites || !doc.exists) return;   // es lo que acabo de subir yo
    const r = doc.data(); if(!r || r.actualizado === nube.subido) return;
    const antes = JSON.stringify(D);

    if(JSON.stringify(D) === antes) return;

const BYDAY = ['MO', 'TU', 'WE', 'TH', 'FR', 'SA', 'SU'];
const icsTxt = t => String(t || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
const icsFecha = k => k.replace(/-/g, '');
const icsHora = (k, m) => icsFecha(k) + 'T' + String(Math.floor(m / 60)).padStart(2, '0') + String(m % 60).padStart(2, '0') + '00';
const icsPlegar = l => { const o = []; let x = l; while(x.length > 74){ o.push(x.slice(0, 74)); x = ' ' + x.slice(74); } o.push(x); return o.join('\r\n'); };
function calICS(){
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Practica Integral//Amable Life//ES', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Amable Life'];
  const sello = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  AG_().eventos.forEach(e => {
    const dia = e.dia || hoyK(), ini = e.ini || 0, fin = e.fin != null ? e.fin : Math.min(ini + 60, 1439);
    L.push('BEGIN:VEVENT', 'UID:' + (e.impId || e.id + '@amablelife'), 'DTSTAMP:' + sello, 'SUMMARY:' + icsTxt(e.t));
    if(e.todo) L.push('DTSTART;VALUE=DATE:' + icsFecha(dia), 'DTEND;VALUE=DATE:' + icsFecha(sumarDias(dia, 1)));
    else L.push('DTSTART:' + icsHora(dia, ini), 'DTEND:' + icsHora(dia, fin));
    const rr = e.tipo === 'habito' ? 'FREQ=WEEKLY;BYDAY=' + (e.dias && e.dias.length ? e.dias : [diaSem(dia)]).slice().sort().map(d => BYDAY[d]).join(',')
      : ({dia: 'FREQ=DAILY', semana: 'FREQ=WEEKLY;BYDAY=' + BYDAY[diaSem(dia)], mes: 'FREQ=MONTHLY;BYMONTHDAY=' + fechaDe(dia).getDate(), anio: 'FREQ=YEARLY', lab: 'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR'})[e.rep] || '';
    if(rr) L.push('RRULE:' + rr);
    if(e.tipo === 'habito') L.push('X-AMABLE-TIPO:habito');
    (e.saltar || []).forEach(k => L.push(e.todo ? 'EXDATE;VALUE=DATE:' + icsFecha(k) : 'EXDATE:' + icsHora(k, ini)));
    if(e.desc) L.push('DESCRIPTION:' + icsTxt(e.desc));
    if(e.prio) L.push('PRIORITY:' + ({1: 9, 2: 5, 3: 1})[e.prio]);
    const ars = areasEv(e); if(ars.length) L.push('CATEGORIES:' + ars.map(a => icsTxt(a.nombre)).join(','));
    (e.avisos || []).forEach(m => {
      const off = e.todo ? 540 - m : -m;   // todo el día: el aviso es a las 9:00
      L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsTxt(e.t), 'TRIGGER:' + (off < 0 ? '-PT' + (-off) : 'PT' + off) + 'M', 'END:VALARM');
    });
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.map(icsPlegar).join('\r\n') + '\r\n';
}
function calCSV(){
  const q = v => /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  const us = k => { const [y, m, d] = k.split('-'); return `${m}/${d}/${y}`; };
  const h12 = m => { let h = Math.floor(m / 60); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${String(m % 60).padStart(2, '0')} ${ap}`; };
  const fila = (e, k) => [e.t, us(k), e.todo ? '' : h12(e.ini || 0), us(k), e.todo ? '' : h12(e.fin != null ? e.fin : (e.ini || 0) + 60), e.todo ? 'True' : 'False', e.desc || '', 'True'];
  const F = [['Subject', 'Start Date', 'Start Time', 'End Date', 'End Time', 'All Day Event', 'Description', 'Private']];
  AG_().eventos.filter(e => !repite(e)).sort((a, b) => (a.dia + (a.ini || 0)).localeCompare(b.dia + (b.ini || 0))).forEach(e => F.push(fila(e, e.dia)));
  const desde = sumarDias(hoyK(), -30);
  for(let n = 0; n <= 395; n++){ const k = sumarDias(desde, n); eventosDe(k).filter(repite).forEach(e => F.push(fila(e, k))); }
  return '\ufeff' + F.map(f => f.map(x => q(String(x))).join(',')).join('\r\n') + '\r\n';
}

  // Portada: la flor abre sus pétalos con una nota por pétalo
  const splash = $('#splash');
  let sinPortada = false; try{ sinPortada = sessionStorage.getItem('equilibra.sinPortada') === '1'; sessionStorage.removeItem('equilibra.sinPortada'); }catch(e){}
  if(sinPortada) splash.remove();
  else {
  for(let k = 0; k < 18; k++){
    const c = document.createElement('i'); c.className = 'chispa';
    const ang = Math.random()*Math.PI*2, dist = 90 + Math.random()*120;
    c.style.cssText = `left:50%;top:42%;--dx:${(Math.cos(ang)*dist).toFixed(0)}px;--dy:${(Math.sin(ang)*dist).toFixed(0)}px;animation-delay:${(1 + Math.random()*.8).toFixed(2)}s`;
    splash.appendChild(c);
  }
  // La música de inicio suena por defecto. Si el navegador la bloquea (pasa la primera vez en la web,
  // no en la app instalada), suena en cuanto la persona toca la pantalla por primera vez.
  let sonada = false, musicaFalla = false;
  musica.addEventListener('error', () => { musicaFalla = true; });
  const tocarSonido = () => {
    if(sonada || !sonidoOn) return Promise.resolve(false);
    const ok = () => { sonada = true; $('#tocar').classList.remove('ver'); return true; };
    if(!musicaFalla){
      musica.currentTime = 0;
      return musica.play().then(ok).catch(() => false);
    }
    // Si el archivo no carga, la flor suena con las notas generadas
    const c = audio(); if(!c) return Promise.resolve(false);
    return (c.state === 'running' ? Promise.resolve() : c.resume()).then(() => {
      if(c.state === 'running' && !sonada){ sonarPortada(); return ok(); }
      return false;
    }).catch(() => false);
  };
  tocarSonido();
  // Los móviles solo dejan sonar después de un toque «de verdad» (click / touchend, no pointerdown)
  const EVENTOS = ['click', 'touchend', 'keydown'];
  const alPrimerToque = e => {
    if(e.target.closest && e.target.closest('a')) return;
    EVENTOS.forEach(t => removeEventListener(t, alPrimerToque, true));
    if(performance.now() < 60000) tocarSonido();
  };
  EVENTOS.forEach(t => addEventListener(t, alPrimerToque, true));

  let cerrada = false;
  const cerrar = () => { if(cerrada) return; cerrada = true; splash.classList.add('fuera'); window.scrollTo(0, 0); setTimeout(() => splash.remove(), 700); };
  splash.addEventListener('click', e => {
    if(e.target.closest('a')) return;
    // el toque hace sonar la canción; se deja ver la flor un momento antes de entrar
    if(!sonada && sonidoOn){ tocarSonido(); $('#tocar').classList.remove('ver'); clearTimeout(tCerrar); tCerrar = setTimeout(cerrar, 1800); return; }
    cerrar();
  });
  // Si el móvil no dejó sonar la música sola, la portada espera un toque («Toca para entrar») para que siempre suene
  let tCerrar = setTimeout(() => {
    if(sonada || !sonidoOn) cerrar();
    else $('#tocar').classList.add('ver');
  }, 2600);
  }

  iniciarNube();
  iniciarSalud();
  setTimeout(apuntarApp, 3000);
  // la barra de abajo siempre en el borde visible (en algún móvil quedaba por debajo de la pantalla)
  const ajustarNav = () => {
    const n = $('#nav'), vv = window.visualViewport; if(!n || !vv) return;
    const f = document.activeElement; if(f && /^(INPUT|TEXTAREA)$/.test(f.tagName)){ n.style.transform = ''; return; }
    const d = document.documentElement.clientHeight - (vv.height + vv.offsetTop);
    n.style.transform = d > 2 ? `translateY(${-d}px)` : '';
  };
  if(window.visualViewport){ visualViewport.addEventListener('resize', ajustarNav); visualViewport.addEventListener('scroll', ajustarNav); }
  addEventListener('resize', ajustarNav); setTimeout(ajustarNav, 1500);

  // App instalable (y que funcione sin conexión)
  if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    const habia = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
    // si entra un service worker nuevo (versión nueva), se recarga una vez para mostrarla
    // (antes recargaba siempre y la flor de entrada salía dos veces, aunque la página ya fuera la nueva: ahora solo si hace falta)
    navigator.serviceWorker.addEventListener('controllerchange', () => { if(habia && !recargando) buscarActualizacion(false); });
  }
  setTimeout(() => buscarActualizacion(false), 4000);
})();
</script>
<script src="https://gcalabro12.github.io/Grow-Panel/grow-panel-boton.js" data-app="equilibra" data-nombre="Amable Life" defer></script>
