<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Amable Life</title>
<meta name="description" content="Amable Life: ten claras tus próximas acciones para vivir en equilibrio. La flor de 8 áreas te dice dónde poner energía.">
<meta name="theme-color" content="#140f26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Amable Life">
<link rel="icon" id="favicon">
<link rel="apple-touch-icon" href="img/icono-life-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bl:255,255,255;
  --fondo:#140f26; --fondo2:#1d1636; --tarjeta:#221a40; --tinta:#f4f0fb; --suave:#a99fca; --linea:#352a5c;
  --acento:#f08a24; --acento2:#e2456b; --oro:#f7c35b; --sube:#4ade80; --baja:#fb7185;
}
*{box-sizing:border-box}
html,body{margin:0;overscroll-behavior-y:contain}   /* el «deslizar para actualizar» es el nuestro: el del navegador no salta a la vez */
#pullR{position:fixed;top:-44px;left:50%;margin-left:-22px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:#2a1f52;color:var(--oro);box-shadow:0 4px 14px rgba(0,0,0,.45);opacity:0;pointer-events:none;z-index:40}
#pullR.listo{background:var(--oro);color:#2a1f52}
body{background:radial-gradient(120% 60% at 50% 0%,#2a1f52 0,var(--fondo) 60%) fixed,var(--fondo);color:var(--tinta);
  font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{line-height:1.2;margin:0}
.envoltura{max-width:520px;margin:0 auto;padding:0 16px 110px}

/* Cabecera */
header.cab{position:sticky;top:0;z-index:5;background:rgba(20,15,38,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--linea)}
.cab-in{max-width:520px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.cab-in .marca{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:.2px}
.cab-in .marca svg{width:30px;height:30px;overflow:visible}
.cab-in .ver{font-size:11px;font-weight:700;color:var(--suave);border:1px solid var(--linea);border-radius:999px;padding:1px 7px}
.cab-in .der{margin-left:auto;display:flex;align-items:center;gap:8px}
#grow-panel-boton .gp-boton{border-color:var(--linea)}

/* Tarjetas y botones */
.tarjeta{background:var(--tarjeta);border:1px solid var(--linea);border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:14px 18px;font-weight:800;font-size:16px}
a.btn{text-decoration:none;box-sizing:border-box}
.btn.prim{background:linear-gradient(135deg,var(--acento),var(--acento2));color:#fff;box-shadow:0 6px 20px rgba(226,69,107,.35)}
.btn.prim:active{transform:translateY(1px)}
.btn.sec{background:rgba(var(--bl),.04);border:1.5px solid var(--linea);color:var(--tinta)}
.btn.ancho{width:100%}
.btn.peligro{background:transparent;border:1.5px solid #6b2a3f;color:var(--baja)}
.link{background:none;border:0;padding:6px 4px;color:var(--suave);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.suave{color:var(--suave)}
.peq{font-size:13px}

/* Flor */
.flor{display:block;width:100%;max-width:460px;margin:4px auto 0;overflow:visible}
.flor .petalo{animation:abre .9s cubic-bezier(.2,.9,.25,1.15) both;transform-origin:0px 0px}
@keyframes abre{from{transform:scale(0) rotate(-25deg);opacity:0}}
.flor .centro{animation:late 1.1s ease-out .55s both;transform-origin:0px 0px}
@keyframes late{0%{transform:scale(0)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.flor .eti-num{font-size:17px;font-weight:800;filter:brightness(1.3)}
.flor .eti-nom{font-size:12.5px;font-weight:800;fill:#fff;paint-order:stroke;stroke:rgba(20,12,40,.55);stroke-width:3px;stroke-linejoin:round;letter-spacing:.2px}
.mini{width:64px;height:64px;flex:none;margin:0}
.leyenda-prev{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--suave);margin-top:4px}
.leyenda-prev i{display:inline-block;width:22px;border-top:2px dashed #cbbcf5}

/* Cifras */
.cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.cifra{background:rgba(var(--bl),.04);border:1px solid var(--linea);border-radius:14px;padding:10px 8px;text-align:center}
.cifra b{display:block;font-size:20px;font-weight:800}
.cifra span{font-size:12px;color:var(--suave)}
.delta{font-size:12px;font-weight:800;white-space:nowrap}
.delta.up{color:var(--sube)} .delta.down{color:var(--baja)} .delta.igual{color:var(--suave)}

/* Lista de áreas */
.areas{margin-top:12px}
.fila{display:grid;grid-template-columns:26px 1fr 70px 30px 34px;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--linea)}
.fila:first-child{border-top:0}
.fila .em{display:flex;justify-content:center}
.fila .em .ico{width:18px;height:18px}
.ico{width:15px;height:15px;vertical-align:-2px;flex:none;display:inline-block}
.ico.pet-ev{width:13px;height:13px;margin-right:3px;vertical-align:-2px}
.hab-marca:not(.rj-ev){position:relative}
.hab-marca{z-index:3!important;box-shadow:0 0 0 2px var(--fondo2,#fff)}
.hab-marca::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;background:linear-gradient(90deg,var(--tinta) 50%,transparent 0) repeat-x 0 0/10px 2.5px,linear-gradient(90deg,var(--tinta) 50%,transparent 0) repeat-x 0 100%/10px 2.5px,linear-gradient(0deg,var(--tinta) 50%,transparent 0) repeat-y 0 0/2.5px 10px,linear-gradient(0deg,var(--tinta) 50%,transparent 0) repeat-y 100% 0/2.5px 10px;animation:hormigas .7s linear infinite}
.marca-anillo,.marca-pet{fill:none;stroke:var(--tinta);stroke-width:3;stroke-dasharray:3 2.2;stroke-linecap:round;pointer-events:none;opacity:0}
.marca-anillo.on,.marca-pet.on{opacity:1;animation:marcaGira 2.4s linear infinite}
.marca-pet.on{stroke-width:3.4;animation:marcaGira 2.4s linear infinite,marcaLate 1s ease-in-out infinite}
@keyframes marcaGira{to{stroke-dashoffset:-52}}
@keyframes marcaLate{50%{stroke-opacity:.35}}
@media (prefers-reduced-motion:reduce){.marca-anillo.on,.marca-pet.on{animation:none}}
@keyframes hormigas{to{background-position:10px 0,-10px 100%,0 -10px,100% 10px}}
@media (prefers-reduced-motion:reduce){.hab-marca::after{animation:none}}
.ico.g{width:26px;height:26px}
.fila .nom{font-weight:700;font-size:15px;line-height:1.2}
.fila .nom small{display:block;font-weight:600;font-size:12px;color:var(--suave)}
.fila .barra{height:8px;border-radius:99px;background:rgba(var(--bl),.08);overflow:hidden}
.fila .barra i{display:block;height:100%;border-radius:99px}
.fila b{text-align:right;font-size:16px}
.fila .delta{text-align:right}

/* Bienvenida */
.bienvenida{text-align:center;padding:0;overflow:hidden}
.bienvenida .hero{position:relative;height:300px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 50%,rgba(247,183,51,.22),transparent 62%)}
.bienvenida .hero svg{width:min(78%,340px);height:auto;filter:drop-shadow(0 10px 30px rgba(247,183,51,.25))}
.bienvenida .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 45%,var(--tarjeta))}
.bienvenida .txt{padding:0 20px 22px;margin-top:-30px;position:relative}
.bienvenida h1{font-size:26px;font-weight:800}
.bienvenida p{margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 18px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;
  background:color-mix(in srgb,var(--c) 18%,transparent);color:color-mix(in srgb,var(--c) 55%,#fff);border:1.5px solid transparent}
button.chip.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 32%,transparent);color:#fff}
/* 5.43 (Gustavo: «demasiado colorincha»): en las ventanas (nueva tarea, editar tarea…), los títulos y el texto de los botones en negro (el color del texto) */
.hoja .chip,.hoja button.chip.sel{color:var(--tinta)}
.hoja .eti{color:var(--tinta)!important}

/* Acción */
.accion{border-left:5px solid var(--c,var(--acento))}
.accion .eti{font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--suave);margin:0}
.accion .txt{font-size:18px;font-weight:700;margin:6px 0 12px}
.accion.hecha .txt{text-decoration:line-through;text-decoration-color:var(--c);color:var(--suave)}
.accion .acc-bots{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tareas{display:flex;flex-direction:column;gap:8px;margin:10px 0 12px}
.tarea{display:flex;align-items:center;gap:12px;text-align:left;background:rgba(var(--bl),.04);border:1px solid var(--linea);border-radius:14px;padding:11px 12px;font-weight:700;font-size:16px;color:var(--tinta)}
.tarea .caja{width:24px;height:24px;flex:none;border-radius:8px;border:2px solid var(--c);display:grid;place-items:center;color:transparent;font-size:14px}
.tarea.ok{color:var(--suave)}
.tarea.ok span:last-child{text-decoration:line-through;text-decoration-color:var(--c)}
.tarea.ok .caja{background:var(--c);color:#fff}
.regla{margin:10px 0 0;font-weight:700}
.regla small{display:block;font-weight:600;color:var(--suave);font-size:12px;margin-top:2px}
.campo-accion input{margin-top:8px}
.aviso-semana{border-color:#6b4a1f;background:linear-gradient(135deg,#3a2a17,#2a1f3f)}

/* Evaluar */
.progreso{display:flex;gap:5px;margin-top:14px}
.progreso i{flex:1;height:6px;border-radius:99px;background:rgba(var(--bl),.1)}
.progreso i.hecho{background:var(--c)}
.progreso i.actual{background:color-mix(in srgb,var(--c) 55%,transparent)}
.paso{font-size:13px;color:var(--suave);font-weight:700;margin:8px 0 0}
.eval{padding:0;overflow:hidden;text-align:center;animation:entra .45s ease-out both}
@keyframes entra{from{opacity:0;transform:translateX(24px)}}
.eval .ilus{position:relative;height:270px;background:var(--fondo2) center 30%/cover}
.eval .ilus::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,var(--tarjeta) 98%)}
.eval .cuerpo{padding:0 18px 20px;margin-top:-44px;position:relative}
.eval h2{font-size:25px;font-weight:800;margin-top:4px;color:color-mix(in srgb,var(--c) 55%,#fff)}
.pregunta{display:block;font-size:17px;font-weight:700;margin:16px 4px 0}
.valor{font-size:46px;font-weight:800;color:color-mix(in srgb,var(--c) 70%,#fff);line-height:1.1;margin-top:4px;transition:transform .15s}
.valor.pulso{transform:scale(1.15)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;margin:10px 0 6px;outline:none;
  background:linear-gradient(to right,var(--c) calc(var(--p,44.4)*1%),rgba(var(--bl),.12) 0)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:4px solid var(--c);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 25%,transparent)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid var(--c)}
.extremos{display:flex;justify-content:space-between;font-size:12px;color:var(--suave);font-weight:600}
.nota-doble{margin-top:16px;background:rgba(var(--bl),.05);border-radius:14px;padding:12px;font-weight:700}
.nota-doble b{color:color-mix(in srgb,var(--c) 70%,#fff);font-size:20px}
.nota-doble .pista{display:block;font-weight:600;font-size:13px;color:var(--suave);margin-top:2px}
details.nota{margin-top:14px;text-align:left}
details.nota summary{cursor:pointer;color:var(--suave);font-weight:700;font-size:14px;list-style:none;text-align:center}
details.nota summary::-webkit-details-marker{display:none}
textarea,input[type=text]{width:100%;font:inherit;border:1.5px solid var(--linea);border-radius:12px;padding:11px 12px;background:rgba(0,0,0,.2);color:var(--tinta)}
textarea::placeholder,input::placeholder{color:#7f74a3}
textarea{min-height:80px;resize:vertical;margin-top:8px}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--acento)}
.bots-eval{display:flex;gap:10px;margin-top:16px}
/* 4.63: revisión de la flor */
body.v-evaluar header.cab{display:none}
.ev-top{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;margin-top:10px}
.ev-volver{width:44px;height:44px;border:0;border-radius:50%;background:none;color:var(--tinta);display:grid;place-items:center;cursor:pointer;padding:0}
.ev-volver:hover{background:rgba(var(--bl),.08)}
.ev-area{margin:0;text-align:center;font-size:28px;font-weight:800;color:color-mix(in srgb,var(--c) 70%,var(--tinta))}
.ev-n{font-size:12px;font-weight:700;color:var(--suave);text-align:right;white-space:nowrap}
.ev-pant .progreso{margin-top:8px}
.eval .ilus .ilus-preg{position:absolute;left:0;right:0;bottom:0;z-index:1;margin:0;padding:0 20px 14px;font-size:19px;font-weight:800;line-height:1.3;color:var(--tinta);text-align:center;text-shadow:0 0 12px var(--tarjeta),0 0 4px var(--tarjeta)}
.eval .ilus::after{background:linear-gradient(to bottom,transparent 35%,var(--tarjeta) 92%)!important}
.ev-hab{margin-top:14px;text-align:left}
.opcion-caja{border-radius:16px}
.opcion-caja.sel{background:color-mix(in srgb,var(--c) 30%,transparent);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 70%,#fff);padding-bottom:14px}
.opcion-caja.sel .opcion{background:none;box-shadow:none}
.opcion-caja .ev-hab{margin:2px 14px 0}
.opcion-caja .ev-hab .pregunta{font-size:16px}
.ev-hab .pregunta{margin:0 0 8px;text-align:center}
.ev-hab .campo-voz + .campo-voz{margin-top:8px}
.ev-hab .link{display:block;margin:8px auto 0}
.ph-lista{margin:4px 0 0;padding:0;list-style:none}
.ph-lista li{display:flex;align-items:center;gap:6px;font-size:15px;padding:3px 0}
.ph-lista li .brote{width:16px;height:16px;color:var(--c);flex:none}
.ph-lista li.falta{color:var(--suave)}
.ph-ok{color:var(--c);font-weight:900;margin-left:4px}
.leyenda-hab .pt-peq{display:inline-block;width:6px;height:10px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#cbbcf5}
.flor-plan-hab .flor:not(.mini){max-width:440px;width:calc(100% + 24px);margin:6px -12px 4px}
.dh-caja{position:relative;margin-top:16px;padding:18px 16px;border-radius:20px;background:color-mix(in srgb,var(--c) 14%,var(--tarjeta));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 45%,transparent)}
.dh-tipo{display:flex;align-items:center;justify-content:center;gap:6px;margin:0;font-size:13px;font-weight:700;color:var(--suave)}
.dh-tipo .brote{width:16px;height:16px;color:#22a35a}
.dh-t{text-align:center;font-size:24px;font-weight:800;margin:4px 34px 6px;line-height:1.2}
.dh-lapiz{position:absolute;top:10px;right:10px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(var(--bl),.08);color:var(--tinta);display:grid;place-items:center;cursor:pointer}
.dh-ed{display:flex;flex-direction:column;gap:8px;margin:8px 0 4px}
.dh-ed input{font-size:18px;font-weight:700}
.dh-preg{font-size:15px;font-weight:700;margin:16px 0 8px;text-align:center}
.dh-dias{display:flex;justify-content:center;gap:6px}
.dh-dias button{width:40px;height:40px;border-radius:50%;border:0;font:inherit;font-weight:800;font-size:15px;background:rgba(var(--bl),.1);color:var(--tinta);cursor:pointer}
.dh-dias button.sel{background:var(--c);color:#fff}
.dh-horas{display:flex;align-items:center;justify-content:center;gap:10px}
.dh-horas select{font:inherit;font-size:17px;font-weight:700;padding:10px 12px;border-radius:12px;border:1.5px solid var(--linea);background:var(--tarjeta);color:var(--tinta)}
.dh-off{opacity:.35}
.dh-nodef{display:flex;align-items:center;gap:10px;margin:18px auto 0;border:0;background:none;font:inherit;font-weight:700;font-size:15px;color:var(--tinta);cursor:pointer}
.dh-cas{width:24px;height:24px;border-radius:7px;border:2px solid var(--suave);display:grid;place-items:center;font-size:15px;font-weight:900;color:#fff}
.dh-nodef.sel .dh-cas{background:var(--c);border-color:var(--c)}
.dh-finde{display:flex;flex-direction:column;gap:8px}
.dh-finde button{border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;font-size:15px;background:rgba(var(--bl),.08);color:var(--tinta);cursor:pointer}
.dh-finde button.sel{background:var(--c);color:#fff}
.dh-lista{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.dh-lista li{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--c) 14%,transparent)}
.dh-lista li span{display:flex;flex-direction:column}
.dh-lista li small{color:var(--suave);font-weight:600}
.flor .eti-hab{font-size:8.5px;font-weight:700;fill:#fff;paint-order:stroke;stroke:rgba(20,12,40,.5);stroke-width:2.4px;stroke-linejoin:round}
.flor .eti-nom.fuera{font-size:12px;stroke:none;fill:var(--tinta)}
.bots-eval .btn{flex:1}

/* Resultado */
.res-tit{text-align:center;margin-top:18px}
.res-tit h1{font-size:24px;font-weight:800}
.res-tit p{margin:4px 0 0}
.resumen-txt{margin:12px 0 0;text-align:center}
.campo-accion{margin-top:12px}

/* Jardín (historial) */
.evolucion svg{width:100%;height:auto;display:block}
.jardin{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.maceta{background:var(--tarjeta);border:1px solid var(--linea);border-radius:18px;padding:12px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.maceta svg{width:110px;height:110px}
.maceta b{font-size:14px}
.maceta span{font-size:12px;color:var(--suave)}
.volver{margin-top:12px}
.comentario{border-top:1px solid var(--linea);padding:8px 0;font-size:14px}
.comentario:first-of-type{border-top:0}

/* Ajustes */
.ajustes h3{font-size:17px;margin-bottom:6px}
.ajustes p{margin:6px 0 12px}
.ajustes .bots{display:flex;flex-direction:column;gap:8px}
.interruptor{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.interruptor input{width:46px;height:26px;accent-color:var(--acento)}

/* Navegación inferior */
nav.abajo{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(20,15,38,.94);backdrop-filter:blur(10px);border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom)}
nav.abajo .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.abajo button{background:none;border:0;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--oro)}
nav.abajo .nav-ico{width:26px;height:26px;flex:none;opacity:.92;transition:transform .15s,opacity .15s}
nav.abajo button.act .nav-ico{opacity:1;transform:scale(1.12)}
nav.abajo button.act{font-weight:800}
nav.abajo button.act::after{content:'';width:18px;height:3px;border-radius:2px;background:var(--oro);margin-top:1px}
nav.abajo button span{font-size:20px;line-height:1.1;filter:grayscale(1);opacity:.6}
nav.abajo button.act{color:var(--oro)}
nav.abajo button.act span{filter:none;opacity:1}
nav.abajo .nav-flor{width:22px;height:22px;color:var(--suave);opacity:.85}
nav.abajo button.act .nav-flor{color:var(--oro);opacity:1}

/* Sellos de Práctica Integral (Grow Panel\SELLO.md, colores adaptados al tema nocturno) */
.sellos{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:26px 0 6px}
.pi-seal,.gp-seal{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.3px;
  line-height:16px;white-space:nowrap;color:#a99fca;border:1px solid #3d3266;border-radius:999px;padding:6px 12px;text-decoration:none;background:transparent}
.pi-seal::before{content:"";width:7px;height:7px;border-radius:50%;background:#4ADE80}
.gp-seal svg{width:14px;height:14px;flex:none}
.pi-seal:hover{border-color:#4ADE80}
html.en-app nav.abajo{padding-bottom:0}
html.en-app .ag-fab{bottom:80px}
.sellos.sellos-fila{flex-wrap:nowrap;gap:6px;margin-top:22px}
.sellos-fila .pi-seal,.sellos-fila .gp-seal{font-size:11px;padding:5px 9px;gap:6px;letter-spacing:0}
.gp-seal:hover{border-color:#8b5cf6}

/* Portada: la flor se abre */
#splash{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 42%,#3a2470 0,#1b1236 45%,#0d0a1c 100%);transition:opacity .6s ease;overflow:hidden}
#splash.fuera{opacity:0;pointer-events:none}
#splash .logo-s{width:210px;height:210px;overflow:visible}
#splash .logo-s .petalo{animation:abre-s .7s cubic-bezier(.2,.9,.25,1.2) both;transform-origin:0px 0px}
@keyframes abre-s{from{transform:scale(0) rotate(-40deg);opacity:0}}
#splash .logo-s .centro{animation:late .8s ease-out 1.05s both;transform-origin:0px 0px}
#splash .halo{position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(247,195,91,.35),transparent 65%);
  top:50%;left:50%;transform:translate(-50%,-62%) scale(.3);opacity:0;animation:halo 1.6s ease-out 1s forwards}
@keyframes halo{to{transform:translate(-50%,-62%) scale(1);opacity:1}}
#splash h1{font-size:40px;font-weight:800;margin-top:22px;letter-spacing:.5px;animation:sube .8s ease-out 1.2s both}
#splash p{margin:4px 0 0;color:var(--suave);font-weight:600;animation:sube .8s ease-out 1.4s both}
@keyframes sube{from{opacity:0;transform:translateY(12px)}}
#splash .chispa{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--oro);box-shadow:0 0 8px var(--oro);opacity:0;animation:chispa 2.4s ease-out forwards}
@keyframes chispa{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
#splash .tocar{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);white-space:nowrap;
  font-size:16px;color:#fff;font-weight:800;padding:12px 22px;border-radius:999px;background:linear-gradient(135deg,var(--acento),var(--acento2));
  box-shadow:0 6px 24px rgba(226,69,107,.45);opacity:0;pointer-events:none;transition:opacity .4s}
#splash .tocar.ver{opacity:1;animation:latido 1.4s ease-in-out infinite}
.marca-t{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid #fff}
#splash .sellos{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:16px;right:16px;margin:0;animation:sube .8s ease-out 1.6s both}

/* Aviso flotante */
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#1f1b26;color:#fff;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.35);
  padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;z-index:30;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.ver{opacity:1;transform:translate(-50%,0)}
#toast.con-boton{display:flex;align-items:center;gap:14px;white-space:nowrap;padding:8px 8px 8px 16px}
#toast.ver.con-boton{pointer-events:auto}
#toast button{border:0;border-radius:9px;padding:8px 12px;background:#6d28d9;color:#fff;font-weight:800;font-size:15px}

/* v1.06 · Sin bordes (Gustavo): secciones e imágenes a todo lo ancho, como tarjetas sin marco */
.tarjeta{border:0;border-radius:0;box-shadow:none;background:transparent;margin:0 -16px;padding:22px 16px}
.tarjeta + .tarjeta{padding-top:6px}
.accion{border-left:0;background:linear-gradient(100deg,color-mix(in srgb,var(--c) 16%,transparent),transparent 75%)}
.aviso-semana{border:0}
.eval{margin:10px -16px 0}
.eval .ilus{height:min(50vh,420px);background-position:center 25%}
.eval .cuerpo{padding:6px 16px 20px;margin-top:0}
.bienvenida{margin:0 -16px}
.bienvenida .hero{height:min(62vh,460px)}
.bienvenida .hero::after{background:linear-gradient(to bottom,transparent 40%,var(--fondo))}
.cifra,.maceta,.tarea{border:0}
.cifra{background:rgba(var(--bl),.05)}
.maceta{background:rgba(var(--bl),.05);border-radius:18px}
.tarea{background:rgba(var(--bl),.07)}
textarea,input[type=text]{border:0;background:rgba(var(--bl),.08)}
textarea:focus,input[type=text]:focus{outline:2px solid var(--acento);outline-offset:0}
.btn.sec{border:0;background:rgba(var(--bl),.09)}
.btn.peligro{border:0;background:rgba(251,113,133,.12)}
header.cab{border-bottom:0}
nav.abajo{border-top:0}
#grow-panel-boton .gp-boton{border-color:transparent}
.fila{border-top:0;padding:7px 0}
.comentario{border-top:0}
/* Jardín: flores / acciones */
.seg{display:flex;gap:6px;background:rgba(var(--bl),.06);padding:4px;border-radius:14px;margin-top:14px}
.seg button{flex:1;border:0;background:transparent;color:var(--suave);font-weight:800;padding:9px;border-radius:11px}
.seg button.on{background:rgba(var(--bl),.12);color:var(--tinta)}
.semana-acc{margin:0 -16px;padding:16px;background:linear-gradient(100deg,color-mix(in srgb,var(--c) 14%,transparent),transparent 75%)}
.semana-acc + .semana-acc{margin-top:8px}
.sa-cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sa-cab span{font-size:12px;color:var(--suave)}
.sa-area{margin:4px 0 8px;font-weight:700;font-size:14px}
.sa-area .estrella{color:var(--oro)}
.semana-acc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.semana-acc li{display:flex;align-items:center;gap:10px;font-size:15px}
.semana-acc li .caja{width:20px;height:20px;flex:none;border-radius:6px;border:2px solid var(--c);display:grid;place-items:center;color:transparent;font-size:12px}
.semana-acc li.ok .caja{background:var(--c);color:#fff}
.semana-acc li.ok span:last-child{color:var(--suave);text-decoration:line-through;text-decoration-color:var(--c)}
.resumen-acc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
/* Cuenta */
.cuenta{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cuenta img{width:44px;height:44px;border-radius:50%}
.cuenta b{display:block}
.cuenta span{font-size:13px;color:var(--suave)}
.btn.google{background:#fff;color:#1f1f1f}
.nube-ok{color:var(--sube);font-weight:700;font-size:13px}

/* v1.07 · Flor más grande (de borde a borde) y sin copiar texto al mantener pulsado */
.flor:not(.mini){width:calc(100% + 32px);max-width:none;margin:22px -16px 14px}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg{-webkit-user-drag:none}

/* v1.08 · Micrófono para dictar */
.campo-voz{position:relative;margin-top:8px}
.campo-voz input{margin-top:0;padding-right:52px}
.campo-voz textarea{padding-right:52px}
.mic{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(var(--bl),.12);color:var(--tinta);display:grid;place-items:center;padding:0}
.campo-voz.area .mic{top:14px;transform:none}
.mic.escuchando{background:var(--acento2);color:#fff;animation:latido 1s ease-in-out infinite}
@keyframes latido{50%{box-shadow:0 0 0 8px rgba(226,69,107,.25)}}

/* v1.09 · Hoja del pétalo */
.hoja{position:fixed;inset:0;z-index:25;background:rgba(8,5,20,0);transition:background .3s;display:flex;align-items:flex-end;justify-content:center}
.hoja.ver{background:rgba(8,5,20,.55)}
.hoja-in{width:100%;max-width:520px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,var(--tarjeta)),var(--tarjeta) 55%);
  border-radius:24px 24px 0 0;padding:16px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s ease;max-height:82vh;overflow:auto}
.hoja.ver .hoja-in{transform:none}
.ev-hecha-b{display:none;color:#15803d}
@media (min-width:900px){ .ev-hecha-b{display:block} }
.hoja-in:has(.ev-hoja){max-height:95vh;max-height:95dvh}
@media (min-width:900px){
  .hoja-in:has(.ev-hoja){max-width:min(1040px,calc(100vw - 48px));max-height:calc(100vh - 12px);max-height:calc(100dvh - 12px);padding:20px 26px 22px}
  /* todo lo alta que cabe (Gustavo): los botones Guardar / Cancelar quedan abajo del todo */
  .hoja-in:has(.ev-hoja){min-height:calc(100vh - 12px);min-height:calc(100dvh - 12px);display:flex;flex-direction:column}
  .ev-hoja{flex:1;display:flex;flex-direction:column}
  .ev-col .ed-bots{padding-top:4px}
  .hoja-in:has(.ev-hoja) .hoja-x{position:absolute;top:14px;right:16px;margin:0;float:none}
  .hoja-in:has(.ev-hoja) .rt-barra{display:flex}
  .hoja-in:has(.ev-hoja) .rt-ed{min-height:130px;max-height:48vh}   /* 4.93: la mitad de alta; crece al escribir */
  .hoja-in:has(.ev-hoja) .ev-hoja.desc-larga .rt-ed{max-height:62vh}
  .hoja-in:has(.ev-hoja) .rt-barra{padding-right:44px}
  .hoja-in:has(.ev-hoja) .ev-desc-c{background:rgba(var(--bl),.04)}
  .ev-hecho-fila{display:none}
  .ed-bots:has(.ev-hecha-b) .ev-cancelar{display:none}
  .ev-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 28px;align-items:start}
  .ev-cols .ev-col:last-child > .desps:first-child{margin-top:0}
  .ev-cols .ev-col:last-child{padding-top:48px}   /* sitio para la cruz de arriba a la derecha (4.27) */
}
.hoja-x{position:sticky;top:0;float:right;z-index:2;width:38px;height:38px;display:grid;place-items:center;padding:0;margin:0 -6px 0 8px;border:0;border-radius:50%;background:rgba(var(--bl),.14);color:#fff}
.hoja-x:active{background:rgba(var(--bl),.26)}
.hoja-cab{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hoja-cab > div{display:flex;align-items:center;gap:10px}
.hoja-cab h2{font-size:22px;font-weight:800}
.hoja-nota{font-size:34px;font-weight:800;color:color-mix(in srgb,var(--c) 60%,#fff)}
.hoja-nota .delta{font-size:13px;vertical-align:middle}

/* v1.10 · Cuenta con email y PIN */
.formulario{display:flex;flex-direction:column;gap:10px;margin-top:4px}
input[type=password]{width:100%;font:inherit;border:0;border-radius:12px;padding:11px 12px;background:rgba(var(--bl),.08);color:var(--tinta)}
input[type=password]:focus{outline:2px solid var(--acento)}
.formulario .link{align-self:center}
input.pin{letter-spacing:.5em;font-size:20px;text-align:center}
input.pin::placeholder{letter-spacing:normal;font-size:15px}
.separador{display:flex;align-items:center;gap:10px;color:var(--suave);font-size:13px;margin:18px 0 12px}
.separador::before,.separador::after{content:"";flex:1;height:1px;background:rgba(var(--bl),.12)}

/* v1.11 · Deslizar entre pantallas */
#app.desde-der{animation:desdeDer .32s ease-out}
#app.desde-izq{animation:desdeIzq .32s ease-out}
@keyframes desdeDer{from{opacity:.3;transform:translateX(40px)}}
@keyframes desdeIzq{from{opacity:.3;transform:translateX(-40px)}}
#app{touch-action:pan-y;overflow-x:clip}

/* v2.00 · Amable Life = tus próximas acciones */
.hist-exp{margin:12px 0 10px;font-size:15px;line-height:1.4}
.saludo{margin:18px 0 0;font-size:17px;font-weight:700;color:var(--oro)}
.tit-acc{font-size:30px;font-weight:800;margin-top:22px;line-height:1.1}
.tit-bloques{text-align:center;font-size:30px;margin-bottom:0;line-height:1.15}
.sub-bloques{text-align:center;font-size:15px;font-weight:600;opacity:.75;margin:4px 0 6px}
.flor-ayuda{text-align:center;margin:2px 0 0}
.medalla-msg{text-align:center;font-weight:800;font-size:15px;line-height:1.35;margin:6px 8px 2px}
.medalla-msg.ok{color:#4ade80}
.medalla-msg.falta{color:#f87171}
html.claro .medalla-msg.ok{color:#15803d}
html.claro .medalla-msg.falta{color:#dc2626}
.flor-frase{text-align:center;margin:6px 8px 4px}
/* 5.52 (Gustavo): la frase de la flor equilibrada, detrás de una «i» al final del mensaje de la medalla */
.mm-i{display:inline-grid;place-items:center;vertical-align:middle;width:26px;height:26px;margin-left:4px;padding:0;border:0;border-radius:50%;background:none;color:var(--suave);cursor:pointer}
.mm-i svg{width:18px;height:18px}
.mm-i[aria-expanded="true"]{color:var(--oro)}
.flor-pie{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin:14px 0 4px}
.flor-pie .pausa-fila{margin:0}
.est-hist{display:flex;justify-content:center;margin:18px 0 6px}
.btn-hist{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;font-size:15px;font-weight:700;background:transparent;color:var(--tinta);border:1.5px solid rgba(var(--bl),.3);cursor:pointer}
.btn-hist:hover{border-color:rgba(var(--bl),.55)}
.btn-definir{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;font-size:17px;line-height:1.25;padding:14px 16px;text-align:center}
.btn-definir .brote{flex:none;color:#fff!important;width:24px;height:24px}
.btn-definir > svg{flex:none;width:24px;height:24px;color:#fff}
.dia-izq .pausa-fila{margin-top:10px}
.pan-vacio{display:none}
.avisos-btn{display:flex;align-items:center;gap:8px;margin-top:4px;padding:6px 0;border:0;background:none;color:var(--suave);font-size:14px;font-weight:800;text-align:left;font-variant-numeric:tabular-nums}
.avisos-btn .on{color:#4ade80}
.av-fila{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn-flot{flex:none;margin-top:4px;padding:7px 14px;border:0;border-radius:999px;background:#f7c35b;color:#1d1636;font-size:13px;font-weight:800}
.btn-flot:active{filter:brightness(.92)}
.btn.sec.btn-bloque{border:2px solid #e0323a}
/* Compromiso (copiado de Amable PC): «Me comprometo a… en menos de N minutos» + firma */
.compro-link{display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:2px 0;border:0;background:none;color:#fcd34d;font:inherit;font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.compro-link svg{width:15px;height:15px}
.prox.foco-1:not(.ok) .compro-link{color:#fff3c4}
.ed-compro{display:flex;margin:14px auto 0;font-size:15px}
.ed-bots{display:flex;gap:8px;margin-top:12px}
.ed-bots .btn{flex:1;min-width:0;padding-left:8px;padding-right:8px}
body.pip .compro-link{display:none}
.btn.sec.btn-compro{margin-top:12px;border:2px solid #f59e0b;color:#fcd34d;display:flex;align-items:center;justify-content:center;gap:8px}
.pact-box{position:relative;clear:both;margin-top:8px;background:#fffbeb;border:3px solid #f59e0b;border-radius:22px;padding:22px 16px;color:#1e293b;text-align:center;font-family:Georgia,'Times New Roman',serif}
.pact-head{font-family:system-ui,sans-serif;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:#b45309;margin-bottom:10px}
.pact-text{font-size:24px;line-height:1.3;font-weight:700;margin:6px 0 16px;overflow-wrap:anywhere}
.pact-text b{color:#b45309}
.pact-mins{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 16px}
.pact-mins button{border:1px solid #d97706;background:#fff;color:#92400e;border-radius:999px;padding:6px 12px;font:700 13px system-ui,sans-serif}
.pact-mins button.sel{background:#f59e0b;color:#1e293b;border-color:#f59e0b}
.pact-name{width:100%;box-sizing:border-box;margin:0 0 12px;padding:10px;border-radius:12px;border:1px solid #d97706;background:#fff;color:#1e293b;font:16px system-ui,sans-serif;text-align:center}
.pact-name.oculto{display:none}
.pact-sign{margin:0 6px 18px}
.pact-line{min-height:44px;border-bottom:2px dotted #92400e;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:flex-start;column-gap:8px;padding-bottom:4px;text-align:left;font-family:'Brush Script MT','Segoe Script',cursive;font-size:24px;color:#166534}
.pact-lbl{font:13px system-ui,sans-serif;color:#92400e}
.pact-sign{position:relative}
.pact-line{padding-right:66px}
.pact-sello{position:absolute;right:-8px;top:-32px;width:70px;height:84px;opacity:0;pointer-events:none}
.pact-sello.fijo{opacity:1;transform:rotate(-8deg)}
.pact-sello.puesto{animation:selloCae .45s cubic-bezier(.2,1.5,.4,1) both}
@keyframes selloCae{from{opacity:0;transform:scale(1.9) rotate(-24deg)}to{opacity:1;transform:scale(1) rotate(-8deg)}}
.pact-aviso{min-height:1em;margin-top:6px;font:800 15px system-ui,sans-serif;color:#b91c1c}
.pact-lapiz{position:absolute;right:8px;bottom:8px;width:38px;height:38px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:rgba(180,83,9,.12);color:#92400e}
.pact-lapiz:active{background:rgba(180,83,9,.25)}
.pact-hold{position:relative;width:100%;overflow:hidden;background:#facc15;color:#1e293b;font:800 17px system-ui,sans-serif;border:0;border-radius:14px;padding:16px;touch-action:none;-webkit-user-select:none;user-select:none}
.pact-fill{position:absolute;top:0;bottom:0;left:0;width:0;background:#f59e0b}
.pact-holdtxt{position:relative}
.pact-box.signed .pact-line{animation:pactTinta .6s ease}
/* 4.57: el contrato firmado, alargado (a la derecha de Focus en el ordenador) */
.pact-vert{margin:14px 0 0;padding:22px 18px 18px}
.pact-vert .pact-text{font-size:21px;margin:4px 0 18px}
.pv-firma{display:flex;flex-direction:column;align-items:center;gap:2px;padding-bottom:8px;border-bottom:2px dotted #92400e}
.pv-nombre{font-family:'Brush Script MT','Segoe Script',cursive;font-size:26px;line-height:1.15;color:#166534;overflow-wrap:anywhere}
.pv-hora{font-family:'Brush Script MT','Segoe Script',cursive;font-size:20px;color:#166534}
.pv-sello{width:78px;height:94px;margin:12px auto 4px;transform:rotate(-8deg)}
.pv-cuenta{margin-top:6px;font:800 17px system-ui,sans-serif}
.pact-vert .pact-cuenta{color:#b45309}
.pv-fin{margin:6px 0 10px;font:800 15px system-ui,sans-serif;color:#b91c1c}
.pact-vert.vencido{border-color:#f87171}
@media (min-width:900px){
  body.v-inicio .envoltura:has(.foco-cols){max-width:900px}
  .foco-cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
  .pact-lado{position:sticky;top:84px}
  .pact-lado .pact-vert{margin-top:62px}
}
@keyframes pactTinta{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.f-pact{margin-top:12px;padding:12px;border-radius:14px;border:1px solid rgba(245,158,11,.6);background:rgba(245,158,11,.08);text-align:center}
.f-pact.vencido{border-color:rgba(248,113,113,.7);background:rgba(248,113,113,.08)}
.f-pact-title{font-weight:800;color:#fcd34d;font-size:15px}
.f-pact.vencido .f-pact-title{color:#fca5a5}
.f-pact-text{color:#e2e8f0;font-size:15px;line-height:1.35;margin:4px 0}
.f-pact-text b{color:#fcd34d}
.f-pact-sign{font-family:'Brush Script MT','Segoe Script',cursive;color:#86efac;font-size:20px}
.pact-cuenta{font-weight:800;color:#fcd34d;font-variant-numeric:tabular-nums}
.f-pact-pie{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}

<script>

/* Las 8 áreas = los 8 pétalos (decididas con Gustavo el 19/10/2026). Orden = sentido de las agujas del reloj desde arriba. */

   dobles:[{id:'gusta', texto:'¿Te gusta tu trabajo?', corto:'Te gusta'},
           {id:'dinero',texto:'¿Te da el dinero que necesitas?', corto:'Dinero'}],

  {id:'crecimiento', corto:'Crecimiento', nombre:'Crecimiento personal', etiqueta:'Crecimiento|personal',    color:'#8b5cf6',
   pregunta:'¿Estás aprendiendo y creciendo como te gustaría?', ejemplos:['leer 10 páginas cada noche', 'ver un curso o charla de 30 minutos', 'escribir 3 cosas que aprendí esta semana']},
  {id:'ocio', corto:'Ocio',        nombre:'Ocio y disfrute', etiqueta:'Ocio y|disfrute',         color:'#e0a810',
   pregunta:'¿Tienes tiempo para disfrutar, jugar y descansar?', ejemplos:['reservar el sábado por la tarde para algo que me guste', 'salir a un sitio nuevo', 'una hora de mi hobby sin pantallas']},
  {id:'proposito', corto:'Propósito',   nombre:'Propósito / Espiritualidad', etiqueta:'Propósito /|Espiritualidad', color:'#14a3a3',
   pregunta:'¿Sientes que tu vida tiene sentido y dirección?', ejemplos:['10 minutos de silencio o meditación cada mañana', 'escribir para qué hago lo que hago', 'ayudar a alguien sin esperar nada']},
  // 5.62 (Gustavo): «Entorno y hogar» pasa a ser «Sociedad» (el id sigue siendo «hogar», así los datos no cambian)
  {id:'hogar', corto:'Sociedad',    nombre:'Sociedad',        etiqueta:'Sociedad',                color:'#b0703c',
   pregunta:'¿Sientes que aportas y participas en la sociedad?', ejemplos:['ayudar a un vecino o a alguien que lo necesite', 'colaborar con una asociación o una causa', 'participar en algo de tu barrio o tu comunidad']},
];

const $ = s => document.querySelector(s);
const app = $('#app');

/* ---------- Datos (v2: acciones + niveles por área) ----------
   D = {v:2, niveles:{area:'bien'|'una'|'mas'}, detalle:{trabajo:{gusta,dinero}}, comentarios:{}, nivelesMod,
        revisiones:[{id, fecha, niveles, detalle, comentarios}], acciones:[{id, area, texto, hecha, creada, hechaEn, mod}], borradas:[] } */
const NIVELES = {
  bien: {marca:'2+', titulo:'Practico más de una', sub:'Más de una práctica integral a la semana', n:0, peso:0},
  una:  {marca:'1',  titulo:'Tengo una',           sub:'Una práctica integral a la semana',        n:1, peso:1},
  mas:  {marca:'0',  titulo:'Ninguna',             sub:'Necesito alguna práctica integral',  n:2, peso:2},
};
/* Salud (venido de Amable PC): agua, movimiento y pasos */
const SALUD_DEF = {aguaOn:true, aguaMin:45, aguaGoal:8, movOn:true, movMin:60, aguaNext:0, movNext:0, days:{},
  meta:8000, pasosOn:true, voz:true, cada:500, bloqueOn:true, bloque:2000, caminarOn:true, caminarHecho:null, pasos:{}, mod:null};
const nuevaSalud = (x = {}) => Object.assign({}, SALUD_DEF, {days:{}, pasos:{}}, x);
/* Bloques de tiempo (venidos de Amable PC): días → bloque → hasta 3 actividades {t, d, acc} */
const BLOQUES_DEF = {days:{}, startVoice:true, remindOn:true, remindMin:5, sleepOn:true, sleepDone:'', ultimo:null, mod:null};
const nuevosBloques = (x = {}) => Object.assign({}, BLOQUES_DEF, {days:{}}, x);
const vacio = () => ({v:2, niveles:{}, detalle:{}, comentarios:{}, nivelesMod:null, revisiones:[], acciones:[], borradas:[], salud: nuevaSalud(), bloques: nuevosBloques(), agenda: {eventos: []}});
const nivelDeNota = n => n <= 4 ? 'mas' : n <= 7 ? 'una' : 'bien';
/* Pasa los datos de v1 (notas del 1 al 10 y acciones por semana) al formato nuevo */
function migrar(d){
  const v = vacio(); v.borradas = d.borradas || [];
  (d.evaluaciones || []).forEach(e => {
    const niveles = {}; Object.keys(e.notas || {}).forEach(k => niveles[k] = nivelDeNota(e.notas[k]));
    v.revisiones.push({id: e.id, fecha: e.fecha, niveles, detalle: {}, comentarios: e.comentarios || {}});
    const ts = e.accion ? (Array.isArray(e.accion.tareas) ? e.accion.tareas : e.accion.texto ? [{texto: e.accion.texto, hecha: !!e.accion.hecha}] : []) : [];
    ts.forEach((t,k) => v.acciones.push({id: e.id + '-' + k, area: e.accion.area, texto: t.texto, hecha: !!t.hecha,
      creada: e.accion.fecha || e.fecha, hechaEn: t.hecha ? (e.mod || e.accion.fecha || e.fecha) : null, mod: e.mod || e.fecha}));
  });
  const ult = v.revisiones[v.revisiones.length-1];
  if(ult){ v.niveles = {...ult.niveles}; v.comentarios = {...ult.comentarios}; v.nivelesMod = ult.fecha; }
  return v;
}
function normalizar(d){
  if(!d) return vacio();
  const r = d.v !== 2 ? migrar(d) : Object.assign(vacio(), d);
  r.salud = nuevaSalud(r.salud || {});
  r.bloques = nuevosBloques(r.bloques || {});
  r.agenda = {eventos: Array.isArray((r.agenda || {}).eventos) ? r.agenda.eventos : []};
  return r;
}
function cargar(){
  try{ const d = JSON.parse(localStorage.getItem(CLAVE)); if(d) return normalizar(d); }catch(e){}
  return vacio();
}
function guardar(){
  try{ localStorage.setItem(CLAVE, JSON.stringify(D)); }catch(e){ aviso('No se pudo guardar en este navegador'); }
  enviarResumen();
  programarSubida();
  enviarRecordatorios();
}
const ahoraISO = () => new Date().toISOString();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const areaDe = id => AREAS.find(a => a.id === id);
/* Tareas sin área (p. ej. las de TickTick cuya lista no se llama como un área): se ven en gris como «Sin área» */
const SIN_AREA = {id: 'sin', nombre: 'Sin área', corto: 'Sin área', color: '#94a3b8'};
const areaO = id => areaDe(id) || SIN_AREA;
const nivel = id => D.niveles[id] || null;
const tieneDatos = () => D.revisiones.length > 0 || D.acciones.length > 0;
const ultimaRevision = () => D.revisiones[D.revisiones.length-1] || null;
const pesoArea = id => nivel(id) ? NIVELES[nivel(id)].peso : 0;
/* Pendientes en el orden que elige la persona (seis puntitos). Las nuevas van al final:
   las de las áreas tienen toda la semana, así que no pasan delante solas. */
function pendientes(){
  const p = D.acciones.filter(a => !a.hecha);

/* ---------- Reloj de arena: dura la hora y media del bloque; la arena cae grano a grano ---------- */
/* El cristal se estrecha hacia el cuello: para que la arena guarde la proporción del tiempo se calcula por área, no por altura */
let arenaTabla = null;
function tablaArena(cx, top, neck, half, nw){
  if(arenaTabla) return arenaTabla;
  const pts = [];
  for(let k = 0; k <= 80; k++){ const t = k / 80, u = 1 - t;
    const x = u*u*u*(cx + half) + 3*u*u*t*(cx + half) + 3*u*t*t*(cx + nw + 3) + t*t*t*(cx + nw);
    const y = u*u*u*top + 3*u*u*t*(top + 24) + 3*u*t*t*(neck - 11) + t*t*t*neck;
    pts.push({d: neck - y, a: x - cx}); }   // d: distancia al cuello · a: medio ancho del cristal
  pts.sort((m, n) => m.d - n.d);
  const acc = [{d: pts[0].d, s: 0}];   // área desde el cuello hacia fuera (la mitad de abajo es igual)
  for(let k = 1; k < pts.length; k++) acc.push({d: pts[k].d, s: acc[k - 1].s + (pts[k].a + pts[k - 1].a) * (pts[k].d - pts[k - 1].d)});
  return arenaTabla = acc;
}
const interpArena = (tab, de, a, v) => { for(let k = 1; k < tab.length; k++) if(tab[k][de] >= v){ const f = (v - tab[k - 1][de]) / ((tab[k][de] - tab[k - 1][de]) || 1); return tab[k - 1][a] + f * (tab[k][a] - tab[k - 1][a]); } return tab[tab.length - 1][a]; };

function iniciarArena(){ if(!arenaRAF) arenaRAF = requestAnimationFrame(animarArena); }
function animarArena(ts){

  if(!cv || document.hidden){ arenaRAF = null; return; }
  const dt = Math.min(50, ts - (arenaUlt || ts)) / 16.7; arenaUlt = ts;
  dibujarArena(cv, dt || 1);

}

function dibujarArena(cv, dt){
  const dpr = window.devicePixelRatio || 1, W = 66, H = 104;
  if(cv.width !== Math.round(W * dpr)){ cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + 'px'; cv.style.height = H + 'px'; }

  const cx = W / 2, top = 10, neck = H / 2, bot = H - 10, half = 25, nw = 2.4;
  const vidrio = () => {
    g.beginPath(); g.moveTo(cx - half, top); g.lineTo(cx + half, top);
    g.bezierCurveTo(cx + half, top + 24, cx + nw + 3, neck - 11, cx + nw, neck);
    g.bezierCurveTo(cx + nw + 3, neck + 11, cx + half, bot - 24, cx + half, bot);
    g.lineTo(cx - half, bot);
    g.bezierCurveTo(cx - half, bot - 24, cx - nw - 3, neck + 11, cx - nw, neck);
    g.bezierCurveTo(cx - nw - 3, neck - 11, cx - half, top + 24, cx - half, top); g.closePath();
  };
  vidrio(); g.fillStyle = 'rgba(160,98,42,.07)'; g.fill();
  g.save(); vidrio(); g.clip();
  // la arena de arriba, verde; desde que cae por el cuello, roja
  const verde = g.createLinearGradient(0, top, 0, neck); verde.addColorStop(0, '#6ee7a0'); verde.addColorStop(1, '#22a35a');
  const rojo = g.createLinearGradient(0, neck, 0, bot); rojo.addColorStop(0, '#f87171'); rojo.addColorStop(1, '#c81e2e');
  g.fillStyle = verde;
  // arriba baja y abajo sube al mismo ritmo, para que se vea bien cómo pasa el tiempo
  const tab = tablaArena(cx, top, neck, half, nw), areaD = d => interpArena(tab, 'd', 's', d), distA = a => interpArena(tab, 's', 'd', a);
  // abajo solo cuenta lo que se ve por encima de la tapa; arriba se suma lo que quita el hoyito del centro
  const pp = Math.min(1, Math.max(0, p)), total = areaD(bot - neck - 2), K = Math.min(areaD(neck - top - 7), total - areaD(9));
  const y0 = neck - distA((1 - pp) * K), hueco = p > 0 && p < 1 ? Math.min(4, (neck - y0) * .3) : 0;

  // abajo: el montón crece con p
  const yB = neck + distA(total - pp * K * .92), m = Math.min(4, (bot - yB) * .35), cima = yB - m;

    g.fillStyle = '#f87171';
    granos = granos.filter(q => { q.vy += .14 * dt; q.y += q.vy * dt; q.x += q.vx * dt; if(q.y >= suelo + Math.abs(q.x - cx) * .4) return false; g.fillRect(q.x - .6, q.y - .6, 1.3, 1.3); return true; }).slice(-160);
    // algún grano rebota al llegar al montón
    if(Math.random() < .25){ g.fillStyle = 'rgba(248,113,113,.8)'; g.fillRect(cx + (Math.random() - .5) * 10, suelo - Math.random() * 3, 1.2, 1.2); }

  g.strokeStyle = 'rgba(255,255,255,.22)'; g.lineWidth = 2; g.beginPath(); g.moveTo(cx - half + 6, top + 6); g.quadraticCurveTo(cx - half + 4, top + 22, cx - 7, neck - 9); g.stroke();

  const tapa = y => { g.fillStyle = '#b8661a'; g.beginPath(); if(g.roundRect) g.roundRect(cx - half - 5, y - 3.5, (half + 5) * 2, 7, 3.5); else g.rect(cx - half - 5, y - 3.5, (half + 5) * 2, 7); g.fill();

}

let arrastre = null, finArrastre = 0;
document.addEventListener('pointerdown', e => {

/* 4.73 (Gustavo): lápiz arriba a la derecha para corregir el nombre del hábito (también en tu flor y en su tarea, si la tiene) */
function dhEditar(){ DH.items[DH.i].editando = true; dhPinta(); const el = $('#dh-t'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }

function dhGuardar(){
  const A = AG_(), ahora = ahoraISO(); let n = 0;

  A.eventos.forEach(e => { if(e.tipo === 'habito' && e.sinDefinir && !mias.has(e.habRev) && (e.dias || []).length === 1 && usadas[e.dias[0]]) usadas[e.dias[0]].add(e.ini); });
  DH.items.forEach(x => { if(!x.nodef) return; let h = 600; while(usadas[x.finde].has(h) && h < 1290) h += 30; usadas[x.finde].add(h); x.hIni = h; });   // 4.94: cada media hora

  DH.items.forEach(x => { const e = A.eventos.find(z => z.tipo === 'habito' && z.habRev === claveHab(x.area, x.t)); if(e){ x.ini = e.ini; x.fin = e.fin; if(x.nodef){ x.hIni = e.ini; } } });

/* 4.94 (Gustavo): los hábitos de «Revisar mi flor» que caen a la vez el mismo día no se pisan: van seguidos, cada media hora
   (10:00–10:30, 10:30–11:00, 11:00–11:30…). El primero se queda donde está; los que chocan pasan al siguiente hueco libre de 30 min. */
function ordenarHabitos(){
  const hs = AG_().eventos.filter(e => e.tipo === 'habito' && (e.habRev || e.metaId) && !e.todo && e.ini != null && e.fin != null)
    .sort((a, b) => (a.ini - b.ini) || String(a.creada || '').localeCompare(String(b.creada || '')) || String(a.id).localeCompare(String(b.id)));
  const puestos = []; let n = 0;
  hs.forEach(e => {
    const dias = e.dias || [], choca = (i, f) => puestos.some(p => (p.dias || []).some(d => dias.includes(d)) && i < p.fin && p.ini < f);
    if(choca(e.ini, e.fin)){
      let h = Math.ceil(e.ini / 30) * 30; while(choca(h, h + 30) && h < 1410) h += 30;
      const dif = h - e.ini; e.ini = h; e.fin = h + 30;
      if(Array.isArray(e.horasAviso) && e.horasAviso.length) e.horasAviso = e.horasAviso.map(x => x + dif);
      e.mod = ahoraISO(); n++;

    puestos.push(e);
  });
  return n;
}

const Reconocer = window.SpeechRecognition || window.webkitSpeechRecognition;
const MIC = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const esApp = !!window.AndroidEquilibra;   // dentro de la app Android
function botonMic(){ return (Reconocer || esApp) ? `<button class="mic" type="button" aria-label="Dictar con la voz" onclick="dictar(this)">${MIC}</button>` : ''; }
let reconocimiento = null;
let campoDictado = null;
/* En la app Android el dictado lo hace el teléfono y vuelve por aquí */
window.nativeDictation = (texto, error) => {
  document.querySelectorAll('.mic.escuchando').forEach(b => b.classList.remove('escuchando'));
  if(error){ aviso(error); return; }
  if(!campoDictado || !texto) return;
  let v = ((campoDictado.value.trim() ? campoDictado.value.trim() + ' ' : '') + texto).trim();
  campoDictado.value = (v.charAt(0).toUpperCase() + v.slice(1)).slice(0, campoDictado.maxLength > 0 ? campoDictado.maxLength : 500);
  campoDictado.dispatchEvent(new Event('input'));
};
/* 4.93 (Gustavo): dictar también la descripción (es un recuadro con formato, no un campo de texto) */
function dictarDesc(btn){
  const ed = $('#ev-desc'); if(!ed) return;
  const poner = t => { t = (t || '').trim(); if(!t) return; const vacio = !ed.innerText.trim(); if(vacio) t = t.charAt(0).toUpperCase() + t.slice(1);
    ed.insertAdjacentHTML('beforeend', (vacio ? '' : ' ') + esc(t)); rtVacio(ed); descLarga(); };
  if(esApp){ campoDictado = {get value(){ return ''; }, set value(v){ poner(v); }, maxLength: 4000, dispatchEvent(){}}; btn.classList.add('escuchando'); AndroidEquilibra.dictar(); return; }
  if(reconocimiento){ reconocimiento.stop(); return; }
  const base = ed.innerHTML, r = new Reconocer();
  r.lang = 'es-ES'; r.interimResults = true; r.continuous = false;
  r.onresult = e => { let t = ''; for(const x of e.results) t += x[0].transcript; ed.innerHTML = base; poner(t); };
  r.onerror = e => { if(e.error === 'not-allowed' || e.error === 'service-not-allowed') aviso('Permite el micrófono para dictar'); else if(e.error !== 'no-speech' && e.error !== 'aborted') aviso('No se pudo dictar (' + e.error + ')'); };
  r.onend = () => { btn.classList.remove('escuchando'); reconocimiento = null; };
  btn.classList.add('escuchando'); reconocimiento = r;
  try{ r.start(); }catch(e){ btn.classList.remove('escuchando'); reconocimiento = null; }
}
/* 4.93 (Gustavo): en el ordenador, si la descripción se alarga mucho, el día y la hora pasan arriba de la columna derecha (y vuelven si se acorta) */
function descLarga(){
  colocarHab(); if(evEd && evEd.tipo === 'habito') return;
  const ed = $('#ev-desc'), w = $('#ev-fecha-w'), der = $('#ev-col-der'), hoja = $('.ev-hoja'); if(!ed || !w || !der || !hoja) return;
  const ancho = matchMedia('(min-width:900px)').matches, larga = hoja.classList.contains('desc-larga');
  const alto = ed.scrollHeight, pasa = ancho && (larga ? alto > 170 : alto > 200);
  if(pasa === larga && (pasa ? w.parentNode === der : w.parentNode !== der)) return;
  hoja.classList.toggle('desc-larga', pasa);
  if(pasa) der.insertBefore(w, der.firstChild);
  else { const ref = $('#ev-hab'); ref.parentNode.insertBefore(w, ref.nextSibling); }
}
function dictar(btn){
  if(esApp){ campoDictado = btn.previousElementSibling; btn.classList.add('escuchando'); AndroidEquilibra.dictar(); return; }
  if(reconocimiento){ reconocimiento.stop(); return; }
  const campo = btn.previousElementSibling;
  const base = campo.value.trim() ? campo.value.trim() + ' ' : '';
  const r = new Reconocer();
  r.lang = 'es-ES'; r.interimResults = true; r.continuous = false;
  r.onresult = e => {
    let t = ''; for(const x of e.results) t += x[0].transcript;

  };
  r.onerror = e => { if(e.error === 'not-allowed' || e.error === 'service-not-allowed') aviso('Permite el micrófono para dictar'); else if(e.error !== 'no-speech' && e.error !== 'aborted') aviso('No se pudo dictar (' + e.error + ')'); };
  r.onend = () => { btn.classList.remove('escuchando'); reconocimiento = null; };

}

}

const CAMINAR = [[660, 2000], [780, 4000], [960, 6000], [1080, 8000]];
function caminarTick(){
  const S = S_(); if(!S.pasosOn || !S.caminarOn || !esApp) return;
  const k = claveDia(new Date()), m = minutosHoy();
  if(!S.caminarHecho || S.caminarHecho.k !== k) S.caminarHecho = {k, n: 0};
  let idx = -1; CAMINAR.forEach(([t], i) => { if(m >= t) idx = i; });
  if(idx < 0 || idx + 1 <= S.caminarHecho.n) return;
  S.caminarHecho.n = idx + 1; guardarSalud(false);
  const [t, meta] = CAMINAR[idx], pasos = pasosHoy().steps;
  if(m - t > 60 || pasos >= meta) return;
  hablar(`Son las ${Math.floor(t/60)} y llevas ${fmtN(pasos)} pasos. Te faltan ${fmtN(meta - pasos)} para los ${fmtN(meta)}. Es buen momento para caminar.`, 'salud');

function saludTick(){

  if(!S.aguaNext || ahora - S.aguaNext > 30*60000) S.aguaNext = ahora + S.aguaMin * 60000;
  if(!S.movNext || ahora - S.movNext > 30*60000) S.movNext = ahora + S.movMin * 60000;
  caminarTick();
  if(!avisoSalud && !$('#hoja') && vista !== 'evaluar' && enHorario() && !$('#splash')){
    if(pausa.salud){}
    else if(S.aguaOn && ahora >= S.aguaNext) lanzarAviso('agua');

}

/* Une lo de este dispositivo con lo de la nube: por id, gana lo cambiado más tarde */
function fusionar(local, remoto){
  if(!remoto) return local;

  const borradas = [...new Set([...(local.borradas || []), ...(remoto.borradas || [])])];
  const unir = (a, b, clave) => {
    const m = {};
    [...b, ...a].forEach(x => { if(borradas.includes(x.id)) return; const y = m[x.id]; if(!y || (x[clave] || '') > (y[clave] || '')) m[x.id] = x; });
    return Object.values(m);
  };
  const r = vacio();
  r.borradas = borradas;
  r.acciones = unir(local.acciones, remoto.acciones, 'mod').sort((x,y) => x.creada < y.creada ? -1 : 1);
  r.revisiones = unir(local.revisiones, remoto.revisiones, 'fecha').sort((x,y) => x.fecha < y.fecha ? -1 : 1);
  const gana = (remoto.nivelesMod || '') > (local.nivelesMod || '') ? remoto : local;
  r.niveles = {...gana.niveles}; r.detalle = gana.detalle || {}; r.comentarios = gana.comentarios || {}; r.nivelesMod = gana.nivelesMod;
  if(gana.habitosArea || local.habitosArea || remoto.habitosArea) r.habitosArea = gana.habitosArea || local.habitosArea || remoto.habitosArea;

/* Tiempo real (Gustavo, 3.82: «añadí una tarea en el móvil y no la veo en el ordenador»): se escucha el documento de la nube;

function escucharNube(){

    if(doc.metadata.hasPendingWrites || !doc.exists) return;   // es lo que acabo de subir yo
    const r = doc.data(); notaRemota(r); if(!r || r.actualizado === nube.subido) return;
    const antes = JSON.stringify(D);

    if(JSON.stringify(D) === antes) return;
    try{ localStorage.setItem(CLAVE, JSON.stringify(D)); }catch(e){}
    nube.ok = Date.now(); nube.leido = Date.now();
    pintarDesdeNube();
  }, e => {   // la escucha se corta (red, permisos…): se vuelve a enganchar a los 10 s
    console.warn('nube en tiempo real', e);

}

function calICS(){
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Practica Integral//Amable Life//ES', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Amable Life'];

function calCSV(){

  AG_().eventos.filter(e => !repite(e)).sort((a, b) => (a.dia + (a.ini || 0)).localeCompare(b.dia + (b.ini || 0))).forEach(e => F.push(fila(e, e.dia)));

  for(let n = 0; n <= 395; n++){ const k = sumarDias(desde, n); eventosDe(k).filter(repite).forEach(e => F.push(fila(e, k))); }

}

  box.innerHTML = `<div class="cal-res"><p>En «${esc(nombre)}» hay <b>${lista.length}</b> ${lista.length === 1 ? 'cosa' : 'cosas'}: <b>${rec}</b> desde hace un mes (o que se repiten) y ${lista.length - rec} más antiguas.${ya ? ` ${ya} ya estaban aquí: se ponen al día.` : ''}</p>
    ${simples ? `<p class="peq suave">${simples} se repetían de una forma que aquí no hay (cada 2 semanas, o ya terminada): entran solo en su primer día.</p>` : ''}
    <div class="bots">${rec ? `<button class="btn prim" onclick="calMeter(false)">Importar desde hace un mes (${rec})</button>` : ''}<button class="btn sec" onclick="calMeter(true)">Importar todo (${lista.length})</button></div></div>`;
}
function calMeter(todo){
  const desde = sumarDias(hoyK(), -30), A = AG_();
  let lista = calImp.filter(x => todo || x.rep !== 'no' || x.dia >= desde), n = 0;
  if(lista.length > 3000){ lista = lista.sort((a, b) => b.dia.localeCompare(a.dia)).slice(0, 3000); aviso('Son muchas: entran las 3000 más recientes', 3500); }
  lista.forEach(x => {
    let e = A.eventos.find(z => z.impId === x.uid);
    if(!e){ e = {id: uid(), creada: ahoraISO(), hechos: [], impId: x.uid, area: null, areas: []}; A.eventos.push(e); }
    Object.assign(e, {t: x.t, tipo: x.tipo || 'tarea', dia: x.dia, dias: x.dias || [], rep: x.rep, frec: x.frec || (x.tipo === 'habito' ? 'diario' : null), veces: x.veces || 3, cada: x.cada || 2, todo: x.todo, ini: x.ini, fin: x.fin, saltar: x.saltar || [], desc: x.desc || '', descH: '', avisos: x.avisos || [], prio: x.prio || 1, mod: ahoraISO()});
    n++;
  });
  guardar(); calImp = [];
  const box = $('#cal-imp-res'); if(box) box.innerHTML = `<p class="cal-ok">✓ ${n} ${n === 1 ? 'cosa importada' : 'cosas importadas'} en tu calendario.</p>`;
  sonarHecho(); aviso(n === 1 ? '1 cosa en tu calendario' : `${n} cosas en tu calendario`);
}
function exportar(){
  const blob = new Blob([JSON.stringify(D, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `equilibra-copia-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importar(inp){
  const f = inp.files && inp.files[0]; if(!f) return;
  const lector = new FileReader();
  lector.onload = () => {
    try{
      const d = JSON.parse(lector.result);
      if(!d || !(Array.isArray(d.evaluaciones) || d.v === 2)) throw 0;
      const nd = normalizar(d);
      if(!confirm(`La copia tiene ${nd.acciones.length} acciones y ${nd.revisiones.length} revisiones. ¿Reemplazar tus datos actuales por la copia?`)) return;
      nd.borradas = [...new Set([...(D.borradas || []), ...(nd.borradas || [])])];
      D = nd;
      guardar(); aviso('Copia recuperada ✓'); ir('inicio');
    }catch(e){ aviso('Ese archivo no es una copia de Amable Life'); }
  };
  lector.readAsText(f);
  inp.value = '';
}
function borrarTodo(){
  if(!confirm('¿Borrar todas tus acciones y tu flor? No se puede deshacer.')) return;
  if(!confirm('¿Seguro? Se borrará todo Amable Life' + (nube.usuario ? ', también en la nube.' : ' en este dispositivo.'))) return;
  const ids = [...D.acciones.map(a => a.id), ...D.revisiones.map(r => r.id)];
  D = vacio(); D.borradas = ids; guardar(); aviso('Datos borrados'); ir('inicio');
}

/* ---------- Deslizar el dedo: pétalo siguiente/anterior, o pestaña siguiente/anterior ---------- */
const PESTANAS = ['agenda', 'dia', 'inicio', 'salud', 'ajustes'];   // Historial ya no está abajo (Gustavo): se abre desde Áreas
let toque = null;
app.addEventListener('touchstart', e => {
  const t = e.target;
  if(e.touches.length !== 1 || t.closest('input, textarea, button.mic, .hoja, .asa')) { toque = null; return; }
  toque = {x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now(), flor: !!t.closest('.girasol')};
}, {passive: true});
app.addEventListener('touchend', e => {
  if(!toque) return;
  const dx = e.changedTouches[0].clientX - toque.x, dy = e.changedTouches[0].clientY - toque.y, dt = Date.now() - toque.t;
  const enFlor = toque.flor; toque = null;
  if(arrastre || Date.now() - finArrastre < 400) return;
  if(enFlor) return;
  if(Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.6 || dt > 800) return;
  deslizar(dx < 0 ? 1 : -1);
}, {passive: true});
/* ↻ Deslizar hacia abajo desde arriba del todo: recarga la app y se pone al día (como en las otras apps Amable) */
const pullR = document.createElement('div'); pullR.id = 'pullR'; pullR.textContent = '↻'; pullR.setAttribute('aria-hidden', 'true'); document.body.append(pullR);
let pr0 = null;
const pullPon = k => { pullR.style.opacity = k; pullR.style.transform = `translateY(${k * 96}px) rotate(${k * 300}deg)`; pullR.classList.toggle('listo', k >= 1); };
document.addEventListener('touchstart', e => {
  pr0 = null;
  if(e.touches.length !== 1 || window.scrollY > 0 || arrastre) return;
  if(e.target.closest('input, textarea, .asa, .hoja, #hoja, #splash')) return;
  pr0 = {x: e.touches[0].clientX, y: e.touches[0].clientY};
}, {passive: true});
document.addEventListener('touchmove', e => {
  if(!pr0) return;
  const dy = e.touches[0].clientY - pr0.y, dx = e.touches[0].clientX - pr0.x;
  if(e.touches.length !== 1 || window.scrollY > 0 || dy < 0 || Math.abs(dx) > dy){ pullPon(0); if(dy < -10 || Math.abs(dx) > 40) pr0 = null; return; }
  pullPon(Math.min(1, dy / 120));
}, {passive: true});
document.addEventListener('touchend', () => {
  if(!pr0) return; pr0 = null;
  if(pullR.classList.contains('listo')){ pullR.textContent = '⏳'; aviso('↻ Actualizando…'); recargando = true; setTimeout(() => location.reload(), 250); }
  else pullPon(0);
});
function deslizar(dir){
  if(vista === 'agenda'){ agMover(dir); return; }   // en el calendario, deslizar pasa de día, semana o mes
  if(vista === 'evaluar' && E){
    if(dir > 0){ if(E.i === AREAS.length-1) return; siguiente(); }   // el último pétalo se guarda con su botón (mismo número de pétalos)
    else { if(E.i === 0) return; atras(); }
    animarEntrada(dir);
    return;
  }
  // 4.46 (Gustavo): deslizar de izquierda a derecha vuelve a la pantalla anterior; al revés, nada
  if(dir > 0) return;
  volver();
  animarEntrada(dir);
}
function animarEntrada(dir){
  app.classList.remove('desde-der', 'desde-izq'); void app.offsetWidth;
  app.classList.add(dir > 0 ? 'desde-der' : 'desde-izq');
}

/* Botón «atrás» del móvil en la app Android: cierra la hoja o vuelve a Inicio */
window.atrasNativo = () => {
  if($('#hoja')){ cerrarHoja(); return true; }
  if(vista === 'evaluar' && E){ atras(); return true; }
  if(vistaHist.length || vista !== vistaInicial()){ volver(); return true; }   // 4.47: a la página anterior
  return false;
};

/* ---------- Aviso flotante ---------- */
let tToast;
function aviso(t, ms = 2400){ const el = $('#toast'); accionDeshacer = null; el.textContent = t; el.classList.remove('con-boton'); el.classList.add('ver'); clearTimeout(tToast); tToast = setTimeout(() => el.classList.remove('ver'), ms); }
/* Aviso de 4 segundos con «Deshacer», por si se ha tocado sin querer */
let accionDeshacer = null;
function avisoDeshacer(t, fn, ms = 4000){
  const el = $('#toast'); accionDeshacer = fn;
  el.innerHTML = `<span>${esc(t)}</span><button type="button" onclick="deshacer()">Deshacer</button><button type="button" class="toast-x" aria-label="Cerrar" onclick="cerrarToast()">${ICO_CRUZ}</button>`;
  el.classList.add('ver', 'con-boton'); clearTimeout(tToast);
  tToast = setTimeout(() => { accionDeshacer = null; el.classList.remove('ver'); }, ms);
}
function cerrarToast(){ accionDeshacer = null; clearTimeout(tToast); $('#toast').classList.remove('ver'); }
/* Borrar algo del calendario: todo, o solo un día; con «Deshacer» durante 5 segundos */
function borrarDelCalendario(id, k, todo){
  const A = AG_(), e = A.eventos.find(x => x.id === id); if(!e) return;
  const hab = e.tipo === 'habito', copia = JSON.parse(JSON.stringify(e)), d = fechaDe(k);
  const ap = !hab && !hechoEv(e, k) && apuntarDia('borr', k, e.id, e.t);
  if(todo) Object.values(D.diaLog || {}).forEach(x => { if(['borr', 'hora', 'dia'].some(t => (x[t] || []).includes(e.id))){ x.t = x.t || {}; x.t[e.id] = e.t; } });
  if(todo){ A.eventos = A.eventos.filter(x => x !== e); D.borradas = (D.borradas || []).concat(e.id); }
  else { e.saltar = [...new Set([...(e.saltar || []), k])]; e.mod = ahoraISO(); }
  guardar(); rerenderDia();
  avisoDeshacer(todo ? (hab ? 'Práctica integral eliminada' : e.t === SIN_TITULO ? 'Tarea eliminada' : `«${e.t.length > 28 ? e.t.slice(0, 27) + '…' : e.t}» eliminada`) : `Quitado el ${d.getDate()} de ${MESES[d.getMonth()]}`, () => {
    const B = AG_();
    if(todo){ D.borradas = (D.borradas || []).filter(b => b !== copia.id); if(!B.eventos.some(x => x.id === copia.id)) B.eventos.push(Object.assign(copia, {mod: ahoraISO()})); }
    else { const x = B.eventos.find(z => z.id === id); if(x){ x.saltar = (x.saltar || []).filter(z => z !== k); x.mod = ahoraISO(); } }
    if(ap) quitarApunte('borr', k, id);
    guardar(); rerenderDia(); aviso(hab ? 'Práctica integral recuperada' : 'Tarea recuperada');
  }, 5000);
}
function deshacer(){
  const fn = accionDeshacer; accionDeshacer = null;
  clearTimeout(tToast); $('#toast').classList.remove('ver');
  if(fn) fn();
}

/* ---------- Grow Panel: resumen de la app (Grow Panel\BOTON.md) ---------- */
function enviarResumen(){
  let r;
  if(!tieneDatos()){
    r = {estado:'aviso', mensaje:'Aún no has revisado tu flor', cifras:[], version:VERSION};
  }else{
    const prox = proximas()[0], f = faltan(), ult = ultimaRevision();
    let msg = prox ? `Siguiente: ${prox.texto}` : f.length ? `Añade acciones para ${f[0].area.nombre}` : 'Todo en equilibrio ✓';
    if(msg.length > 90) msg = msg.slice(0, 89) + '…';
    r = {estado: (f.length || (ult && diasDesde(ult.fecha) > 35)) ? 'aviso' : 'ok', mensaje: msg, version: VERSION, cifras:[
      // 4.56 (Gustavo, vía Grow Panel): estas cuatro y en este orden. Pendientes = todas las de tus áreas; realizadas y hábitos = hoy
      {valor: pendientes().length, etiqueta:'tareas pendientes'},
      {valor: resumenDia(hoyK()).tareas_hechas, etiqueta:'tareas realizadas'},
      {valor: habitosHechos(hoyK()), etiqueta:'prácticas integrales realizadas'},
      {valor: areasAccion(), etiqueta:'áreas que piden acción'}]};
  }
  window.growPanelResumen = r;
  try{ if(window.GrowPanel && GrowPanel.resumen) GrowPanel.resumen(r); }catch(e){}
}
addEventListener('growpanel-listo', enviarResumen);

/* ---------- Arranque ---------- */
(function iniciar(){
  const interior = logoInterior();
  ['#logo-splash','#logo-cab'].forEach(s => { const el = $(s); el.setAttribute('viewBox','-100 -100 200 200'); el.innerHTML = interior; });
  $('#favicon').href = 'data:image/svg+xml,' + encodeURIComponent(logoSVG().replace(/ class="[^"]*"| style="[^"]*"/g, ''));
  ponerVersiones();
  // Al abrir, siempre arriba del todo (el navegador recordaba la posición y el aviso de arriba quedaba oculto)
  try{ if('scrollRestoration' in history) history.scrollRestoration = 'manual'; }catch(e){}
  window.scrollTo(0, 0); addEventListener('load', () => window.scrollTo(0, 0));
  $('#sellos-splash').innerHTML = sellosHTML().split('<a class="gp-seal"')[0] + `<p class="splash-ver">web ${VERSION.replace(/^v/, '')}${esApp && versionApp() ? ' · app ' + esc(versionApp()) : ''}</p>`;
  vista = vistaInicial();
  render();
  if(vista === 'dia') centrarBloque();
  enviarResumen();

  // Portada: la flor abre sus pétalos con una nota por pétalo
  const splash = $('#splash');
  let sinPortada = false; try{ sinPortada = sessionStorage.getItem('equilibra.sinPortada') === '1'; sessionStorage.removeItem('equilibra.sinPortada'); }catch(e){}
  if(sinPortada) splash.remove();
  else {
  for(let k = 0; k < 18; k++){
    const c = document.createElement('i'); c.className = 'chispa';
    const ang = Math.random()*Math.PI*2, dist = 90 + Math.random()*120;
    c.style.cssText = `left:50%;top:42%;--dx:${(Math.cos(ang)*dist).toFixed(0)}px;--dy:${(Math.sin(ang)*dist).toFixed(0)}px;animation-delay:${(1 + Math.random()*.8).toFixed(2)}s`;
    splash.appendChild(c);
  }
  // La música de inicio suena por defecto. Si el navegador la bloquea (pasa la primera vez en la web,
  // no en la app instalada), suena en cuanto la persona toca la pantalla por primera vez.
  let sonada = false, musicaFalla = false;
  musica.addEventListener('error', () => { musicaFalla = true; });
  const tocarSonido = () => {
    if(sonada || !sonidoOn) return Promise.resolve(false);
    const ok = () => { sonada = true; $('#tocar').classList.remove('ver'); return true; };
    if(!musicaFalla){
      musica.currentTime = 0;
      return musica.play().then(ok).catch(() => false);
    }
    // Si el archivo no carga, la flor suena con las notas generadas
    const c = audio(); if(!c) return Promise.resolve(false);
    return (c.state === 'running' ? Promise.resolve() : c.resume()).then(() => {
      if(c.state === 'running' && !sonada){ sonarPortada(); return ok(); }
      return false;
    }).catch(() => false);
  };
  tocarSonido();
  // Los móviles solo dejan sonar después de un toque «de verdad» (click / touchend, no pointerdown)
  const EVENTOS = ['click', 'touchend', 'keydown'];
  const alPrimerToque = e => {
    if(e.target.closest && e.target.closest('a')) return;
    EVENTOS.forEach(t => removeEventListener(t, alPrimerToque, true));
    if(performance.now() < 60000) tocarSonido();
  };
  EVENTOS.forEach(t => addEventListener(t, alPrimerToque, true));

  let cerrada = false;
  const cerrar = () => { if(cerrada) return; cerrada = true; splash.classList.add('fuera'); window.scrollTo(0, 0); setTimeout(() => splash.remove(), 700); };
  splash.addEventListener('click', e => {
    if(e.target.closest('a')) return;
    // el toque hace sonar la canción; se deja ver la flor un momento antes de entrar
    if(!sonada && sonidoOn){ tocarSonido(); $('#tocar').classList.remove('ver'); clearTimeout(tCerrar); tCerrar = setTimeout(cerrar, 1800); return; }
    cerrar();
  });
  // Si el móvil no dejó sonar la música sola, la portada espera un toque («Toca para entrar») para que siempre suene
  let tCerrar = setTimeout(() => {
    if(sonada || !sonidoOn) cerrar();
    else $('#tocar').classList.add('ver');
  }, 2600);
  }

  iniciarNube();
  iniciarSalud();
  setTimeout(apuntarApp, 3000);
  // la barra de abajo siempre en el borde visible (en algún móvil quedaba por debajo de la pantalla)
  const ajustarNav = () => {
    const n = $('#nav'), vv = window.visualViewport; if(!n || !vv) return;
    const f = document.activeElement; if(f && /^(INPUT|TEXTAREA)$/.test(f.tagName)){ n.style.transform = ''; return; }
    const d = document.documentElement.clientHeight - (vv.height + vv.offsetTop);
    n.style.transform = d > 2 ? `translateY(${-d}px)` : '';
  };
  if(window.visualViewport){ visualViewport.addEventListener('resize', ajustarNav); visualViewport.addEventListener('scroll', ajustarNav); }
  addEventListener('resize', ajustarNav); setTimeout(ajustarNav, 1500);

  // App instalable (y que funcione sin conexión)
  if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    const habia = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
    // si entra un service worker nuevo (versión nueva), se recarga una vez para mostrarla
    // (antes recargaba siempre y la flor de entrada salía dos veces, aunque la página ya fuera la nueva: ahora solo si hace falta)
    navigator.serviceWorker.addEventListener('controllerchange', () => { if(habia && !recargando) buscarActualizacion(false); });
  }
  setTimeout(() => buscarActualizacion(false), 4000);
  setTimeout(avisoAppNueva, 2000);
  setTimeout(() => window.revisarPermisos(), 3500);
  setTimeout(pintarNotas, 1200);
})();
